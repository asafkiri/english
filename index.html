/* Practice conversations happen to somebody, somewhere. Each scene binds a
   person with a role to a place that fits the topic — a waiter belongs in a
   restaurant, not in a park — and opens and closes with a line of narration
   so it reads as a moment rather than a drill. */
/* Backgrounds use the same idea as the modern cast: a small shared rendering
   contract and scene-specific art. Every scene has far, middle and near depth,
   explicit colour and a quiet centre where the face remains easy to read. */
function sceneMotionProfile(id){
  return ({
    'street-school':'breeze',elevator:'lift','city-square':'plaza','park-bench':'breeze',
    'art-studio':'dust','school-steps':'school','living-room':'home','music-room':'music',
    'basketball-court':'court','school-gate':'school',restaurant:'restaurant','home-kitchen':'kitchen',
    'phone-room':'phone','courtyard-garden':'breeze','clothing-store':'retail','market-stall':'market',
    'bus-stop':'transit','parking-lot':'transit','dog-park':'breeze','home-street':'neighborhood',
    'weather-window':'weather','beach-path':'beach',
  })[id]||'dust';
}
function sceneLightSide(id){
  if(['city-square','park-bench','basketball-court','school-gate','restaurant','market-stall','bus-stop','beach-path','living-room'].includes(id)) return 'right';
  if(['elevator','music-room','phone-room','parking-lot'].includes(id)) return 'center';
  return 'left';
}

function sceneBackdrop(id,p,far,mid,near,motion='',story=''){
  const horizon=p.horizon||500;
  const contactY=Math.min(612,horizon+48);
  const motionProfile=sceneMotionProfile(id),lightSide=sceneLightSide(id);
  const lightBeam=lightSide==='right'
    ? `<ellipse class="scene-light-beam" cx="304" cy="258" rx="125" ry="365" transform="rotate(12 304 258)" fill="url(#${id}-beam)"/>`
    : lightSide==='left'
      ? `<ellipse class="scene-light-beam" cx="96" cy="258" rx="125" ry="365" transform="rotate(-12 96 258)" fill="url(#${id}-beam)"/>`
      : `<ellipse class="scene-light-beam" cx="200" cy="244" rx="135" ry="350" fill="url(#${id}-beam)"/>`;
  return {id,variant:'layered-v4',sky:p.top,ground:p.floor,lightColor:p.glow,lightSide,motionProfile,art:`
    <defs>
      <linearGradient id="${id}-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.top}"/><stop offset="1" stop-color="${p.bottom}"/></linearGradient>
      <radialGradient id="${id}-edge" cx="50%" cy="40%" r="70%"><stop offset="32%" stop-color="#ffffff" stop-opacity="0"/><stop offset="100%" stop-color="#07101e" stop-opacity=".4"/></radialGradient>
      <radialGradient id="${id}-ground" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${p.glow}" stop-opacity=".34"/><stop offset="100%" stop-color="${p.glow}" stop-opacity="0"/></radialGradient>
      <linearGradient id="${id}-floor-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".025"/><stop offset="1" stop-color="#050b14" stop-opacity=".3"/></linearGradient>
      <radialGradient id="${id}-beam" cx="50%" cy="22%" r="58%"><stop offset="0" stop-color="${p.glow}" stop-opacity=".15"/><stop offset="45%" stop-color="${p.glow}" stop-opacity=".055"/><stop offset="100%" stop-color="${p.glow}" stop-opacity="0"/></radialGradient>
      <pattern id="${id}-material" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M3 18h5M15 8h4M18 22h3" stroke="#fff" stroke-opacity=".055" stroke-width="1" stroke-linecap="round"/><circle cx="6" cy="7" r=".8" fill="#fff" fill-opacity=".075"/><circle cx="13" cy="15" r=".55" fill="#07101e" fill-opacity=".12"/></pattern>
    </defs>
    <rect class="scene-base" width="400" height="700" fill="url(#${id}-sky)"/>
    <path class="scene-floor" d="M0 ${horizon}H400V700H0z" fill="${p.floor}"/>
    <path class="scene-floor-depth" d="M0 ${horizon}H400V700H0z" fill="url(#${id}-floor-depth)"/>
    <path class="scene-material" d="M0 ${horizon}H400V700H0z" fill="url(#${id}-material)"/>
    <path d="M0 ${horizon}H400" stroke="${p.line||'#d9e3ef'}" stroke-opacity=".18" stroke-width="3"/>
    <g class="scene-depth scene-depth-far"><g class="backdrop-far">${far}</g></g>
    ${lightBeam}
    <g class="scene-depth scene-depth-mid"><g class="backdrop-mid">${mid}</g></g>
    <g class="backdrop-motion">${motion}</g>
    ${sceneAtmosphere(motionProfile)}
    <g class="scene-perspective" fill="none" stroke="${p.line||'#d9e3ef'}" stroke-opacity=".07" stroke-width="2">
      <path d="M200 ${horizon}L24 700M200 ${horizon}L118 700M200 ${horizon}L282 700M200 ${horizon}L376 700"/>
      <path d="M0 ${contactY+55}H400M0 ${contactY+118}H400"/>
    </g>
    <ellipse class="scene-ground-light" cx="200" cy="${contactY}" rx="112" ry="39" fill="url(#${id}-ground)"/>
    <ellipse class="scene-contact" cx="200" cy="${contactY+13}" rx="53" ry="10" fill="#08111e" opacity=".2"/>
    <g class="scene-depth scene-depth-near"><g class="backdrop-near">${near}</g>${story?`<g class="backdrop-story">${story}</g>`:''}</g>
    <rect class="scene-edge" width="400" height="700" fill="url(#${id}-edge)"/>
  `};
}

  if(style==='long') return `
    <path fill="${dark}" d="M58 94c0-33 18-56 42-56s42 23 42 56c-5-21-18-31-42-31s-37 10-42 31z"/>

    <rect x="64" y="52" width="72" height="22" rx="6"/></g>
    <rect x="64" y="66" width="72" height="9" rx="4" fill="#dfe5ee"/>`;
  return `<path fill="${dark}" d="M58 90c0-32 18-54 42-54s42 22 42 54c-4-20-16-32-30-30-14 2-38 8-54 30z"/>`;
}

function practiceStageActionDuration(action){
  const authored=Number(action?.durationMs);
  if(Number.isFinite(authored)&&authored>=600&&authored<=5000) return authored;
  return STAGE_ACTION_DURATIONS_MS[action?.gesture]||1800;
}
function prefersReducedStageMotion(){
  return !!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
}
function practiceStageActionVisualDelay(action){
  return prefersReducedStageMotion()?0:practiceStageActionDuration(action);
}

function practiceStageDirection(story, beat, variant, phase='ask'){
  const track=PRACTICE_STAGE_DIRECTIONS[story?.id]?.[beat?.id];
  const preset=Array.isArray(track)?track[phase==='reply'?1:0]:null;
  if(!preset||!STAGE_DIRECTION_PRESETS[preset]) return null;
  return {
    id:[story.id,beat.id,variant?.id||'base',phase].join('-'),
    preset,
  };
}

function defaultProfile(){ return {age:17,gender:'male',interest:'',food:'',color:'',animal:''}; }
function normalizeProfile(raw){
  const source=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
  const out=defaultProfile();
  const age=(source.age===''||source.age===null||source.age===undefined)?NaN:Math.floor(Number(source.age));

  for(const key of ['interest','food','color','animal']){
    const value=typeof source[key]==='string'?source[key]:'';
    out[key]=PROFILE_CHOICES[key][value]?value:'';
  }
  return out;

  return String(value??'').replace(/\[\[([^\]|]*)\|([^\]]*)\]\]/g,(_,male,fem)=>female?fem:male);

/* Accent-tolerant word matching. The recognition engine is Apple's and can't

   - a canonical form absorbs classic Hebrew-accent confusions (th→t, w↔v)
   - a small edit distance forgives one mangled letter in longer words
   Critical words (not/no/never) always require an exact match. */
const WORD_EQUIVALENTS = [
  ['good','fine','great','ok'],
  ['hi','hello','hey'],
  ['goodbye','bye'],
  ['mom','mum','mother'],
  ['dad','father'],
  ['yes','yeah','yep'],
  ['football','soccer'],
  ['four','for'],
  ['two','to','too'],
  ['one','won'],
  ['eight','ate'],

const EQUIV_GROUP = new Map();
WORD_EQUIVALENTS.forEach((group,gi)=>group.forEach(w=>EQUIV_GROUP.set(w,gi)));
const EXACT_ONLY = new Set(['not','no','never','without']);
function accentCanon(w){

function editDistance(a,b){
  if(Math.abs(a.length-b.length)>2) return 3;
  const dp=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++)

function matchDetails(target, heard, soft=[]){

  if(!t.length) return {score:1, words:[], matched:[], criticalMismatch:false};
  h = fuseHeard(t,h);
  const softSet = new Set((Array.isArray(soft)?soft:[])
    .flatMap(w=>normalize(w).split(' ')).filter(Boolean));

  // Longest common subsequence: word order matters, while a dropped short word
  // does not automatically fail an otherwise clear beginner sentence.
  const dp = Array.from({length:t.length+1}, ()=>Array(h.length+1).fill(0));
  for(let i=1;i<=t.length;i++){
    for(let j=1;j<=h.length;j++){

  const matched = Array(t.length).fill(false);
  let i=t.length, j=h.length;
  while(i>0 && j>0){
    if(wordsMatch(t[i-1], h[j-1])){ matched[i-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;

  let credited = 0;
  if(softSet.size) t.forEach((w,idx)=>{
    if(!matched[idx] && softSet.has(w)){ matched[idx]=true; credited++; }

  const savedSession = validSavedSession(state.session) ? state.session : null;
  const paused = savedSession && ((!savedSession.isReplay && savedSession.idx===state.completed) || (savedSession.isReplay && savedSession.idx<state.completed)) ? savedSession : null;
  const cur = Math.min(state.completed, LESSONS.length - 1);
  const lesson = LESSONS[cur];
  const words = state.completed * 5;

  let heroHtml;
  if(paused){
    // The map already marks the exact paused lesson and resumes it on tap.
    // A second large resume card duplicated that action and pushed the map down.
    heroHtml = '';
  } else if(allDone){
    heroHtml = `
    <div class="home-focus done">
      <span class="focus-icon">🏆</span>
      <span class="focus-copy"><span class="focus-label">המסלול הושלם</span><b>סיימת את כל הקורס!</b><small>ממשיכים לשמור על האנגלית דרך חזרה ותרגול.</small></span>
    </div>`;
  } else if(doneToday && canStartNew){
    heroHtml = `
    <div class="home-focus done">
      <span class="focus-icon">✅</span>
      <span class="focus-copy"><span class="focus-label">היעד היומי הושלם</span><b>כל הכבוד — השיעור נשמר</b><small>רוצה עוד? שיעור הבונוס מסומן במסלול.</small></span>
    </div>`;
  } else if(doneToday){
    heroHtml = `
    <div class="home-focus done">
      <span class="focus-icon">🔥</span>
      <span class="focus-copy"><span class="focus-label">שני שיעורים היום</span><b>עשית היום כפול</b><small>השיעור הבא ייפתח מחר. בינתיים אפשר לחזור ולתרגל.</small></span>
    </div>`;
  } else {
    heroHtml = `
    <div class="home-focus">
      <span class="focus-icon">🎧</span>
      <span class="focus-copy"><span class="focus-label">היום · כ־${estimateLessonMinutes(cur)} דקות</span><b>${esc(lesson.title)}</b><small>${esc(lesson.goal)} · השיעור מסומן במסלול</small></span>
    </div>`;
  }

  let listHtml = '';
  const focusedLesson = paused ? paused.idx : cur;
  const currentUnit = Math.floor(focusedLesson / LESSONS_PER_UNIT);
  UNITS.forEach((u, ui)=>{
    const first=ui*LESSONS_PER_UNIT;
    const last=Math.min(first+LESSONS_PER_UNIT, LESSONS.length);
    const unitDone=Math.max(0, Math.min(last-first, state.completed-first));
    const complete=unitDone >= last-first;
    const future=first > state.completed;
    const expanded=ui === currentUnit;
    const unitState=complete ? 'complete' : future ? 'future' : 'active';
    const summary=complete ? `${unitDone}/${last-first} הושלמו` : future ? 'ייפתח בהמשך' : `${unitDone}/${last-first} הושלמו`;
    listHtml += `<section class="home-unit ${unitState}${expanded?' active':''}" style="--i:${ui}">
      <button id="homeUnitHead${ui}" class="home-unit-head" onclick="toggleHomeUnit(${ui})" aria-expanded="${expanded}" aria-controls="homeUnitBody${ui}">
        <span class="home-unit-emoji">${u.emoji}</span>
        <span class="home-unit-copy"><b>יחידה ${ui+1} · ${esc(u.title)}</b><span>${complete?'היחידה הושלמה':future?'עוד נגיע לשם':'היחידה הנוכחית'}</span></span>
        <span class="home-unit-progress">${complete?'✓ ':future?'🔒 ':''}${summary}</span>
        <span class="home-unit-chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="homeUnitBody${ui}" class="home-unit-body${expanded?'':' collapsed'}" aria-hidden="${!expanded}"${expanded?'':' inert'}><div class="home-unit-body-inner">`;
    // the promise is concrete and checkable, and shown only for the unit he is in
    if(ui === currentUnit && !allDone) listHtml += `<div class="unit-promise">בסוף היחידה תדע ${esc(unitPromise(ui))}.</div>`;
    listHtml += '<div class="home-unit-lessons">';
    for(let li = first; li < last; li++){
      const l = LESSONS[li];
      const done = li < state.completed;
      const isCur = li === state.completed && !allDone;
      const pausedHere = !!paused && paused.idx === li;
      const cls = pausedHere ? 'paused-here' : done ? 'done' : isCur ? 'current' : 'locked';
      const mark = pausedHere ? '⏸️' : done ? '✓' : isCur ? (!canStartNew ? '🌙' : doneToday ? '🎁' : '▶️') : '🔒';
      const subtitle = pausedHere ? 'עצרת כאן — אפשר להמשיך' : done ? 'הושלם — אפשר לחזור עליו' : isCur ? (!canStartNew ? 'נפתח מחר' : doneToday ? 'זמין כשיעור בונוס 🎁' : 'השיעור של היום') : 'עוד נגיע לשם';
      const click = pausedHere ? 'onclick="resumeLesson()"' : done ? `onclick="startLesson(${li}, true)"` : (isCur && canStartNew) ? `onclick="startLesson(${li}, false)"` : '';
      const disabled = !click ? 'disabled' : '';
      listHtml += `
      <button class="lesson-row ${cls}" ${click} ${disabled}${pausedHere||isCur?' data-home-current="true"':''}>
        <span class="num">${li+1}</span>
        <span class="info"><b>${esc(l.title)}</b><span>${subtitle}</span></span>
        <span class="mark" aria-hidden="true">${mark}</span>
      </button>`;
    }
    listHtml += '</div></div></div></section>';
    if(ui === currentUnit && state.completed > 0) listHtml += `
      <button class="home-path-special" style="--i:${ui+1}" onclick="startPractice()">
        <span class="special-icon">🗣️</span><span class="special-copy"><b>תרגול שיחה חופשי</b><small>תרגול נוסף עם מה שכבר למדת</small></span><span class="special-arrow" aria-hidden="true">‹</span>
      </button>`;
  });

  hx(`
  <div class="screen">
    <div class="top">
      <div class="brand">מדברים אנגלית<small>שיעור קצר ביום, וזהו</small></div>
      <div class="chips">
        <div class="chip">🔥 ${state.streak}</div>
        <button class="chip gear" onclick="openSettings()" aria-label="פתיחת הגדרות">⚙️</button>
      </div>
    </div>
    <div class="hello">

      <p>${esc(
        (!doneToday && state.completed > 0 && state.lastDoneDate && state.lastDoneDate !== yesterdayStr())

          : pick(HOME_LINES)
      )}</p>
    </div>

    <div class="home-map-title"><span>🗺️ המסלול שלך</span><small>לוחצים על השיעור וממשיכים</small></div>

      </div>
      ${missionsDone()?`<div class="home-mission-stat">🎯 ${missionsDone()===1?'משימה אמיתית אחת הושלמה':missionsDone()+' משימות אמיתיות הושלמו'}</div>`:''}
      ${state.completed > 0 ? `<button class="btn secondary home-review-btn" onclick="renderReview()">📚 המשפטים שכבר למדתי</button>` : ''}
    </div>
    <div style="text-align:center;color:var(--dim);font-size:12px;margin-top:18px">גרסה ${APP_VERSION}</div>
  </div>`);
  afterRender(()=>revealCurrentHomeLesson(currentUnit));
  // an update that waited through a lesson applies now, on the home screen
  if(typeof pendingServiceWorker !== 'undefined') tryAutoUpdate();
}

/* ================= lesson player ================= */
let L = null; // current lesson session
let dialogueTimer = null;
let dialogueFlowToken = 0;
let dialogueFlowNext = null;
function invalidateDialogueFlow(cancelVoice=false){
  if(dialogueTimer){ clearTimeout(dialogueTimer); dialogueTimer=null; }
  dialogueFlowNext=null;
  dialogueFlowToken++;
  if(cancelVoice) cancelSpeech();
}
function scheduleDialogueFlow(callback,delay){
  invalidateDialogueFlow(false);
  dialogueFlowNext=callback;
  const token=dialogueFlowToken,session=L,stepIndex=L?.i;
  dialogueTimer=setTimeout(()=>{
    dialogueTimer=null;dialogueFlowNext=null;
    if(!L||L!==session||L.i!==stepIndex||dialogueFlowToken!==token||document.hidden) return;
    callback();
  },delay);
}
/* Opening a translation used to freeze the conversation behind a resume
   button. Nobody wants to operate a tape deck mid-chat: the flow now simply
   grants more time on its own — the pending advance is pushed back, and the
   talk carries on by itself once the reader has had a moment. */
function delayDialogueFlow(extraMs){
  if(dialogueTimer&&dialogueFlowNext) scheduleDialogueFlow(dialogueFlowNext,extraMs);
}
/* A replay holds the automatic advance while the line plays again, then
   re-arms it — across repeated replays too. */
function replayHoldingFlow(text){
  const session=L,stepIndex=L?.i;
  const pending=dialogueTimer?dialogueFlowNext:(session?.replayHeldFlow||null);
  if(dialogueTimer) invalidateDialogueFlow(false);
  if(session) session.replayHeldFlow=pending;
  speak(text,()=>{
    if(!session||L!==session||L.i!==stepIndex) return;
    session.replayHeldFlow=null;
    if(pending) scheduleDialogueFlow(pending,1600);
  });
}
function shuffled(arr){
  const out = arr.slice();
  for(let i=out.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [out[i],out[j]] = [out[j],out[i]];
  }
  return out;
}
// a random subset that keeps the source order — variety without scrambling
function someInOrder(arr, n){
  if(arr.length <= n) return arr.slice();
  const keep = new Set(shuffled(arr.map((_,i)=>i)).slice(0, Math.max(0,n)));
  return arr.filter((_,i)=>keep.has(i));
}
function allLearnedPhrases(idx){
  const out = [];
  for(let li=0;li<idx;li++) LESSONS[li].phrases.forEach((p,pi)=>out.push({p,id:li+':'+pi,li,pi}));
  return out;
}
function warmupOrder(items, hardFirst=false){
  return shuffled(items).sort((a,b)=>{
    const am = (state.reviewMeta || {})[a.id] || {};
    const bm = (state.reviewMeta || {})[b.id] || {};
    if(hardFirst){
      const ah = (am.lapses||0) + (am.hints||0) - (am.successes||0);
      const bh = (bm.lapses||0) + (bm.hints||0) - (bm.successes||0);
      if(ah !== bh) return bh-ah;
    }
    return (am.lastWarmupAt||0) - (bm.lastWarmupAt||0);
  });
}
function takeWarmup(pool, amount, chosen, lastSet, allowRecentRepeat=false){
  if(amount <= 0) return;
  const fresh = pool.filter(x=>!chosen.has(x.id) && (allowRecentRepeat || !lastSet.has(x.id)));
  const repeated = pool.filter(x=>!chosen.has(x.id) && !fresh.includes(x));
  for(const item of [...fresh,...repeated]){
    if(amount-- <= 0) break;
    chosen.set(item.id,item);
  }
}
function arrangeWarmup(items, hardSet, recentStart){
  const hard = shuffled(items.filter(x=>hardSet.has(x.id)));
  const recent = shuffled(items.filter(x=>!hardSet.has(x.id) && x.li>=recentStart));
  const older = shuffled(items.filter(x=>!hardSet.has(x.id) && x.li<recentStart));
  const ordered = [];
  // At the 20-item cap this creates H-R-H-O instead of a discouraging block
  // of ten difficult phrases followed by everything else.
  while(hard.length || recent.length || older.length){
    if(hard.length) ordered.push(hard.shift());
    if(recent.length) ordered.push(recent.shift());
    if(hard.length) ordered.push(hard.shift());
    if(older.length) ordered.push(older.shift());
  }
  return ordered;
}
function selectWarmup(idx, target){
  const learned = allLearnedPhrases(idx);
  const hardSet = new Set(state.hard || []);
  const lastSet = new Set(state.lastWarmupIds || []);
  const chosen = new Map();
  const recentStart = Math.max(0,idx-2);
  const olderExists = learned.some(x=>x.li < recentStart);
  const recentReserve = Math.min(5,Math.max(1,Math.floor(target/4)));
  const oldReserve = olderExists ? Math.min(5,Math.max(1,Math.floor(target/4))) : 0;
  const hardReserve = Math.min(10,Math.max(0,target-recentReserve-oldReserve));

  const hard = warmupOrder(learned.filter(x=>hardSet.has(x.id)), true);
  takeWarmup(hard,hardReserve,chosen,lastSet);

  const recent = warmupOrder(learned.filter(x=>!hardSet.has(x.id) && x.li>=recentStart));
  takeWarmup(recent,recentReserve,chosen,lastSet);

  const older = warmupOrder(learned.filter(x=>!hardSet.has(x.id) && x.li<recentStart));
  takeWarmup(older,oldReserve,chosen,lastSet);

  // Fill a small/uneven bucket without duplicating a phrase.
  takeWarmup(warmupOrder(learned.filter(x=>!hardSet.has(x.id))),target-chosen.size,chosen,lastSet);
  takeWarmup(hard,target-chosen.size,chosen,lastSet);
  return arrangeWarmup([...chosen.values()].slice(0,target),hardSet,recentStart);

function resolvePracticeBeat(storyOrId, beatIndex, vars={}){

    id:beat.id, role:variant.role||beat.role||'mid', variantId:variant.id||'base',
    ask:variant.ask, options:variant.options, event:variant.event||beat.event||null,

function fillPracticeStoryTokens(value, field='en', storyId=L?.practiceStoryId, vars=L?.practiceVars){
  let out=String(value??'');
  const story=practiceStoryById(storyId);
  if(!story||!vars||typeof vars!=='object') return out;
  for(const [key,selected] of Object.entries(vars)){
    const token=story.values?.[key]?.[selected];
    if(!token) continue;
    out=out.replace(new RegExp('\\{'+key+'\\}','g'),token[field]||token.en||String(selected));
  }

}
function materializePracticeBeat(beatIndex, session=L){
  if(!session?.practiceStoryId||!Number.isInteger(beatIndex)||beatIndex<0) return false;
  const story=practiceStoryById(session.practiceStoryId);
  const beat=resolvePracticeBeat(story,beatIndex,session.practiceVars||{});
  if(!story||!beat) return false;
  const at=1+beatIndex*4;
  if(at+1>=session.steps.length) return false;
  session.steps[at]={
    type:'listen',line:beat.ask,isBranchAsk:true,roundIndex:beatIndex,

    .filter(id=>typeof id==='string'&&known.has(id)))].slice(-PRACTICE_STORIES.length);

function practiceStoryCycleState(value){
  const epoch=Math.max(0,Math.floor(Number(value?.practiceStoryEpoch)||0));
  const seen=normalizePracticeStoryIds(value?.practiceStorySeen);
  let catalog=normalizePracticeStoryIds(value?.practiceStoryCatalog);
  // States written before the catalog snapshot existed still know their
  // completed lesson. Reconstruct the active catalog once during migration.
  if(!catalog.length){
    catalog=availablePracticeStories(Math.max(0,Math.floor(Number(value?.completed)||0)))
      .map(story=>story.id);

function mergePracticeStoryCycles(localValue,storedValue){
  const local=practiceStoryCycleState(localValue),stored=practiceStoryCycleState(storedValue);
  if(local.epoch===stored.epoch){
    return {
      epoch:local.epoch,
      seen:normalizePracticeStoryIds([...stored.seen,...local.seen]),
      catalog:normalizePracticeStoryIds([...stored.catalog,...local.catalog]),
    };
  }
  const higher=local.epoch>stored.epoch?local:stored;
  const lower=higher===local?stored:local;
  const higherCatalog=new Set(higher.catalog);
  // Usually an older cycle's consumed cards must stay behind. The exception
  // is a catalog that expanded in that older tab after the newer cycle began;
  // otherwise an already-started conversation could become eligible again.
  const lowerCatalog=new Set(lower.catalog);
  const lowerExpandedCatalog=higher.catalog.every(id=>lowerCatalog.has(id))&&
    lower.catalog.some(id=>!higherCatalog.has(id));
  // If the older epoch belongs to a strictly larger (newly unlocked)
  // catalog, carry its whole consumed set. Skipping a card once is safer than
  // repeating a conversation that another tab has already started.
  const carriedSeen=lowerExpandedCatalog

function practiceStoryLengthPool(stories,available,completed=state.completed){
  const targetTurns=Math.min(7,4+Math.floor(completed/6));
  const full=stories.filter(story=>story.beats.length>=targetTurns);
  const quick=stories.filter(story=>story.beats.length<targetTurns);
  if(!full.length||!quick.length) return stories;
  const active=Array.isArray(available)?available:stories;
  const quickIds=new Set(active.filter(story=>story.beats.length<targetTurns).map(story=>story.id));

  const seen=normalizePracticeStoryIds(state.practiceStorySeen).filter(id=>activeIds.has(id));

function buildPracticeSession(){

  // rendered. Pull that recency history in before choosing, not after.

  if(!available.length) return null;
  const remaining=remainingPracticeStories(available);
  /* Pick the authored story first, so a story with more background variants
     is not accidentally shown more often. Only then pick a compatible scene.
     Story, person and place each have their own recency memory. */
  const lengthPool=practiceStoryLengthPool(remaining,available);
  const recentStories=recentlySeen(state.practiceRecentStories,available.length);
  let storyPool=lengthPool.filter(story=>!recentStories.has(story.id));
  if(!storyPool.length) storyPool=lengthPool;

    story.sceneIds.map(practiceSceneById).filter(Boolean).map(row=>row.charId))).size);
  const freshPersonStories=storyPool.filter(story=>story.sceneIds.map(practiceSceneById).filter(Boolean)

  let scenes=story.sceneIds.map(practiceSceneById).filter(Boolean);
  const recentScenes=recentlySeen(state.practiceRecent,scenes.length);
  const lastChar=(state.practiceRecentChars||[]).slice(-1)[0];

    row=>!recentScenes.has(row.sceneId)&&!recentChars.has(row.charId),
    row=>!recentChars.has(row.charId),
    row=>!recentScenes.has(row.sceneId),
    row=>row.charId!==lastChar,

  for(const wanted of scenePreferences){
    const options=scenes.filter(wanted);

  }
  const {scene,sceneId,charId}=picked;
  const character=PRACTICE_CAST[charId]||CHARACTERS[charId];

/* The 'seen lately' window has to fit the pool it filters. Remembering six

   collapses back to pure chance — which is how the same person came round
   three times running. Keep at most one short of the pool, so something is
   always genuinely fresh. */

  const keep = Math.max(0, Math.min(6, poolSize-1));

function pushRecent(list, value, limit=6){

/* These lists mean recency. Keep the tab with the newer progress timestamp at
   the end, and prepend only genuinely missing items from the older copy. A
   stale tab must never move its old entries back to the newest positions. */
function mergeRecent(stored, local, limit=6, storedIsNewer=false){
  const clean=value=>{
    const list=(Array.isArray(value)?value:[]).filter(x=>typeof x==='string');
    return list.filter((x,i)=>list.lastIndexOf(x)===i);
  };
  const newest=clean(storedIsNewer?stored:local);
  const older=clean(storedIsNewer?local:stored);

  return [...older.filter(x=>!newestSet.has(x)),...newest].slice(-Math.max(1,limit));

function beginPracticeSession(){

  // opened a session, do not replace it when the queued callback arrives.
  if(L) return false;
  const session = buildPracticeSession();
  if(!session){ toast('צריך לסיים שיעור אחד לפני שנפתח תרגול שיחה 🙂'); return false; }
  if(!rememberPracticeRun(session.sceneId,session.charId,session.story.id)){
    toast('לא הצלחנו לשמור את מחזור השיחות. כדאי לנסות שוב.');
    return false;
  }
  const steps = [{type:'practiceIntro'}];
  session.story.beats.forEach((_,roundIndex)=>{
    steps.push({type:'practiceBeatPending',roundIndex});
    steps.push({type:'practiceChoicePending',roundIndex});
    steps.push({type:'branchPending'});
    steps.push({type:'branchPending'});
  });
  steps.push({type:'practiceDone'});
  L = {
    idx:Math.max(0,state.completed-1), lesson:LESSONS[Math.max(0,state.completed-1)],
    steps, i:0, isReplay:true, isPractice:true, practiceMeta:session.meta,
    practiceTopicId:session.story.id, practiceSceneId:session.sceneId,
    practiceStoryId:session.story.id, practiceVars:initialPracticeVars(session.story), practiceDecisions:[],
    stageWorld:initialPracticeStageWorld(session.story), stagePlayedActions:[], pendingStageAction:null,
    practiceRoundCount:session.story.beats.length,

    elapsedBeforeMs:0, activeSince:Date.now(), chat:[], warmupIds:[],
    chatExpanded:false,

function startPractice(){
  if(L){
    return askConfirm({title:'יש שיעור פתוח', text:'לצאת ממנו ולעבור לתרגול שיחה? המקום בשיעור יישמר.',
      ok:'כן, לתרגול שיחה', cancel:'לא, להישאר בשיעור'}).then(ok=>{
      if(!ok || !L) return false;
      stopLessonTimers(true); L=null;
      return startPractice();
    });
  }
  // Web Locks makes choosing + recording one critical section across tabs.
  // Older browsers keep the synchronous fallback and still reconcile storage
  // immediately before both operations.
  if(navigator.locks?.request){
    let enteredLock=false;
    const recoverLockFailure=()=>{
      if(!enteredLock) return beginPracticeSession();
      toast('לא הצלחנו לפתוח את השיחה. כדאי לנסות שוב.');
      return false;
    };
    try{
      const locked=navigator.locks.request('speak-english-practice-story',{mode:'exclusive'},()=>{
        enteredLock=true;
        return beginPracticeSession();
      });
      return Promise.resolve(locked).catch(recoverLockFailure);
    }catch(e){ return recoverLockFailure(); }
  }
  return beginPracticeSession();
}

function jsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
/* each English word becomes tappable — tap hears just that word; 🔊 plays the whole sentence */
function wordSpans(en){
  return String(en).split(' ').map((w,i)=>{
    const clean = w.replace(/[^A-Za-z']/g,'');
    if(!clean) return esc(w);
    return `<button type="button" class="w" data-i="${i}" lang="en" onclick="event.stopPropagation();speak('${jsEsc(clean)}')" aria-label="השמעת ${esc(clean)}">${esc(w)}</button>`;
  }).join(' ');
}
function learningWordSpans(en,details=null){
  let i=0;
  return String(en).split(/(\s+)/).map(part=>{
    if(!part) return '';
    if(/^\s+$/.test(part)) return part;
    const cls=details?.matched ? (details.matched[i]?' heard-ok':' heard-miss') : '';
    return `<span class="w${cls}" data-i="${i++}">${esc(part)}</span>`;
  }).join('');
}

function syncStageVisualBlock(el, key, html){

function swapStageBlock(el, html){
  if(!el) return;
  const changed=el.__stageHtml!==html;
  // the markup is always rebuilt from state, exactly as a full render would
  el.__stageHtml=html;
  el.innerHTML=html;
  // but pause/resume redraws the same words — don't make them jump again
  if(!changed) return;
  el.classList.remove('stage-swap');
  void el.offsetWidth;
  el.classList.add('stage-swap');

function updateStageInPlace(sceneKey, state_, cue, caption, composer, pct, meta, history,directionCue){
  const screen=document.querySelector('#app > .conversation-screen.stage-screen');
  if(!screen||screen.dataset.scene!==sceneKey) return false;
  // the side effects a full render would have had
  uiEpoch++;
  cancelAutoSpeak();
  stopRecognition();
  const bar=screen.querySelector('.pbar');
  if(bar){ bar.setAttribute('aria-valuenow',String(pct)); const fill=bar.querySelector('i'); if(fill) fill.style.width=pct+'%'; }
  const timer=screen.querySelector('#timer');
  if(timer) timer.textContent=elapsed();
  const avatar=screen.querySelector('.stage-avatar');
  const modern=meta.character?.look?.variant==='modern-v2';
  const bd=PRACTICE_BACKDROPS[meta.bg]||PRACTICE_BACKDROPS['living-room'];
  const stageVisual=practiceStageModel(L);
  const direction=stageDirectionModel(directionCue);
  const rainy=stageVisual.world.weather==='rain';
  const bg=screen.querySelector('.stage-bg');
  if(bg){
    bg.className='stage-bg scene-motion-'+(bd.motionProfile||'dust')+(rainy?' has-story-rain':'')+stageWorldClasses(stageVisual)+stageBackdropMomentClasses(direction);
    bg.dataset.stageCue=direction?.id||'';
  }
  syncStageVisualBlock(screen.querySelector('#stageWeather'),stageVisual.key,stageWeatherHtml(stageVisual));
  applyStageAvatarClass(avatar,stageAvatarClassName(state_,meta,modern,bd,stageVisual,direction),direction);
  syncStageVisualBlock(screen.querySelector('#stageStoryProps'),stageVisual.key,stagePropsHtml(stageVisual));
  syncStageVisualBlock(screen.querySelector('#stageMomentFx'),direction?.id||'none',stageMomentFxHtml(direction));
  const art=screen.querySelector('.person-art');
  if(art){
    // never silence a mouth mid-word: the live voice classes survive the morph
    const keep=['voicing','mouth-js'].filter(c=>art.classList.contains(c));
    // variant classes are part of the illustration, not of the current beat
    const transient=new Set(['idle','waiting','speaking','listening','reacting','thinking','voicing','mouth-js','mic-live','retry-tilt','happy']);
    const persistent=[...art.classList].filter(c=>c!=='person-art'&&!transient.has(c));
    art.setAttribute('class',['person-art',...persistent,state_,...keep].join(' '));
  }
  const place=screen.querySelector('.stage-place');
  if(place) place.innerHTML=stagePlaceHtml(meta,history);
  const status=screen.querySelector('#stageStatus');
  if(status){ status.className='stage-status cue-'+cue; status.innerHTML=stageCueHtml(cue,meta.character); }
  swapStageBlock(screen.querySelector('#stageCaption'),caption);
  swapStageBlock(screen.querySelector('.conversation-composer'),composer);
  requestAnimationFrame(keepStageCaptionVisible);
  return true;
}

/* A reply followed immediately by the character's next question is one
   natural turn. Keep that reply in working memory instead of replacing it:
   only the adjacent pair is shown, so older or learner-separated messages
   never grow into a second chat history inside the stage. */
function stageCaptionSequence(){
  const step=L?.steps?.[L.i];
  const currentIndex=step?.type==='listen'?L.i:step?.type==='branchChoice'?L.i-1:-1;
  const current=L?.steps?.[currentIndex];
  if(currentIndex<0||current?.type!=='listen'||!current.line) return [];
  const previous=L.steps[currentIndex-1];
  return previous?.type==='listen'&&previous.line?[previous,current]:[current];
}
/* Both sentences belong to one card and one top-to-bottom read. The earlier
   line used to sit in its own bordered box with a "קודם" tab, so a learner
   halfway through reading it saw a second box arrive and lost their place.
   Now it is simply the quieter line above, separated by a hairline: the size
   difference already says which one is being spoken, so the labels stay for
   screen readers and leave the screen alone. The two keep their own full
   stops — joining them with a comma would teach a comma splice. */
function stagePreviousCaptionHtml(item){
  const en=ptext(item.line,'en'),he=ptext(item.line,'he');
  return `<div class="cap-previous" data-caption-role="previous">
    <div class="cap-turn-label sr-only">קודם</div>
    <div class="cap-previous-en" dir="ltr" lang="en" data-word-sync>${esc(en)}</div>
    <div class="cap-previous-he" dir="rtl" lang="he">${esc(he)}</div>
  </div>`;
}
/* True while this beat is part of a two-line pair — including the beat just
   BEFORE the second line lands. The stage reserves the pair's room from that
   moment, so the arriving line never resizes the figure under the reader. */
function stageCaptionPairing(){
  if(stageCaptionSequence().length>1) return true;
  const step=L?.steps?.[L.i];
  if(step?.type!=='listen'||!step.line) return false;
  const next=L?.steps?.[L.i+1];
  return next?.type==='listen'&&!!next.line;
}
function stageCaptionHtml(line,step,opts={}){
  const sequence=stageCaptionSequence();
  if(sequence.length<2){
    const solo=captionHtml(line,step,opts);
    return stageCaptionPairing()?`<div class="cap-pair cap-pair-lead">${solo}</div>`:solo;
  }
  return `<div class="cap-sequence cap-pair">
    ${stagePreviousCaptionHtml(sequence[0])}
    <div class="cap-current" data-caption-role="current">
      <div class="cap-turn-label sr-only">עכשיו</div>
      ${captionHtml(line,step,{...opts,previousReplay:true})}
    </div>
  </div>`;
}
function toggleCaptionAid(kind, button){

  const field=kind==='tl'?'showTl':'showHe';
  step[field]=!step[field];
  const panel=document.getElementById(kind==='tl'?'capTl':'capHe');
  if(panel) panel.hidden=!step[field];

function stageCaptionLine(){

  // while choosing an answer the caption still shows the last thing the
  // character said — that is the line the replay button must repeat
  if(step.type==='branchChoice') return L.steps[L.i-1]?.type==='listen'
    ? L.steps[L.i-1].line
    : [...(L.chat||[])].reverse().find(x=>x.who==='app')?.line || null;

  rec.onend=()=>{
    if(!active()) return;
    L.rec=null;
    restoreMicButton();
    if(done) return;
    if(!got){
      const t=hint.textContent;
      if(t.indexOf('מקשיב')>-1||t.indexOf('בודק')>-1) hint.textContent='לא שמעתי כלום — נסה שוב, קרוב לטלפון 🎤';
      revealEscapes();
      return;
    }
    // the attempt ended without a clear pass — one full try, judged on the
    // best transcript heard during the whole attempt. Only now is the
    // word-by-word feedback revealed, so it can't spoil the answer mid-attempt
    const step=L.curStep||{};
    step.tries=(step.tries||0)+1;
    L.tries=step.tries;
    step.heardDetails=bestDetails;
    saveLessonCheckpoint();
    const missed=bestDetails.words.filter((w,i)=>!bestDetails.matched[i]);
    // a transcript that shares almost nothing with the sentence is engine
    // noise, not his English: showing it back word for word only humiliates
    if(bestDetails.score<.40&&(missed.length||bestDetails.criticalMismatch)){
      step.heardText=''; step.heardDetails=null;
    }
    if(!bestDetails.criticalMismatch&&!missed.length){
      recordStepResult(step,'pass');
      showResult('pass',pick(PRAISE));
    } else if(bestDetails.score>=.70&&!bestDetails.criticalMismatch&&L.tries<3){
      // almost there — a word went missing, so the practice repeats it
      showResult('retry','כמעט! 👏 לא שמעתי את: ' + missed.join(', ') + ' — עוד פעם, והפעם תדגיש אותה 💪');
    } else if(L.tries>=3){
      recordStepResult(step,'fail');
      if(step.warmup) showResult('pass','לא נורא — המשפט הזה יחזור בחימום הבא. ממשיכים! 💪');
      else if(step.requeued) showResult('pass','התאמנת על זה חזק היום — עם עוד תרגול זה יישב. ממשיכים! 💪');
      else if(step.isDlg) showResult('pass','כל הכבוד שניסית — נמשיך בשיחה והמשפט יחזור בתרגול 💪');
      else showResult('requeue','הטלפון עדיין לא קלט את כל המשפט. נמשיך ונחזור אליו שוב בסוף');
    } else if(bestDetails.score>=.40) showResult('retry',pick(ALMOST));
    else showResult('retry','הטלפון לא הבין הפעם. נסה שוב לאט וקרוב לטלפון — יש לך את זה');
  };
  try{rec.start(); markMicPrimed();}
  catch(e){
    if(L&&L===session&&L.rec===rec) L.rec=null;
    restoreMicButton();
    showMicFallback('בדיקת הקול לא נפתחה. אמור את המשפט בקול והמשך ידנית.', true);
  }
}
function paintGuidedLearningWords(details){

function showResult(kind, msg){

  // a smile when it landed, a patient tilt of the head when it didn't yet
  afterRender(()=>{

function requeueAndNext(){
  const step = L.curStep;
  recordStepResult(step,'fail');
  if(step && !step.requeued && !step.warmup){
    const hid = step.hid || null;
    const doneIdx = L.steps.findIndex(s=>s.type === 'done');
    L.steps.splice(doneIdx, 0, {type:'speak', p:step.p, isDlg:step.isDlg, requeued:true, hid});
    saveLessonCheckpoint();
  }
  next();

function selectOrderChunk(id){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order'||step.correct||step.orderLocked||step.selected.includes(id)) return;
  if(id!==step.selected.length){
    const session=L,stepIndex=L.i;
    step.orderLocked=true;
    step.returningChunkId=id;
    step.selected.push(id);
    if(!step.hadWrong){ step.hadWrong=true; step.usedHint=true; noteHint(step); }
    renderOrder(step);
    session.orderReturnTimer=setTimeout(()=>{
      if(!L||L!==session||L.i!==stepIndex||L.steps[L.i]!==step) return;
      session.orderReturnTimer=null;
      if(step.selected.at(-1)===id) step.selected.pop();
      step.orderLocked=false;
      delete step.returningChunkId;
      step.wrongPulseId=id;
      saveLessonCheckpoint();
      renderOrder(step);
      setTimeout(()=>{ if(step.wrongPulseId===id) delete step.wrongPulseId; },420);
    },360);
    return;
  }
  step.selected.push(id);
  if(step.selected.length===step.chunks.length){
    step.correct=true;
    step.wrong=false;
    recordStepResult(step,'pass');
    if(navigator.vibrate) navigator.vibrate([32,35,55]);
  }
  saveLessonCheckpoint();
  renderOrder(step);
}
function scheduleOrderSuccess(step,en){
  const session=L,stepIndex=L?.i;
  if(!session) return;
  scheduleSpeak(en,560,()=>{
    if(!L||L!==session||L.i!==stepIndex||L.steps[L.i]!==step) return;
    document.querySelector('.order-challenge')?.classList.remove('is-audio-live');
    if(session.orderAdvanceTimer) clearTimeout(session.orderAdvanceTimer);
    session.orderAdvanceTimer=setTimeout(()=>{
      if(!L||L!==session||L.i!==stepIndex||L.steps[L.i]!==step) return;
      session.orderAdvanceTimer=null;
      next();
    },720);
  },()=>{
    if(L===session&&L.i===stepIndex) document.querySelector('.order-challenge')?.classList.add('is-audio-live');
  });
}
function undoOrder(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order'||step.correct||step.orderLocked) return;
  step.selected.pop(); step.wrong=false; delete step.wrongPulseId; saveLessonCheckpoint(); renderOrder(step);
}
function resetOrder(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order') return;
  step.selected=[]; step.wrong=false; step.orderLocked=false; delete step.returningChunkId; delete step.wrongPulseId; saveLessonCheckpoint(); renderOrder(step);

function renderListen(step){
  invalidateDialogueFlow(true);
  const line=step.line,meta=conversationMeta(L.idx),spokenEn=ptext(line,'en',true);
  // Two lines from the same character in a row are one turn, not two
  // messages: no 'about to speak' announcement in between, and only a
  // breath between the sentences instead of a full reading pause.
  const continuing=L.steps[L.i-1]?.type==='listen';
  // a line is required, matching what the paired caption itself asks for:
  // otherwise a lineless follow-up step earns the short breath without ever
  // producing the pair the breath exists for
  const runsOn=L.steps[L.i+1]?.type==='listen'&&!!L.steps[L.i+1].line;
  if(continuing) step.arrived=true;
  const stageActionStarted=L.isPractice&&step.arrived?enterPracticeStageAction(step,L):false;
  const stageActionStartedAt=stageActionStarted?Date.now():0;
  const stageActionVisualMs=stageActionStarted?practiceStageActionVisualDelay(L.pendingStageAction):0;
  const current=step.arrived?{who:'app',line,showHe:!!step.showHe,showTl:!!step.showTl}:null;
  const typing=`<div class="dlg-line typing-line"><div class="dlg-avatar" aria-hidden="true">${meta.character.avatar}</div><div class="dlg-bubble voice-note">🎙️ ${esc(meta.character.name)} שולח הודעה<span class="vdots"><i></i><i></i><i></i></span></div></div>`;
  // No pause and no skip: the conversation just flows, like a real one.
  // Whoever needs a moment gets it by opening an aid or replaying a line —
  // the flow waits a little longer on its own and then carries on.
  const composer=`
    <div class="flow-controls">
      <span id="flowStatus">${step.arrived?meta.character.name+' מדבר…':'הודעה חדשה בדרך…'}</span>
    </div>`;
  if(usesConversationStage()){
    const eventHtml=storyEventHtml(step.event);
    stageShell(step.arrived?'speaking':'waiting',
      step.arrived
        ? eventHtml+stageCaptionHtml(line,step,{translationDelay:L.isPractice})
        : `<div class="cap-typing">${esc(meta.character.name)} עומד לדבר<span class="vdots"><i></i><i></i><i></i></span></div>`,
      composer,
      step.arrived?'speaking':'incoming',
      step.arrived?step.stageCue:null);
    if(stageActionStarted){
      requestAnimationFrame(keepStageActionVisible);
      schedulePracticeStageActionSettle(L);
    }
    announceStageEvent(step.arrived?step.event:null);
  } else {
    dialogueShell(chatMessagesHtml(current,step.arrived?'conversation-current':'' )+(step.arrived?'':typing),composer);
  }
  if(!step.arrived){
    scheduleDialogueFlow(()=>{ step.arrived=true;saveLessonCheckpoint();renderListen(step); },600);
    return;
  }
  // when the same character keeps talking, a breath is enough — but without a
  // voice the delay is the only time there is to read, so keep that readable
  const voiced='speechSynthesis' in window;
  // Mid-turn this is the pause between two sentences of one thought, so it
  // should sound like one — a speaker's beat, not a wait. Without a voice the
  // delay is the only time there is to read, so that case keeps its window.
  const readingDelay=runsOn
    ? (voiced?600:Math.max(1200,Math.min(2600,spokenEn.length*32)))
    : Math.max(1900,Math.min(3400,spokenEn.length*38));
  const speechDeadline=Date.now()+20000;
  const afterSpeech=()=>{
    const status=document.getElementById('flowStatus');
    if(status) status.textContent=runsOn?meta.character.name+' ממשיך…':'ממשיך בעוד רגע…';
    // an open translation means someone is reading — grant the extra beat
    // A short follow-up line used to move on after only 340ms. The permanent
    // Hebrew needs a real, length-aware reading window even in a flowing turn.
    /* This window exists so a translation is not whisked away before a
       beginner can read it, and it stays length-aware for that reason.
       Mid-turn, though, nothing is whisked away: the pair keeps this sentence
       and its Hebrew on screen above the next one, and through the answer
       screen after it. So the window shrinks to a speaker's scale rather than
       disappearing — long enough for the eye to land on the Hebrew, short
       enough that the character no longer stands silent for 2.2s between two
       halves of one thought, which is what made a run-on turn sound like a
       stalled recording rather than a person talking. */
    const translatedLength=ptext(line,'he').length;
    const translationReadingDelay=runsOn
      ? Math.max(700,Math.min(1200,translatedLength*22))
      : Math.max(2200,Math.min(3800,translatedLength*45));
    const actionRemaining=stageActionStarted?Math.max(0,stageActionVisualMs-(Date.now()-stageActionStartedAt)):0;
    const actionReadingDelay=actionRemaining?actionRemaining+180:0;
    scheduleDialogueFlow(()=>next(),Math.max(readingDelay,translationReadingDelay,actionReadingDelay)+(step.showTl?1800:0));
  };
  const watchdog=()=>{
    if('speechSynthesis' in window&&speechSynthesis.speaking){
      if(Date.now()<speechDeadline){ scheduleDialogueFlow(watchdog,900); return; }
      // a stuck speech engine must not stall the conversation: cut it loose
      cancelSpeech();
      afterSpeech();
      return;
    }
    afterSpeech();
  };
  scheduleDialogueFlow(watchdog,Math.max(5500,spokenEn.length*160));
  speak(spokenEn,afterSpeech);
}

function chooseBranch(optionIndex,startSpeaking=false){
  const step=L?.steps[L.i];
  if(!step||step.type!=='branchChoice'||!step.options[optionIndex]) return;
  invalidateDialogueFlow(true);
  const option=step.options[optionIndex];
  step.selectedIndex=optionIndex;
  if(L.practiceStoryId){
    L.practiceVars=applyPracticeChoice(L.practiceVars,option);
    L.practiceDecisions=L.practiceDecisions||[];
    L.practiceDecisions.push({beatId:step.practiceBeatId,optionId:option.id||String(optionIndex)});
    materializePracticeBeat(step.roundIndex+1,L);
  }
  const hid=phraseIdForText(option.answer.en,L.idx);
  L.steps.splice(L.i+1,2,
    {type:'speak',p:option.answer,isDlg:true,challenge:true,hid,branch:true,roundIndex:step.roundIndex,
      hintLevel:0},
    {type:'listen',line:option.reply,isBranchReply:true,roundIndex:step.roundIndex,
      practiceBeatId:step.practiceBeatId,practiceVariantId:step.practiceVariantId,
      stageCue:option.stageCue||step.replyStageCue||null,
      stageAction:option.replyStageAction||null,event:option.replyEvent||null}

  if(startSpeaking&&micAvailable()){
    const session=L,stepIndex=L.i,target=ptext(option.answer,'en',true);
    afterRender(()=>{
      if(!L||L!==session||L.i!==stepIndex||L.steps[L.i]?.type!=='speak'||L.rec) return;
      micTap(target);
    });
  }
}

/* ---- done ---- */
function renderDone(){
  const durationMs=activeElapsedMs();
  pauseLessonClock();
  stopLessonTimers(false);
  const wasReplay = L.isReplay;
  let streakNote = '', milestones = [], streakReset = false;
  if(!wasReplay){
    state.completed = Math.max(state.completed, L.idx + 1);
    const today = todayStr();
    if(state.lastDoneDate === today){
      // a bonus lesson: the day's counter grows, the streak already counted
      state.lessonsToday = lessonsDoneToday() + 1;
    }
    if(state.lastDoneDate !== today){
      const prevStreak = state.streak;
      if(state.lastDoneDate === dateNDaysAgo(1)){
        state.streak++;
      } else if(state.lastDoneDate === dateNDaysAgo(2) && Date.now() - (state.lastGraceTs || 0) > 6*864e5){
        // one missed day forgiven, once a week — the streak survives
        state.streak++;
        state.lastGraceTs = Date.now();
        streakNote = 'פספסת יום אחד — אבל הרצף שלך ניצל 🛟 (קורה לכולם)';
      } else {
        // The streak is gone, but this is not the screen to say so: the loss
        // must not land on the medal. He gets the fact that matters instead —
        // he came back — and the day still counts on the counter that only grows.
        if(state.lastDoneDate){
          const away = daysBetween(state.lastDoneDate, today);
          streakReset = prevStreak > 1;
          streakNote = away > 1
            ? 'חזרת אחרי ' + away + ' ימים, וזה הדבר הכי חשוב. ממשיכים בדיוק מאותו מקום 💪'
            : 'חזרת — וזה מה שחשוב! ממשיכים 💪';
        }
        state.streak = 1;
      }
      state.daysLearned = (Number(state.daysLearned)||0) + 1;
      state.lastDoneDate = today;
      state.lessonsToday = 1;
      const STREAK_MSGS = {3:'שלושה ימים — זה כבר מתחיל להיות הרגל!', 7:'שבוע שלם ברצף! רצינות אמיתית', 14:'שבועיים ברצף — אתה מכונה!', 30:'חודש שלם. וואו. פשוט וואו'};
      if(state.streak !== prevStreak && STREAK_MSGS[state.streak])
        milestones.push('🔥 ' + state.streak + ' ימים ברצף — ' + STREAK_MSGS[state.streak]);
    }
    if((L.idx + 1) % LESSONS_PER_UNIT === 0){
      const ui = Math.floor(L.idx / LESSONS_PER_UNIT), u = UNITS[ui];
      milestones.push('🏆 סיימת את כל יחידת "' + u.title + '"! עכשיו אתה יודע ' + unitPromise(ui) + ' — ' + (state.completed*5) + ' משפטים באנגלית');
    }
  } else {
    state.replays=(state.replays||0)+1;
  }
  touchState('progressUpdatedAt');
  rememberFinishedRun(L.runId);
  state.session=null;
  touchState('sessionUpdatedAt');
  save();
  confetti();
  if(milestones.length) setTimeout(confetti, 900);
  const mins = Math.max(1, Math.round(durationMs/60000));
  const nm = state.name ? ' ' + state.name : '';
  // finishing the fifth lesson of a unit hands straight over to its rehearsal
  const finishedUnit = !wasReplay && (L.idx+1) % LESSONS_PER_UNIT === 0 ? Math.floor(L.idx/LESSONS_PER_UNIT) : -1;
  playerShell(`
    <div class="finish">
      <div class="emoji">${wasReplay ? '🔁' : milestones.length ? '🏆' : '🏅'}</div>
      <h2>${wasReplay ? 'סיימת את החזרה!' : 'כל הכבוד' + esc(nm) + '!'}</h2>
      <p>${wasReplay
          ? 'חזרת על שיעור — וזה בדיוק מה שהופך ידע לזיכרון לתמיד.'
          : `סיימת את שיעור ${L.idx+1} ${mins===1?'בדקה אחת':'ב־'+mins+' דקות'} · 5 משפטים חדשים שלך 🗣️`}
      </p>
      ${!wasReplay && !streakReset ? `<div class="chip" style="display:inline-flex;margin-top:4px">🔥 ${esc(streakLabel(state.streak))}</div>` : ''}
      ${streakNote ? `<div class="streak-note">${esc(streakNote)}</div>` : ''}
      ${canSayHtml(L.idx, wasReplay ? '🗣️ חזרת ואמרת:' : '🗣️ מהיום אתה יכול להגיד:')}
      ${milestones.map(m=>`<div class="milestone">${esc(m)}</div>`).join('')}
      <div class="quote">💬 ${esc(pick(FINISH_QUOTES))}</div>
      ${finishedUnit >= 0 ? `
        <button class="btn" onclick="startUnitRehearsal(${finishedUnit})">🎬 החזרה הגנרלית — שיחה שלמה</button>
        <button class="btn secondary" style="margin-top:8px" onclick="renderHome()">אחר כך — חזרה הביתה</button>
      ` : `
        <button class="btn" onclick="renderHome()">${wasReplay ? 'חזרה הביתה'
          : (lessonsDoneToday() < MAX_LESSONS_PER_DAY && state.completed < LESSONS.length) ? 'חזרה הביתה 🏠 (מחכה לך בונוס 🎁)'
          : 'סיימנו להיום — נתראה מחר! 👋'}</button>
      `}
    </div>
  `);
  L = null;
}

/* ================= boot ================= */
// iOS Safari blocks speech synthesis until it runs inside a user gesture —
// unlock it on the first tap so auto-play of phrases works afterwards.
let speechUnlocked = false;
document.addEventListener('pointerdown', ()=>{
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  speechSynthesis.speak(u);
}, true);
function setStageMotionPaused(paused){
  document.documentElement?.classList?.toggle('motion-paused',!!paused);
}
document.addEventListener('visibilitychange',()=>{
  setStageMotionPaused(document.hidden);
  if(!L) return;
  if(document.hidden){
    pauseLessonClock();
    pausePracticeStageActionSettle(L);
    // Both incoming messages and a successfully sent learner message can be
    // waiting on an automatic transition. Preserve that transition instead
    // of letting its timer expire silently while the tab is in the background.
    L.resumeFlowOnVisible=!!dialogueTimer;
    L.rerenderOnVisible=L.resumeFlowOnVisible||!!L.rec;
    L.stepTransitioning=false;
    cancelAutoSpeak();
    stopRecognition();
    invalidateDialogueFlow(false);
    cancelSpeech();
    saveLessonCheckpoint();
  } else {
    startLessonClock();
    resumePracticeStageActionSettle(L);
    L.stepTransitioning=false;
    if(L.rerenderOnVisible||L.resumeFlowOnVisible){
      L.rerenderOnVisible=false;L.resumeFlowOnVisible=false;
      L.rerenderOnPageShow=false;L.resumeFlowOnPageShow=false;renderStep();
    }
  }
});
window.addEventListener('pagehide',()=>{
  setStageMotionPaused(true);
  if(L){
    pausePracticeStageActionSettle(L);
    L.resumeFlowOnPageShow=!!dialogueTimer||!!L.resumeFlowOnVisible;
    L.rerenderOnPageShow=L.resumeFlowOnPageShow||!!L.rec;
    L.stepTransitioning=false;
    pauseLessonClock(); saveLessonCheckpoint();
  }
  cancelAutoSpeak(); invalidateDialogueFlow(false); stopRecognition();
  cancelSpeech();
});
window.addEventListener('pageshow',()=>{
  setStageMotionPaused(document.hidden);
  if(!L) return;
  L.stepTransitioning=false;
  if(document.hidden) return;
  startLessonClock();
  resumePracticeStageActionSettle(L);
  if(L.rerenderOnPageShow||L.resumeFlowOnPageShow){
    L.rerenderOnPageShow=false;L.resumeFlowOnPageShow=false;L.resumeFlowOnVisible=false;L.rerenderOnVisible=false;
    renderStep();
  }
});

let pendingServiceWorker=null;
let reloadingForUpdate=false;
let updateReloadTimer=null;
/* a waiting update applies itself when the learner is not mid-lesson:
   progress is saved, so the one automatic reload is invisible in practice.
   Mid-lesson we fall back to the banner, and after two failed automatic
   attempts in a session we stop trying and leave the banner up. */
function tryAutoUpdate(){
  if(!pendingServiceWorker || reloadingForUpdate) return false;
  if(typeof L !== 'undefined' && L) return false;
  let tries = 0;
  try{ tries = Number(sessionStorage.getItem('autoUpdTries') || 0); }catch(e){}
  if(tries >= 2) return false;
  try{ sessionStorage.setItem('autoUpdTries', String(tries + 1)); }catch(e){}
  applyAppUpdate();
  return true;
}
function showUpdateBanner(worker){
  if(!worker) return;
  pendingServiceWorker=worker;
  if(tryAutoUpdate()) return;
  if(document.getElementById('updateBanner')) return;
  const banner=document.createElement('div');
  banner.id='updateBanner'; banner.className='update-banner';
  banner.innerHTML=`<div class="txt"><b>גרסה חדשה מוכנה</b><span>העדכון ישמור את ההתקדמות שלך.</span></div><button class="btn" onclick="applyAppUpdate()">עדכון עכשיו</button>`;
  document.body.appendChild(banner);
}
function applyAppUpdate(){
  if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
  if(!pendingServiceWorker){ location.reload(); return; }
  if(pendingServiceWorker.state==='activated'||pendingServiceWorker.state==='redundant'){
    location.reload(); return;
  }
  reloadingForUpdate=true;
  pendingServiceWorker.postMessage({type:'SKIP_WAITING'});
  clearTimeout(updateReloadTimer);
  updateReloadTimer=setTimeout(()=>location.reload(),3000);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadingForUpdate||document.getElementById('updateBanner')){
      if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
      clearTimeout(updateReloadTimer);
      location.reload();
    }
  });
  window.addEventListener('load',()=>{
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>{
      if(hadController&&reg.waiting) showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller) showUpdateBanner(worker);
        });
      });
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
}
if(viewTransitionsEnabled()) document.documentElement?.classList?.add('vt');
if(state.onboarded) renderHome(); else renderOnboarding();
</script>
