/* one tap starts listening; a tap while listening ends the recording early,
   so background noise can't keep an attempt hanging open */
function micTap(target){
  if(L && L.rec){
    const hint=document.getElementById('micHint');
    if(hint) hint.textContent='רגע, בודק מה שמעתי...';
    try{ L.rec.stop(); }catch(e){ try{ L.rec.abort(); }catch(_){} }
    return;
  }
  startListening(target);
}
function startListening(target){
  const btn=document.getElementById('micBtn');
  const hint=document.getElementById('micHint');
  const heardEl=document.getElementById('heard');
  if(!SR){ showMicFallback('בדיקת הקול לא זמינה כאן. אמור את המשפט בקול והמשך ידנית.', true); return; }
  stopRecognition();
  cancelSpeech();
  const rec=new SR();
  const session=L, stepIndex=L.i, epoch=uiEpoch;
  L.rec=rec;
  L.curStep.retryMessage='';
  L.curStep.heardText='';
  L.curStep.heardDetails=null;
  if(heardEl) heardEl.innerHTML='';
  const resultArea=document.getElementById('resultArea');
  if(resultArea) resultArea.innerHTML='';
  L.attempts=(L.attempts||0)+1;
  L.curStep.attempts=L.attempts;
  saveLessonCheckpoint();
  rec.lang='en-US';
  // iOS Safari streams partial transcripts while the learner is still talking
  // (even with interimResults=false), so a single result event must never end
  // the attempt: we accumulate the best transcript across every event and only
  // decide when recognition really ends — or the moment a clear pass arrives.
  rec.interimResults=true;
  rec.maxAlternatives=4;
  let got=false, done=false;
  let best='', bestDetails={score:0,words:[],matched:[],criticalMismatch:false};
  const active=()=>!!L&&L===session&&L.i===stepIndex&&L.rec===rec&&uiEpoch===epoch;
  // while listening the mic button shows ⏹ — micTap() ends the attempt early
  const restoreMicButton=()=>{
    btn.classList.remove('listening');
    btn.textContent='🎤';
    btn.setAttribute('aria-label','התחלת הקלטה');
  };
  btn.classList.add('listening');
  btn.textContent='⏹';
  btn.setAttribute('aria-label','סיום ההקלטה');
  hint.textContent='מקשיב... דבר, וכשסיימת לחץ ⏹';
  rec.onresult=(e)=>{
    if(done||!active()) return;
    for(let ri=0;ri<e.results.length;ri++){
      const result=e.results[ri];
      if(!result) continue;
      for(let ai=0;ai<result.length;ai++){
        const alt=result[ai];
        const transcript=alt&&typeof alt.transcript==='string'?alt.transcript.trim():'';
        if(!transcript) continue;
        got=true;
        const details=matchDetails(target,transcript);
        if(details.score>=bestDetails.score){ bestDetails=details; best=transcript; }
      }
    }
    if(!got) return;
    const step=L.curStep||{};
    step.heardText=best;
    step.heardDetails=bestDetails;
    if(heardEl) heardEl.innerHTML=`<div>זה מה שהטלפון קלט: “${esc(best)}”</div>${wordFeedbackHtml(bestDetails)}`;
    requestAnimationFrame(scrollComposerToEnd);
    // finalize early ONLY when every word of the phrase was heard in order —
    // stopping at a partial match used to cut the mic off mid-sentence
    const missedNow=bestDetails.words.filter((w,i)=>!bestDetails.matched[i]);
    if(!bestDetails.criticalMismatch&&!missedNow.length){
      done=true;
      step.tries=(step.tries||0)+1;
      L.tries=step.tries;
      stopRecognition();
      recordStepResult(step,'pass');
      showResult('pass',pick(PRAISE));
    }
  };
  rec.onerror=(e)=>{
    if(done||!active()||got) return;
    restoreMicButton();
    const code=e?.error||'';
    if(code==='aborted') return;
    if(code==='not-allowed'||code==='service-not-allowed'||code==='audio-capture'||code==='language-not-supported'){
      micUnavailableThisSession=true;
      showMicFallback(code==='audio-capture'
        ? 'המיקרופון אינו זמין כרגע. אמור את המשפט בקול והמשך בלי בדיקה.'
        : code==='language-not-supported'
          ? 'בדיקת הקול באנגלית אינה זמינה במכשיר הזה. אמור את המשפט בקול והמשך בלי בדיקה.'
          : 'אין הרשאה למיקרופון. אמור את המשפט בקול והמשך בלי בדיקה.', true);
    }
    else if(code==='no-speech') showMicFallback('לא נקלט קול. אפשר לנסות שוב או להמשיך ידנית.',!!L?.curStep?.isDlg);
    else if(code==='network') showMicFallback('בדיקת הקול אינה זמינה כרגע בגלל החיבור. אפשר להמשיך ידנית.');
    else showMicFallback('בדיקת הקול לא הצליחה. אמור את המשפט בקול והמשך ידנית.');
  };
  rec.onend=()=>{
    if(!active()) return;
    L.rec=null;
    restoreMicButton();
    if(done) return;
    if(!got){
      const t=hint.textContent;
      if(t.indexOf('מקשיב')>-1||t.indexOf('בודק')>-1) hint.textContent='לא שמעתי כלום — נסה שוב, קרוב לטלפון 🎤';
      revealEscapes();
      return;
    }
    // the attempt ended without a clear pass — one full try, judged on the
    // best transcript heard during the whole attempt
    const step=L.curStep||{};
    step.tries=(step.tries||0)+1;
    L.tries=step.tries;
    saveLessonCheckpoint();
    const missed=bestDetails.words.filter((w,i)=>!bestDetails.matched[i]);
    if(!bestDetails.criticalMismatch&&!missed.length){
      recordStepResult(step,'pass');
      showResult('pass',pick(PRAISE));
    } else if(step.isDlg&&bestDetails.score>=.65&&!bestDetails.criticalMismatch){
      recordStepResult(step,'pass');
      showResult('pass','הבנתי אותך! ממשיכים בשיחה 👏');
    } else if(bestDetails.score>=.70&&!bestDetails.criticalMismatch&&L.tries<3){
      // almost there — a word went missing, so the practice repeats it
      showResult('retry','כמעט! 👏 לא שמעתי את: ' + missed.join(', ') + ' — עוד פעם, והפעם תדגיש אותה 💪');
    } else if(L.tries>=3){
      recordStepResult(step,'fail');
      if(step.warmup) showResult('pass','לא נורא — המשפט הזה יחזור בחימום הבא. ממשיכים! 💪');
      else if(step.requeued) showResult('pass','התאמנת על זה חזק היום — עם עוד תרגול זה יישב. ממשיכים! 💪');
      else if(step.isDlg) showResult('pass','כל הכבוד שניסית — נמשיך בשיחה והמשפט יחזור בתרגול 💪');
      else showResult('requeue','הטלפון עדיין לא קלט את כל המשפט. נמשיך ונחזור אליו שוב בסוף');
    } else if(bestDetails.score>=.40) showResult('retry',pick(ALMOST));
    else showResult('retry','התמלול לא היה בטוח. נסה שוב לאט, או המשך ידנית — יש לך את זה');
  };
  try{rec.start();}
  catch(e){
    if(L&&L===session&&L.rec===rec) L.rec=null;
    restoreMicButton();
    showMicFallback('בדיקת הקול לא נפתחה. אמור את המשפט בקול והמשך ידנית.', true);
  }
}
function showResult(kind, msg){
  const step=L?.curStep;
  if(!step) return;
  if(kind==='retry') step.retryMessage=msg;
  else {
    step.resultKind=kind;
    step.resultMessage=msg;
    step.retryMessage='';
  }
  saveLessonCheckpoint();
  renderSpeak(step);
  if(kind === 'pass' && navigator.vibrate) navigator.vibrate(40);
}
function requeueAndNext(){
  const step = L.curStep;
  recordStepResult(step,'fail');
  if(step && !step.requeued && !step.warmup){
    const hid = step.hid || null;
    const doneIdx = L.steps.findIndex(s=>s.type === 'done');
    L.steps.splice(doneIdx, 0, {type:'speak', p:step.p, isDlg:step.isDlg, requeued:true, hid});
    saveLessonCheckpoint();
  }
  next();
}

/* ---- quiz ---- */
function renderQuiz(step){
  const p = step.p;
  const en=ptext(p,'en'), he=ptext(p,'he');
  playerShell(`
    <div class="step-label">🧩 זיהוי מהיר — אתה בטוח יודע את זה</div>
    <div class="phrase-card quiz-q">
      <div class="phrase-en" dir="ltr" lang="en">${esc(en)}</div>
      <button class="play-big" onclick="speak('${jsEsc(en)}')" aria-label="השמע">🔊</button>
    </div>
    <p class="sub">מה זה אומר?</p>
    <div id="quizOpts">
      ${step.options.map(o=>`<button class="quiz-opt" onclick="answerQuiz(this, ${o===he})">${esc(o)}</button>`).join('')}
    </div>
    <div id="quizResult"></div>
  `);
  scheduleSpeak(en);
}
function answerQuiz(btn, correct){
  const opts = document.querySelectorAll('.quiz-opt');
  if(correct){
    btn.classList.add('right');
    opts.forEach(o=>o.onclick=null);
    document.getElementById('quizResult').innerHTML =
      `<div class="result-msg good">${esc(pick(PRAISE))}</div><button class="btn" style="margin-top:12px" onclick="next()">ממשיכים ⬅</button>`;
    if(navigator.vibrate) navigator.vibrate(40);
  } else {
    btn.classList.add('wrong');
    btn.onclick = null;
    document.getElementById('quizResult').innerHTML =
      `<div class="result-msg almost">לא זה — אבל עכשיו זה יישאר לך בראש! נסה שוב 😉</div>`;
  }
}

/* ---- varied, predictable lesson challenges ---- */
function renderListenQuiz(step){
  const en=ptext(step.p,'en'), he=ptext(step.p,'he'), tl=ptext(step.p,'tl');
  playerShell(`
    <div class="step-label">🎧 אתגר שמיעה</div>
    <h2>מה שמעת?</h2>
    <p class="challenge-help">אפשר לשמוע שוב כמה פעמים שצריך</p>
    ${step.correctAnswered?`
      <div class="phrase-card">
        <div class="phrase-en" dir="ltr" lang="en">${wordSpans(en)}</div>
        <div class="phrase-tl">${esc(tl)}</div>
        <div class="phrase-he">${esc(he)}</div>
      </div>
      <div class="result-msg good">${esc(pick(PRAISE))}</div>
      <button class="btn" style="margin-top:12px" onclick="next()">ממשיכים ⬅</button>
    `:`
      <div class="recall-card">
        <button class="play-big" onclick="speak('${jsEsc(en)}')" aria-label="השמעת המשפט">🔊</button>
        <div class="audio-only">המשפט מוסתר — מקשיבים ובוחרים משמעות</div>
      </div>
      <div>
        ${step.options.map((o,i)=>`<button class="quiz-opt ${(step.wrongIndexes||[]).includes(i)?'wrong':''}" ${(step.wrongIndexes||[]).includes(i)?'disabled':''} onclick="answerListenQuiz(${i})">${esc(o)}</button>`).join('')}
      </div>
      <div id="quizResult" role="status" aria-live="polite">${step.feedback?`<div class="result-msg almost">${esc(step.feedback)}</div>`:''}</div>
    `}
  `);
  if(!step.correctAnswered) scheduleSpeak(en);
}
function answerListenQuiz(optionIndex){
  const step=L?.steps[L.i];
  if(!step||step.type!=='listenQuiz'||step.correctAnswered) return;
  if(step.options[optionIndex]===step.correct){
    step.correctAnswered=true;
    recordStepResult(step,'pass');
  } else {
    step.wrongIndexes=step.wrongIndexes||[];
    if(!step.wrongIndexes.includes(optionIndex)) step.wrongIndexes.push(optionIndex);
    if(!step.hadWrong){ step.hadWrong=true; step.usedHint=true; noteHint(step); }
    step.feedback='לא זה — שמע שוב ונסה אפשרות אחרת';
    saveLessonCheckpoint();
  }
  renderListenQuiz(step);
}
function renderOrder(step){
  const en=ptext(step.p,'en'), he=ptext(step.p,'he'), tl=ptext(step.p,'tl');
  playerShell(`
    <div class="step-label">🧩 אתגר סדר</div>
    <h2>בנה את המשפט</h2>
    <p class="challenge-help">${esc(he)} · לחץ על החלקים לפי הסדר</p>
    ${step.showHint?`<div class="milestone" style="margin-bottom:12px"><span dir="ltr" lang="en">${esc(en)}</span></div>`:''}
    <div class="order-built ${step.selected.length?'':'empty'}">
      ${step.selected.map(id=>`<span class="word-chip built-chip">${esc(step.chunks[id])}</span>`).join('')}
    </div>
    <div class="word-bank">
      ${step.bankOrder.map(id=>`<button class="word-chip" ${step.selected.includes(id)?'disabled':''} onclick="selectOrderChunk(${id})">${esc(step.chunks[id])}</button>`).join('')}
    </div>
    ${step.correct?`
      <div class="result-msg good">בדיוק! בנית את המשפט נכון 👏</div>
      <div class="phrase-tl" style="text-align:center;margin:8px 0">${esc(tl)}</div>
      <button class="btn" style="margin-top:12px" onclick="next()">ממשיכים ⬅</button>
    `:step.wrong?`
      <div class="result-msg almost">החלקים נכונים — רק הסדר עוד לא. נסה שוב בנחת.</div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn secondary" onclick="resetOrder()">נסה שוב</button>
        <button class="btn ghost" onclick="revealOrderHint()">הצג רמז</button>
      </div>
    `:`
      <div class="btn-row">
        <button class="btn ghost" ${step.selected.length?'':'disabled'} onclick="undoOrder()">בטל חלק אחרון</button>
        <button class="btn ghost" onclick="revealOrderHint()">צריך רמז?</button>
      </div>
    `}
  `);
}
function selectOrderChunk(id){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order'||step.correct||step.selected.includes(id)) return;
  step.selected.push(id);
  if(step.selected.length===step.chunks.length){
    step.correct=step.selected.every((v,i)=>v===i);
    step.wrong=!step.correct;
    if(step.correct) recordStepResult(step,'pass');
    else if(!step.hadWrong){ step.hadWrong=true; step.usedHint=true; noteHint(step); }
  }
  saveLessonCheckpoint();
  renderOrder(step);
}
function undoOrder(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order'||step.correct) return;
  step.selected.pop(); step.wrong=false; saveLessonCheckpoint(); renderOrder(step);
}
function resetOrder(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order') return;
  step.selected=[]; step.wrong=false; saveLessonCheckpoint(); renderOrder(step);
}
function revealOrderHint(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order') return;
  if(!step.showHint){ step.showHint=true; step.usedHint=true; noteHint(step); }
  saveLessonCheckpoint(); renderOrder(step);
}

/* ---- dialogue ---- */
function renderDlgIntro(){
  const unitChallenge=!!L.steps[L.i].unitChallenge;
  const meta=conversationMeta(L.idx);
  playerShell(`
    <div class="step-label">${unitChallenge?'🏆 אתגר שיחה לסיום היחידה':'💬 תרגול שיחה'}</div>
    <h2>${unitChallenge?'שיחת הסיום שלך':'עכשיו — שיחה עם '+esc(meta.character.name)+'!'}</h2>
    <div class="conversation-person" style="margin:12px 0 16px">
      <div class="portrait" style="border-color:${meta.character.color}88">${meta.character.avatar}</div>
      <div class="person-copy"><div class="person-name">${esc(meta.character.name)}</div><div class="person-scene">${meta.placeEmoji} ${esc(meta.place)}</div></div>
      <div class="mission">🎯 ${esc(meta.mission)}</div>
    </div>
    <p class="sub">${esc(fillProfileText('בכל תור [[אתה בוחר|את בוחרת]] מה באמת מתאים לך, [[אומר|אומרת]] את התשובה באנגלית והשיחה ממשיכה בהתאם.','he'))}<br>אפשר לפתוח תרגום, לשמוע שוב או להשהות בכל רגע.</p>
    <button class="btn" onclick="next()">מתחילים לדבר 💬</button>
  `);
}
function renderListen(step){
  invalidateDialogueFlow(true);
  const line=step.line,meta=conversationMeta(L.idx),spokenEn=ptext(line,'en',true);
  const current=step.arrived?{who:'app',line,showHe:!!step.showHe,showTl:!!step.showTl}:null;
  const paused=!!L.flowPaused;
  const typing=`<div class="dlg-line typing-line"><div class="dlg-avatar" aria-hidden="true">${meta.character.avatar}</div><div class="dlg-bubble voice-note">${paused
    ? `⏸️ ההודעה של ${esc(meta.character.name)} מושהית`
    : `🎙️ ${esc(meta.character.name)} שולח הודעה<span class="vdots"><i></i><i></i><i></i></span>`}</div></div>`;
  const composer=`
    <div class="flow-controls">
      <span id="flowStatus">${paused?'השיחה מושהית — אפשר לקרוא או לשמוע שוב':step.arrived?meta.character.name+' מדבר…':'הודעה חדשה בדרך…'}</span>
      <button id="pauseFlow" ${paused?'hidden':''} onclick="pauseDialogue()">⏸ השהה</button>
      <button id="resumeFlow" ${paused?'':'hidden'} onclick="resumeDialogue()">▶ המשך</button>
      <button onclick="next()">דלג קדימה</button>
    </div>`;
  dialogueShell(chatMessagesHtml(current,step.arrived?'conversation-current':'' )+(step.arrived?'':typing),composer);
  if(paused) return;
  if(!step.arrived){
    scheduleDialogueFlow(()=>{ step.arrived=true;saveLessonCheckpoint();renderListen(step); },600);
    return;
  }
  const readingDelay=Math.max(1900,Math.min(3400,spokenEn.length*38));
  const speechDeadline=Date.now()+20000;
  const afterSpeech=()=>{
    const status=document.getElementById('flowStatus');if(status) status.textContent='ממשיך בעוד רגע…';
    scheduleDialogueFlow(()=>next(),readingDelay);
  };
  const watchdog=()=>{
    if('speechSynthesis' in window&&speechSynthesis.speaking){
      if(Date.now()<speechDeadline){ scheduleDialogueFlow(watchdog,900); return; }
      pauseDialogue();
      const status=document.getElementById('flowStatus');
      if(status) status.textContent='ההשמעה נעצרה — אפשר לשמוע שוב או להמשיך';
      return;
    }
    afterSpeech();
  };
  scheduleDialogueFlow(watchdog,Math.max(5500,spokenEn.length*160));
  speak(spokenEn,afterSpeech);
}
function renderBranchChoice(step){
  invalidateDialogueFlow(false);
  dialogueShell(chatMessagesHtml(),`
    <div class="composer-head"><span class="composer-label">💬 מה מתאים לך לענות?</span><span style="font-size:12px;color:var(--dim)">אחר כך אומרים באנגלית</span></div>
    <div class="conversation-options">
      ${step.options.map((o,i)=>`<button class="conversation-option" onclick="chooseBranch(${i})">${esc(fillProfileText(o.label,'he'))}</button>`).join('')}
    </div>
  `);
}
function chooseBranch(optionIndex){
  const step=L?.steps[L.i];
  if(!step||step.type!=='branchChoice'||!step.options[optionIndex]) return;
  invalidateDialogueFlow(true);
  const option=step.options[optionIndex];
  step.selectedIndex=optionIndex;
  const hid=phraseIdForText(option.answer.en,L.idx);
  L.steps.splice(L.i+1,2,
    {type:'speak',p:option.answer,isDlg:true,challenge:true,hid,branch:true,roundIndex:step.roundIndex},
    {type:'listen',line:option.reply,isBranchReply:true,roundIndex:step.roundIndex}
  );
  L.i++;L.flowPaused=false;
  saveLessonCheckpoint();
  renderStep();
}

/* ---- done ---- */
function renderDone(){
  const durationMs=activeElapsedMs();
  pauseLessonClock();
  stopLessonTimers(false);
  const wasReplay = L.isReplay;
  let streakNote = '', milestones = [];
  if(!wasReplay){
    state.completed = Math.max(state.completed, L.idx + 1);
    const today = todayStr();
    if(state.lastDoneDate === today){
      // a bonus lesson: the day's counter grows, the streak already counted
      state.lessonsToday = lessonsDoneToday() + 1;
    }
    if(state.lastDoneDate !== today){
      const prevStreak = state.streak;
      if(state.lastDoneDate === dateNDaysAgo(1)){
        state.streak++;
      } else if(state.lastDoneDate === dateNDaysAgo(2) && Date.now() - (state.lastGraceTs || 0) > 6*864e5){
        // one missed day forgiven, once a week — the streak survives
        state.streak++;
        state.lastGraceTs = Date.now();
        streakNote = 'פספסת יום אחד — אבל הרצף שלך ניצל 🛟 (קורה לכולם)';
      } else {
        if(state.lastDoneDate) streakNote = 'חזרת — וזה מה שחשוב! רצף חדש מתחיל היום 💪';
        state.streak = 1;
      }
      state.lastDoneDate = today;
      state.lessonsToday = 1;
      const STREAK_MSGS = {3:'שלושה ימים — זה כבר מתחיל להיות הרגל!', 7:'שבוע שלם ברצף! רצינות אמיתית', 14:'שבועיים ברצף — אתה מכונה!', 30:'חודש שלם. וואו. פשוט וואו'};
      if(state.streak !== prevStreak && STREAK_MSGS[state.streak])
        milestones.push('🔥 ' + state.streak + ' ימים ברצף — ' + STREAK_MSGS[state.streak]);
    }
    if((L.idx + 1) % LESSONS_PER_UNIT === 0){
      const u = UNITS[Math.floor(L.idx / LESSONS_PER_UNIT)];
      milestones.push('🏆 סיימת את כל יחידת "' + u.title + '"! אתה כבר יודע ' + (state.completed*5) + ' משפטים באנגלית');
    }
  } else {
    state.replays=(state.replays||0)+1;
  }
  touchState('progressUpdatedAt');
  rememberFinishedRun(L.runId);
  state.session=null;
  touchState('sessionUpdatedAt');
  save();
  confetti();
  if(milestones.length) setTimeout(confetti, 900);
  const mins = Math.max(1, Math.round(durationMs/60000));
  const nm = state.name ? ' ' + state.name : '';
  playerShell(`
    <div class="finish">
      <div class="emoji">${wasReplay ? '🔁' : milestones.length ? '🏆' : '🏅'}</div>
      <h2>${wasReplay ? 'סיימת את החזרה!' : 'כל הכבוד' + esc(nm) + '!'}</h2>
      <p>${wasReplay
          ? 'חזרת על שיעור — וזה בדיוק מה שהופך ידע לזיכרון לתמיד.'
          : `סיימת את שיעור ${L.idx+1} ${mins===1?'בדקה אחת':'ב־'+mins+' דקות'} · למדת 5 משפטים חדשים 🗣️`}
      </p>
      ${!wasReplay ? `<div class="chip" style="display:inline-flex;margin-top:4px">🔥 ${state.streak} ימים ברצף</div>` : ''}
      ${streakNote ? `<div class="streak-note">${esc(streakNote)}</div>` : ''}
      ${milestones.map(m=>`<div class="milestone">${esc(m)}</div>`).join('')}
      <div class="quote">💬 ${esc(pick(FINISH_QUOTES))}</div>
      <button class="btn" onclick="renderHome()">${wasReplay ? 'חזרה הביתה'
        : (lessonsDoneToday() < MAX_LESSONS_PER_DAY && state.completed < LESSONS.length) ? 'חזרה הביתה 🏠 (מחכה לך בונוס 🎁)'
        : 'סיימנו להיום — נתראה מחר! 👋'}</button>
    </div>
  `);
  L = null;
}

/* ================= boot ================= */
// iOS Safari blocks speech synthesis until it runs inside a user gesture —
// unlock it on the first tap so auto-play of phrases works afterwards.
let speechUnlocked = false;
document.addEventListener('pointerdown', ()=>{
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  speechSynthesis.speak(u);
}, true);
document.addEventListener('visibilitychange',()=>{
  if(!L) return;
  if(document.hidden){
    pauseLessonClock();
    // Both incoming messages and a successfully sent learner message can be
    // waiting on an automatic transition. Preserve that transition instead
    // of letting its timer expire silently while the tab is in the background.
    L.resumeFlowOnVisible=!!dialogueTimer&&!L.flowPaused;
    L.rerenderOnVisible=L.resumeFlowOnVisible||!!L.rec;
    L.stepTransitioning=false;
    cancelAutoSpeak();
    stopRecognition();
    invalidateDialogueFlow(false);
    cancelSpeech();
    saveLessonCheckpoint();
  } else {
    startLessonClock();
    L.stepTransitioning=false;
    if(L.rerenderOnVisible||L.resumeFlowOnVisible){
      L.rerenderOnVisible=false;L.resumeFlowOnVisible=false;
      L.rerenderOnPageShow=false;L.resumeFlowOnPageShow=false;renderStep();
    }
  }
});
window.addEventListener('pagehide',()=>{
  if(L){
    L.resumeFlowOnPageShow=(!!dialogueTimer||!!L.resumeFlowOnVisible)&&!L.flowPaused;
    L.rerenderOnPageShow=L.resumeFlowOnPageShow||!!L.rec;
    L.stepTransitioning=false;
    pauseLessonClock(); saveLessonCheckpoint();
  }
  cancelAutoSpeak(); invalidateDialogueFlow(false); stopRecognition();
  cancelSpeech();
});
window.addEventListener('pageshow',()=>{
  if(!L) return;
  L.stepTransitioning=false;
  if(document.hidden) return;
  startLessonClock();
  if(L.rerenderOnPageShow||(L.resumeFlowOnPageShow&&!L.flowPaused)){
    L.rerenderOnPageShow=false;L.resumeFlowOnPageShow=false;L.resumeFlowOnVisible=false;L.rerenderOnVisible=false;
    renderStep();
  }
});

let pendingServiceWorker=null;
let reloadingForUpdate=false;
let updateReloadTimer=null;
/* a waiting update applies itself when the learner is not mid-lesson:
   progress is saved, so the one automatic reload is invisible in practice.
   Mid-lesson we fall back to the banner, and after two failed automatic
   attempts in a session we stop trying and leave the banner up. */
function tryAutoUpdate(){
  if(!pendingServiceWorker || reloadingForUpdate) return false;
  if(typeof L !== 'undefined' && L) return false;
  let tries = 0;
  try{ tries = Number(sessionStorage.getItem('autoUpdTries') || 0); }catch(e){}
  if(tries >= 2) return false;
  try{ sessionStorage.setItem('autoUpdTries', String(tries + 1)); }catch(e){}
  applyAppUpdate();
  return true;
}
function showUpdateBanner(worker){
  if(!worker) return;
  pendingServiceWorker=worker;
  if(tryAutoUpdate()) return;
  if(document.getElementById('updateBanner')) return;
  const banner=document.createElement('div');
  banner.id='updateBanner'; banner.className='update-banner';
  banner.innerHTML=`<div class="txt"><b>גרסה חדשה מוכנה</b><span>העדכון ישמור את ההתקדמות שלך.</span></div><button class="btn" onclick="applyAppUpdate()">עדכון עכשיו</button>`;
  document.body.appendChild(banner);
}
function applyAppUpdate(){
  if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
  if(!pendingServiceWorker){ location.reload(); return; }
  if(pendingServiceWorker.state==='activated'||pendingServiceWorker.state==='redundant'){
    location.reload(); return;
  }
  reloadingForUpdate=true;
  pendingServiceWorker.postMessage({type:'SKIP_WAITING'});
  clearTimeout(updateReloadTimer);
  updateReloadTimer=setTimeout(()=>location.reload(),3000);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadingForUpdate||document.getElementById('updateBanner')){
      if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
      clearTimeout(updateReloadTimer);
      location.reload();
    }
  });
  window.addEventListener('load',()=>{
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>{
      if(hadController&&reg.waiting) showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller) showUpdateBanner(worker);
        });
      });
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
}
if(state.onboarded) renderHome(); else renderOnboarding();
