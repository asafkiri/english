<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>אנגלית טכנית לחשמל</title>
<meta name="description" content="אנגלית טכנית להנדסאי חשמל: לקרוא מפרטי יצרן, לוחיות נתונים, טבלאות והוראות — מונח אחר מונח, עם הסבר בעברית.">
<meta name="theme-color" content="#0e1524">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0e1524;
  --bg2:#131c30;
  --card:#1a2540;
  --card2:#22304f;
  --line:#2c3b5e;
  --text:#eef2fb;
  --dim:#93a0bd;
  --soft:#b9c6e2;
  --green:#34d399;
  --green-dark:#0e9f6e;
  --blue:#60a5fa;
  --amber:#fbbf24;
  --red:#f87171;
  --pink:#f472b6;
  --radius:20px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* author display rules (.btn{display:block}) would beat the browser's own
   [hidden] handling, so hidden has to win explicitly */
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Heebo","Arial Hebrew",Arial,sans-serif;
  font-size:17px;
  line-height:1.55;
  overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
.screen{animation:fadeUp .3s ease both}
.vt .screen{animation:none}
::view-transition-old(root){animation:vtOut .14s ease both}
::view-transition-new(root){animation:vtIn .22s ease both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:translateX(50%) scale(.7);opacity:0}70%{transform:translateX(50%) scale(1.05)}100%{transform:translateX(50%) scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}

/* English, model numbers, units and formulas always read left to right,
   inside a Hebrew page that reads right to left */
.en,[dir=ltr]{direction:ltr;unicode-bidi:isolate}
.en{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 2px 8px}
.top.sub{padding-top:14px}
.brand{font-size:21px;font-weight:800;line-height:1.25;flex:1;min-width:0}
.brand small{display:block;font-size:12.5px;font-weight:500;color:var(--dim);margin-top:2px}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:999px;min-width:44px;min-height:44px;color:var(--text);font:inherit;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-btn{background:var(--card);border:1px solid var(--line);border-radius:999px;min-height:44px;padding:0 14px;color:var(--text);font:inherit;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:16px 20px;
  font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;color:#06281c;
  background:linear-gradient(135deg,var(--green),#6ee7b7);
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--dim);border:none;font-weight:600;font-size:15px}
.btn.danger{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff}
.btn:disabled{filter:grayscale(.6);opacity:.55;cursor:default;transform:none}
.btn+.btn{margin-top:10px}
.hint{color:var(--dim);font-size:14px;line-height:1.5}
.hint.amber{color:var(--amber)}
.row-link{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;color:var(--text);font:inherit;font-size:15.5px;font-weight:700;cursor:pointer;text-align:right}
.row-link .ico{font-size:22px;flex-shrink:0}
.row-link .body{flex:1;min-width:0}
.row-link .body small{display:block;color:var(--dim);font-weight:500;font-size:13px}
.row-link .count{background:var(--card2);border-radius:999px;padding:3px 11px;font-size:14px;color:var(--soft)}
.row-link .count.warn{background:rgba(251,191,36,.15);color:var(--amber)}
.row-link .count.pink{background:rgba(244,114,182,.15);color:var(--pink)}

/* ---------- home ---------- */
.welcome{background:linear-gradient(140deg,#1b2d4e,#162540 55%,#13203a);border:1px solid #2d4a78}
.welcome h2{font-size:21px;font-weight:800;margin-bottom:8px}
.welcome p{color:var(--soft);font-size:15px;line-height:1.6;margin-bottom:8px}
.welcome ul{padding-right:18px;color:var(--soft);font-size:15px;line-height:1.6}
.next{background:linear-gradient(140deg,#153054,#132a45 55%,#12233c);border:1px solid #29466e}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(52,211,153,.15);color:var(--green);font-size:13px;font-weight:800;border-radius:999px;padding:4px 12px;margin-bottom:10px}
.next h2{font-size:22px;font-weight:800;margin-bottom:6px;line-height:1.3}
.plan{display:flex;flex-direction:column;gap:10px;margin:12px 0 14px}
.plan-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:15.5px;min-height:56px}
.plan-row>b{font-weight:800;font-size:20px}
.plan-row.col{flex-direction:column;align-items:stretch;gap:8px}
.plan-row.col>span{font-weight:700}
.stepper{display:flex;align-items:center;gap:6px;direction:ltr}
.stepper button{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-size:22px;font-weight:800;cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:32px;text-align:center;font-size:21px;font-weight:800}
.select{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--text);padding:11px 12px;font-size:16px;font-family:inherit;outline:none;appearance:auto}
.select:focus{border-color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat b small{font-size:13px;color:var(--dim);font-weight:600}
.stat span{display:block;font-size:12.5px;color:var(--dim);margin-top:3px}
.section-title{font-size:17px;font-weight:800;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-title small{color:var(--dim);font-weight:600;font-size:13px}
.topic{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;color:var(--text);font:inherit;cursor:pointer;text-align:right;transition:transform .1s ease}
.topic:active{transform:scale(.985)}
.topic .num{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;background:var(--card2);color:var(--dim)}
.topic.started .num{background:rgba(96,165,250,.15);color:var(--blue)}
.topic.complete .num{background:rgba(52,211,153,.16);color:var(--green)}
.topic .body{flex:1;min-width:0}
.topic .name{display:block;font-weight:800;font-size:15.5px;line-height:1.3}
.topic .meta{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
.topic .meta .due{color:var(--amber);font-weight:700}
.bar{display:block;height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:7px;position:relative}
.bar i{position:absolute;top:0;right:0;height:100%;border-radius:99px;background:linear-gradient(270deg,var(--blue),#93c5fd)}
.bar i.m{background:linear-gradient(270deg,var(--green),#6ee7b7)}
.chev{color:var(--dim);font-size:20px;flex-shrink:0}

/* ---------- states ---------- */
.state{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--card2);color:var(--dim);white-space:nowrap}
.state.learning{background:rgba(96,165,250,.15);color:var(--blue)}
.state.due{background:rgba(251,191,36,.15);color:var(--amber)}
.state.mastered{background:rgba(52,211,153,.16);color:var(--green)}
.state.concept{background:rgba(244,114,182,.15);color:var(--pink)}

/* ---------- term rows ---------- */
.term-row{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;color:var(--text);font:inherit;cursor:pointer;text-align:right}
.term-row .txt{flex:1;min-width:0}
.term-row .txt .en{display:block;font-weight:800;font-size:16.5px;text-align:left;line-height:1.3}
.term-row .txt .he{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.term-row .tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* ---------- session ---------- */
.player-top{display:flex;align-items:center;gap:10px;padding:14px 0 12px}
.progress{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden;position:relative}
.progress i{position:absolute;top:0;right:0;height:100%;background:linear-gradient(270deg,var(--green),#6ee7b7);transition:width .3s ease;border-radius:99px}
.step-label{font-size:13px;color:var(--dim);white-space:nowrap;direction:ltr}
.phase{font-size:13px;font-weight:800;color:var(--blue);margin:0 2px 8px;display:flex;justify-content:space-between;gap:8px}
.phase .topic-name{color:var(--dim);font-weight:600}
.term-card .term-en{font-size:32px;font-weight:800;line-height:1.2;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
.term-card .term-he{font-size:22px;font-weight:800;margin-top:6px}
.term-card .term-exp{font-size:16.5px;line-height:1.6;color:#d7deef;margin-top:10px}
.facts{display:grid;gap:8px;margin-top:14px}
.fact{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.55}
.fact b{color:var(--dim);font-weight:700;font-size:12.5px;display:block;margin-bottom:2px}
.fact .en{font-weight:700}
.example{margin-top:14px;background:linear-gradient(160deg,#1b2946,#17223a);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.example .ex-en{text-align:left;font-size:19px;font-weight:700;line-height:1.4;display:flex;align-items:center;justify-content:space-between;gap:8px}
.example .ex-he{color:var(--soft);font-size:15px;margin-top:6px}
.example-toggle{display:inline-block;margin-top:14px;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;min-height:40px;padding:0 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.example .example-toggle{margin-top:10px}
.play{border:0;background:rgba(96,165,250,.14);color:var(--blue);border-radius:12px;min-width:44px;min-height:44px;font-size:18px;cursor:pointer;flex-shrink:0}
.refs{margin-top:12px;font-size:12.5px;color:var(--dim);line-height:1.6}
.refs a{color:var(--blue);text-decoration:none}
.term-card .btn{margin-top:16px}

/* ---------- questions ---------- */
.q-label{font-size:14px;font-weight:800;color:var(--blue);margin-bottom:8px}
.cue-en{text-align:left;font-size:30px;font-weight:800;line-height:1.25;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cue-he{font-size:24px;font-weight:800;line-height:1.3}
.cue-sent{text-align:left;font-size:21px;font-weight:700;line-height:1.5}
.cue-sent .blank{display:inline-block;min-width:76px;border-bottom:3px solid var(--amber);vertical-align:bottom}
.cue-sub{color:var(--soft);font-size:15.5px;margin-top:8px}
.cue-exp{font-size:18px;line-height:1.6}
.options{display:grid;gap:10px;margin-top:16px}
.opt{width:100%;min-height:56px;border:1.5px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;text-align:right;line-height:1.35;transition:transform .1s ease}
.opt:active:not(:disabled){transform:scale(.985)}
.opt.en{text-align:left}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:rgba(52,211,153,.14)}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.12);animation:shake .3s ease}
.opt.dimmed{opacity:.5}
.spec{direction:ltr;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px;background:var(--card2)}
.spec-head{display:flex;justify-content:space-between;padding:7px 14px;background:#0f1a30;color:var(--dim);font-size:12.5px;font-weight:800;letter-spacing:.02em}
.spec-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:17px;font-weight:700;text-align:left;min-height:52px;line-height:1.3}
button.spec-row{cursor:pointer}
button.spec-row:disabled{cursor:default}
.spec-row .val{color:var(--soft);font-weight:600;white-space:nowrap}
.spec-row.right{background:rgba(52,211,153,.14)}
.spec-row.wrong{background:rgba(248,113,113,.12)}
.spec-row.dimmed{opacity:.5}
.spec-note{font-size:12.5px;color:var(--amber);margin-top:8px;line-height:1.5}
.feedback{margin-top:16px;border-radius:16px;padding:14px;border:1px solid}
.feedback.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4)}
.feedback.bad{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.4)}
.feedback h3{font-size:18px;margin-bottom:4px}
.feedback p{font-size:15px;line-height:1.6;margin-top:7px}
.feedback p b{color:var(--soft);font-weight:700}
.feedback .en{font-weight:800}
.feedback .btn{margin-top:14px}
.feedback .btn+.btn{margin-top:8px}

/* ---------- session end ---------- */
.finish{text-align:center;padding:10px 0}
.finish .big{font-size:52px;margin-bottom:8px;line-height:1}
.finish h2{font-size:22px;margin-bottom:8px}
.finish p{color:var(--soft);font-size:15px;margin-top:4px}
.list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.list span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700}
.finish .btn{margin-top:16px}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;min-height:60px}
.set-row:last-child{border-bottom:0}
.set-row>span:first-child{flex:1}
.set-row>span small{display:block;color:var(--dim);font-size:13px;font-weight:500}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line);flex-shrink:0}
.seg button{border:none;background:transparent;color:var(--dim);font-family:inherit;font-weight:700;font-size:14px;padding:7px 14px;border-radius:9px;cursor:pointer;min-height:44px}
.seg button.on{background:var(--green);color:#06281c}
.about p{font-size:14.5px;line-height:1.6;color:var(--soft);margin-bottom:8px}
.about p:last-child{margin-bottom:0}
.source{padding:12px 0;border-bottom:1px solid var(--line)}
.source:last-child{border-bottom:0}
.source .n{color:var(--dim);font-size:12.5px;font-weight:800}
.source a{color:var(--blue);text-decoration:none;font-weight:700;font-size:15.5px;display:block;text-align:left;line-height:1.35}
.source p{color:var(--soft);font-size:14px;margin-top:3px;line-height:1.5}

/* ---------- overlay, toast, update ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeUp .2s ease}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px;border-top:1px solid var(--line);text-align:right}
.sheet h3{font-size:20px;margin-bottom:8px}
.dialog-text{color:var(--dim);font-size:15.5px;line-height:1.5;margin-bottom:18px}
.toast{
  position:fixed;top:calc(18px + env(safe-area-inset-top));right:50%;transform:translateX(50%);background:var(--card2);
  border:1px solid var(--line);color:var(--text);padding:11px 20px;border-radius:99px;max-width:92vw;text-align:center;
  font-weight:700;font-size:15px;z-index:200;animation:pop .25s ease both;box-shadow:var(--shadow);
}
.update-banner{position:fixed;z-index:300;right:16px;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:488px;margin:auto;background:#22304f;border:1px solid #3e527e;border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.update-banner .txt{flex:1;font-size:14.5px}
.update-banner .txt b{display:block;font-size:16px}
.update-banner .btn{width:auto;padding:11px 15px;font-size:15px;margin:0}

@media (max-width:360px){
  body{font-size:16px}
  .term-card .term-en{font-size:28px}
  .cue-en{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   אנגלית טכנית לחשמל — technical English for electrical-engineering studies.

/* CONTENT:BEGIN */
/* Generated by tools/embed-content.mjs from content/electrical_english_vocabulary.json — edit the JSON, not this block. */
const CONTENT = {

  "evidenceNote": "תרגום והסבר לימודי שנוסחו למאגר; המקורות הם לעיון במונחים, לא ציטוט של כל משפט ולא הוראת תכנון מחייבת.",
  "newPerSession": 5,
  "intervals": [1,3,7,14,30],
  "initialLessons": [["ee-en-manufacturer","ee-en-model","ee-en-datasheet","ee-en-input-power","ee-en-voltage"],["ee-en-current","ee-en-frequency","ee-en-single-phase","ee-en-three-phase","ee-en-energy-consumption"],["ee-en-rated-input-power","ee-en-maximum","ee-en-power-factor","ee-en-efficiency","ee-en-connected-load"]],
  "categories": [

  const rest = TERMS.map((t, i) => ({ t, i }))

  return [...INITIAL_LESSON_IDS, ...rest];
})();

/* ---------------- storage ---------------- */
const STORE_KEY = 'electricalEnglishV1';
/* the previous app's data; removed on every start, never read */
const LEGACY_KEYS = ['speakEnglishV1', 'speakEnglishPracticeCycleV1', 'english.samRun'];
let state = null;
let saveFailed = false;

function defaults(){
  return {
    v: 1, createdAt: Date.now(), terms: {}, exercises: {}, sessions: [],

    totals: { asked: 0, right: 0 },

}
function wipeLegacy(){

function normalizeState(raw){

    const r = terms[id];

    s.terms[id] = {
      seen: 1, at: num(r.at), box: clamp(Math.round(num(r.box)), 0, INTERVALS_DAYS.length), due: num(r.due),
      right: Math.max(0, Math.round(num(r.right))), wrong: Math.max(0, Math.round(num(r.wrong))),

  const exercises = raw.exercises && typeof raw.exercises === 'object' ? raw.exercises : {};
  for(const id of Object.keys(exercises)){
    const e = exercises[id];
    if(!EXERCISE_BY_ID.has(id) || !e) continue;
    s.exercises[id] = { tries: Math.max(0, Math.round(num(e.tries))), passed: !!e.passed, at: num(e.at) };
  }
  if(Array.isArray(raw.sessions)){
    s.sessions = raw.sessions.filter(x => x && typeof x === 'object').slice(-60).map(x => ({
      at: num(x.at), endedAt: num(x.endedAt), reviewed: num(x.reviewed), reviewRight: num(x.reviewRight),
      newAsked: num(x.newAsked), newRight: num(x.newRight),

  s.settings.newCount = clamp(Math.round(num(st.newCount, MAX_NEW_PER_SESSION)), 0, MAX_NEW_PER_SESSION);
  s.settings.topic = CATEGORY_BY_ID.has(st.topic) ? st.topic : 'auto';
  s.settings.slow = !!st.slow;
  s.settings.autoRead = st.autoRead === undefined ? true : !!st.autoRead;
  s.settings.sentences = !!st.sentences;
  if(raw.totals && typeof raw.totals === 'object'){
    s.totals.asked = Math.max(0, Math.round(num(raw.totals.asked)));

}
function load(){
  wipeLegacy();

  try{ raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); }catch(_){ raw = null; }

}
function save(){
  try{

    saveFailed = false;
  }catch(_){
    if(!saveFailed){ saveFailed = true; toast('לא הצלחתי לשמור את ההתקדמות במכשיר הזה'); }

/* ---------------- progress of a term ---------------- */

    if(r.due <= now){
      r.box = Math.min(r.box + 1, INTERVALS_DAYS.length);
      r.due = now + INTERVALS_DAYS[r.box - 1] * DAY;

    r.wrong++;

/* "I understood the English, not the concept": kept apart from the language

}
function termState(id, now = Date.now()){

}
const STATE_LABELS = { new: 'חדש', learning: 'בתרגול', due: 'לחזרה', mastered: 'שליטה מבוססת' };
function seenIds(){ return TERMS.map(t => t.id).filter(isSeen); }
function dueIds(now = Date.now()){

}

  const p = { total: 0, seen: 0, due: 0, mastered: 0, learning: 0, concept: 0 };
  for(const t of termsInCategory(cat)){
    p.total++;
    const s = termState(t.id, now);
    if(s !== 'new') p.seen++;
    if(s === 'due') p.due++;
    if(s === 'mastered') p.mastered++;

function unseenIds(topic = 'auto'){

}
function nextNewIds(count = state.settings.newCount, topic = state.settings.topic){

}
/* a chosen topic that has nothing left falls back to the recommended order */

}
/* The example sentence is an aid, not a thing to learn. By default ("only the

const openExamples = new Set();
function sentencesOn(){ return !!state?.settings?.sentences; }
function exampleShown(id){ return sentencesOn() || openExamples.has(id); }
function toggleExample(id){
  if(openExamples.has(id)) openExamples.delete(id); else openExamples.add(id);

function nextDue(now = Date.now()){

}
function dueLabel(due, now = Date.now()){

  if(due <= now) return 'עכשיו';
  const days = Math.ceil((due - now) / DAY);
  if(days <= 1) return 'מחר';

/* ---------------- building questions ---------------- */
/* The example sentence with the term itself blanked out; null when the

    out.add(l); out.add(l.replace(/-/g, ' ')); out.add(l.replace(/ /g, '-'));

    const re = new RegExp('(^|[^a-z])(' + escapeRegExp(v) + '(?:e?s)?)(?![a-z])');
    const m = re.exec(lower);
    if(m){
      const start = m.index + m[1].length, end = start + m[2].length;
      return { before: sentence.slice(0, start), hidden: sentence.slice(start, end), after: sentence.slice(end) };

  const consider = ids => {
    for(const id of ids){
      if(chosen.length >= count) return;
      if(chosen.includes(id) || !TERM_BY_ID.has(id)) continue;
      if(optionClash(id, chosen)) continue;
      chosen.push(id);
    }
  };
  consider(t.conf || []);
  const sameTopic = termsInCategory(t.cat).map(x => x.id).filter(id => id !== targetId);
  consider(shuffle(sameTopic.filter(isSeen)));
  consider(shuffle(sameTopic));

/* ---------------- a session ---------------- */
let S = null;
function buildSession({ newCount = state.settings.newCount, topic = state.settings.topic, now = Date.now() } = {}){
  const reviewIds = dueIds(now).slice(0, REVIEW_CAP);
  const newIds = nextNewIds(newCount, topic);
  const steps = [];
  /* what was learned before comes first; on the very first session there is nothing here */
  reviewIds.forEach(id => steps.push(makeQuestion(id, reviewKind(id), true)));
  /* each new term: its card, then one quick check while it is fresh */
  newIds.forEach((id, k) => {
    steps.push({ type: 'card', id, n: k + 1, of: newIds.length });
    const q = makeQuestion(id, 'meaning', false); q.quick = true; steps.push(q);
  });
  /* then every new term once more, in another shape, in a mixed order */
  steps.push(...shuffle(newIds.map((id, k) => {
    const kinds = kindsFor(id).filter(x => x !== 'meaning');
    return makeQuestion(id, kinds[k % kinds.length], false);
  })));
  /* comprehension exercises whose terms will all have been met by now */
  const known = new Set([...seenIds(), ...newIds]);
  for(const ex of EXERCISES){
    const needs = EXERCISE_REQUIRES[ex.id];
    if(!needs || state.exercises[ex.id]?.passed) continue;
    if(needs.every(id => known.has(id))) steps.push({ type: 'ex', id: ex.id });
  }
  steps.push({ type: 'done' });
  return {
    startedAt: now, steps, i: 0, reviewIds, newIds, learned: [], requeues: {}, answered: null, recorded: false,
    stats: { reviewAsked: 0, reviewRight: 0, newAsked: 0, newRight: 0, exAsked: 0, exRight: 0 },

function startSession(opts = {}){

}
function currentStep(){ return S ? S.steps[S.i] : null; }

}

  S.requeues[st.id] = n + 1;
  const q = makeQuestion(st.id, nextKind(st.id, st.kind), st.review);
  q.requeued = true;
  const at = Math.min(S.i + 1 + REQUEUE_GAP, S.steps.length - 1);
  S.steps.splice(at, 0, q);

}
function answer(i){
  const st = currentStep();

  i = Number(i);
  if(!(i >= 0 && i < st.options.length)) return;
  const correct = i === st.correct;
  S.answered = { chosen: i, correct };
  const bucket = st.review ? 'review' : 'new';
  S.stats[bucket + 'Asked']++;

  next();
}
function answerExercise(i){
  const st = currentStep();

  const ex = exercise(st.id);
  i = Number(i);
  if(!ex || !(i >= 0 && i < ex.answers.length)) return;
  const correct = i === ex.correct;
  S.answered = { chosen: i, correct };
  S.stats.exAsked++;
  if(correct) S.stats.exRight++;

function exitSession(){
  if(!S) { goHome(); return; }

    title: 'לצאת מהמפגש?',
    text: 'מה שכבר ענית נשמר. מונחים שהוצגו ועדיין לא תורגלו יחכו לחזרה במפגש הבא.',
    ok: 'יציאה', cancel: 'להמשיך', danger: true,

}
function goHome(){ S = null; renderHome(); }

/* ---------------- speech ----------------

   aloud are rendered only when an engine exists, so there is never a speaker
   icon that does nothing. */
let voices = [];

  try{ return typeof window !== 'undefined' && !!window.speechSynthesis && typeof SpeechSynthesisUtterance === 'function'; }
  catch(_){ return false; }
}
function loadVoices(){
  try{ voices = speechAvailable() ? (window.speechSynthesis.getVoices() || []) : []; }
  catch(_){ voices = []; }
}

  loadVoices();

}

function pickVoice(){
  if(!voices.length) loadVoices();

  const english = voices.filter(v => /^en([-_]|$)/i.test(v.lang || ''));
  const pool = english.length ? english : voices;
  for(const p of VOICE_PREFS){ const v = pool.find(v => String(v.name || '').indexOf(p) > -1); if(v) return v; }

}

function speak(text, cb){

  u.lang = 'en-US';

}

/* ---------------- rendering helpers ---------------- */

    if(applied || seq !== renderSeq) return;
    applied = true;

    try{ window.scrollTo(0, 0); }catch(_){}
  };

    try{
      const vt = document.startViewTransition(apply);

    ov.innerHTML = `
    <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" onclick="event.stopPropagation()">

    ov.onclick = () => resolveDialog(false);

const KNOWN_UNITS = new Set(['W', 'kW', 'V', 'A', 'kA', 'Hz', 'Wh', 'kWh', 'kWh/24h', 'kWh/year', 'var', 'kvar', 'VA', 'kVA', 'Ω', '°', '°C', 'lm', 'cd', 'lx', 'lm/W', 'mm²', 'min', 'h', 'm³/h', 'L/s', '%']);
function unitToken(t){
  let found = '';
  for(const part of String(t?.unit || '').split(/[;,]/)){

    if(KNOWN_UNITS.has(p)) found = p;
  }
  return found;
}
function specValue(t){ const u = unitToken(t); return u ? `… ${u}` : '—'; }

    <div class="section-title"><span>איפוס</span></div>
    <div class="card">
      <p class="hint" style="margin-bottom:12px">מוחק את כל ההתקדמות במסלול הזה במכשיר הזה: מונחים שנלמדו, חזרות, סימונים והגדרות. אין דרך לשחזר.</p>
      <button type="button" class="btn danger" onclick="resetProgress()">למחוק את ההתקדמות ולהתחיל מאפס</button>
    </div>
  </div>`);
}
function setSlow(on){ state.settings.slow = !!on; save(); if(currentView === 'settings' && !S) openSettings(); }
function setSentences(on){ state.settings.sentences = !!on; save(); if(currentView === 'settings' && !S) openSettings(); }
function setAutoRead(on){ state.settings.autoRead = !!on; save(); if(currentView === 'settings' && !S) openSettings(); }
function resetProgress(){
  askConfirm({
    title: 'למחוק את כל ההתקדמות?',
    text: 'כל המונחים יחזרו למצב ״חדש״ והמפגש הבא יתחיל מאפס. אי אפשר לבטל.',
    ok: 'למחוק', cancel: 'ביטול', danger: true,
  }).then(ok => {
    if(!ok) return;
    S = null;
    state = defaults();
    try{ localStorage.removeItem(STORE_KEY); }catch(_){}
    save();
    toast('ההתקדמות נמחקה');
    renderHome();
  });
}
function openSources(){
  currentView = 'sources';
  const entries = Object.entries(SOURCES);
  h(`${subTop('מקורות לעיון', 'openSettings()', `${entries.length} מקורות`)}
  <div class="screen" data-view="sources">
    <div class="card"><p class="hint">המקורות צורפו למאגר לעיון במינוח; הם לא אומתו מחדש במסגרת שינוי הפורמט, אינם הוראת תכנון ואינם אישור לכל תרגום. התרגומים והמשפטים הם תוכן לימודי שלנו.</p></div>
    <div class="card">
      ${entries.map(([key, s], i) => `<div class="source" id="source-${esc(key)}">
        <div class="n">${String(i + 1).padStart(2, '0')}</div>
        <a href="${esc(s.url)}" target="_blank" rel="noopener" dir="ltr">${esc(s.title)}</a>
        ${s.scope ? `<p>${esc(s.scope)}</p>` : ''}
      </div>`).join('')}
    </div>
  </div>`);
}

/* ---------------- the session screens ---------------- */
function playerTop(){
  const total = Math.max(1, S.steps.length - 1);
  const pct = Math.round(100 * Math.min(S.i, total) / total);
  return `<div class="player-top">
    <button type="button" class="icon-btn" onclick="exitSession()" aria-label="יציאה מהמפגש">✕</button>
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <span class="step-label">${Math.min(S.i + 1, total)} / ${total}</span>
  </div>`;
}
function renderStep(){
  const st = currentStep();
  if(!st){ goHome(); return; }
  currentView = 'session';
  if(st.type === 'card') renderCard(st);
  else if(st.type === 'q') renderQuestion(st, true);
  else if(st.type === 'ex') renderExercise(st, true);
  else renderDone();
}
function renderCard(st, { read = true } = {}){
  const t = term(st.id);
  /* seen the moment it is shown: closing the app now still brings it back for review */
  introduce(st.id);
  if(!S.learned.includes(st.id)) S.learned.push(st.id);
  h(`${playerTop()}
  <div class="screen" data-view="card">
    <div class="phase"><span>מונח חדש ${st.n} מתוך ${st.of}</span><span class="topic-name">${esc(category(t.cat)?.name || '')}</span></div>
    ${termCardHtml(t)}
    <button type="button" class="btn" onclick="next()">הבא</button>
  </div>`, read);
  if(read) readCard(st.id);
}
function questionLabel(st, t){
  switch(st.kind){
    case 'meaning': return 'מה הפירוש של המונח?';
    case 'reverse': return 'איך כותבים את זה באנגלית?';
    case 'sentence': return 'איזה מונח חסר במשפט?';
    case 'distinguish': return 'לאיזה מונח מתאים ההסבר?';
    case 'spec': return `באיזו שורה במפרט כתוב «${esc(t.he)}»?`;
  }
  return '';
}
function questionCue(st, t){
  switch(st.kind){
    case 'meaning': return `<div class="cue-en en" dir="ltr" lang="en"><span>${esc(t.en)}</span>${playBtn(`speakTerm('${t.id}')`, 'השמעת המונח')}</div>`;
    case 'reverse': return `<div class="cue-he">${esc(t.he)}</div>`;
    case 'sentence': {
      const b = st.blank || blankSentence(t);
      return `<div class="cue-sent en" dir="ltr" lang="en">${esc(b.before)}<span class="blank" aria-label="מילה חסרה">&nbsp;</span>${esc(b.after)}</div><div class="cue-sub">${esc(t.exHe)}</div>`;
    }
    case 'distinguish': return `<div class="cue-exp">${esc(t.exp)}</div>`;
  }
  return '';
}
function phaseLabel(st){
  if(st.type === 'ex') return 'תרגיל הבנה';
  const base = st.review ? 'חזרה' : st.quick ? 'בדיקה מהירה' : 'תרגול';
  return st.requeued ? `${base} · פעם נוספת` : base;
}
function renderQuestion(st, transition = true){
  const t = term(st.id);
  const a = S.answered;
  const mark = i => !a ? '' : i === st.correct ? ' right' : i === a.chosen ? ' wrong' : ' dimmed';
  const dis = a ? 'disabled' : '';
  let body;
  if(st.kind === 'spec'){
    body = `<div class="spec" role="table">
      <div class="spec-head"><span>Field</span><span>Value</span></div>
      ${st.options.map((id, i) => { const u = term(id); return `<button type="button" class="spec-row${mark(i)}" ${dis} onclick="answer(${i})"><span class="label">${esc(u.en)}</span><span class="val">${esc(specValue(u))}</span></button>`; }).join('')}
    </div>
    <div class="spec-note">תבנית מפרט לתרגול שפה בלבד — אין כאן נתוני מוצר.</div>`;
  }else{
    const lang = st.kind === 'meaning' ? 'he' : 'en';
    body = `${questionCue(st, t)}<div class="options">${st.options.map((id, i) => {
      const u = term(id);
      return `<button type="button" class="opt${lang === 'en' ? ' en' : ''}${mark(i)}" ${lang === 'en' ? 'dir="ltr" lang="en"' : ''} ${dis} onclick="answer(${i})">${esc(lang === 'he' ? u.he : u.en)}</button>`;
    }).join('')}</div>`;
  }
  h(`${playerTop()}
  <div class="screen" data-view="question" data-kind="${st.kind}">
    <div class="card">
      <div class="phase"><span>${phaseLabel(st)}</span><span class="topic-name">${esc(category(t.cat)?.name || '')}</span></div>
      <div class="q-label">${questionLabel(st, t)}</div>
      ${body}
      ${a ? feedbackHtml(st) : ''}
    </div>
  </div>`, transition);
}
function feedbackHtml(st){
  const t = term(st.id);
  const a = S.answered;
  const en = x => `<span class="en" dir="ltr" lang="en">${esc(x)}</span>`;
  if(a.correct){
    return `<div class="feedback ok" role="status">
      <h3>נכון</h3>
      <p>${en(t.en)} — ${esc(t.he)}. ${esc(t.exp)}</p>
      <button type="button" class="btn" onclick="next()">הבא</button>
    </div>`;
  }
  const chosen = term(st.options[a.chosen]);
  return `<div class="feedback bad" role="status">
    <h3>לא מדויק</h3>
    <p><b>בחרת:</b> ${en(chosen.en)} — ${esc(chosen.he)}. ${esc(chosen.exp)}</p>
    <p><b>התשובה:</b> ${en(t.en)} — ${esc(t.he)}. ${esc(t.exp)}</p>
    ${sentencesOn() ? `<p><b>דוגמה:</b> ${en(t.ex)}<br>${esc(t.exHe)}</p>` : ''}
    ${S.lastRequeued ? '<p class="hint">המונח יחזור לתרגול נוסף בהמשך המפגש.</p>' : ''}
    <button type="button" class="btn" onclick="next()">הבנתי</button>
    <button type="button" class="btn secondary" onclick="conceptAndNext()">הבנתי את האנגלית, לא את המושג בחשמל</button>
  </div>`;
}
function renderExercise(st, transition = true){
  const ex = exercise(st.id);
  if(!ex){ next(); return; }
  const a = S.answered;
  const mark = i => !a ? '' : i === ex.correct ? ' right' : i === a.chosen ? ' wrong' : ' dimmed';
  const dis = a ? 'disabled' : '';
  const real = ex.basis === 'manufacturer_excerpt';
  const source = real && ex.source && SOURCES[ex.source] ? SOURCES[ex.source] : null;
  const fields = ex.fields ? `<div class="spec" role="table">
      <div class="spec-head"><span>Field</span><span>Value</span></div>
      ${ex.fields.map(f => `<div class="spec-row static"><span class="label">${esc(f.label)}</span><span class="val">${esc(f.value)} ${esc(f.unit)}</span></div>`).join('')}
    </div>` : '';
  const text = ex.text ? `<div class="cue-sent en" dir="ltr" lang="en" style="margin-top:12px">${esc(ex.text)}</div>` : '';
  h(`${playerTop()}
  <div class="screen" data-view="exercise">
    <div class="card">
      <div class="phase"><span>${phaseLabel(st)}</span><span class="topic-name">${real ? 'מתוך דף נתונים' : 'תרגול מדומה'}</span></div>
      <p class="hint">${esc(ex.context || '')}${source ? ` מקור: <a href="${esc(source.url)}" target="_blank" rel="noopener" dir="ltr">${esc(source.title)}</a>` : ''}</p>
      ${fields}${text}
      ${!real ? '<div class="spec-note">מפרט מדומה לתרגול שפה בלבד — לא נתוני מוצר.</div>' : ''}
      <div class="q-label" style="margin-top:14px">${esc(ex.question)}</div>
      <div class="options">${ex.answers.map((ans, i) => `<button type="button" class="opt${mark(i)}" dir="auto" ${dis} onclick="answerExercise(${i})">${esc(ans)}</button>`).join('')}</div>
      ${a ? `<div class="feedback ${a.correct ? 'ok' : 'bad'}" role="status">
        <h3>${a.correct ? 'נכון' : 'לא מדויק'}</h3>
        <p>${esc(ex.explanation)}</p>
        ${a.correct ? '' : '<p class="hint">התרגיל יוצע שוב במפגש אחר.</p>'}
        <button type="button" class="btn" onclick="next()">${a.correct ? 'הבא' : 'הבנתי'}</button>
      </div>` : ''}
    </div>
  </div>`, transition);
}
function renderDone(){
  const now = Date.now();
  if(!S.recorded){
    S.recorded = true;
    state.sessions.push({
      at: S.startedAt, endedAt: now, reviewed: S.stats.reviewAsked, reviewRight: S.stats.reviewRight,
      newAsked: S.stats.newAsked, newRight: S.stats.newRight, learned: S.learned.slice(),
    });
    if(state.sessions.length > 60) state.sessions.splice(0, state.sessions.length - 60);
    save();
  }
  const due = dueIds(now).length;
  const upcoming = nextDue(now);
  const missed = Object.keys(S.requeues).filter(id => S.learned.includes(id) || S.reviewIds.includes(id));
  h(`
  <div class="screen" data-view="done">
    <div class="card finish">
      <div class="big">⚡</div>
      <h2>סיימת את המפגש</h2>
      ${S.stats.reviewAsked ? `<p>חזרות: ${S.stats.reviewRight} מתוך ${S.stats.reviewAsked} נכונות</p>` : ''}
      ${S.learned.length ? `<p>${newTermsLabel(S.learned.length)}:</p><div class="list">${S.learned.map(id => `<span class="en" dir="ltr" lang="en">${esc(term(id).en)}</span>`).join('')}</div>` : ''}
      ${S.stats.exAsked ? `<p>תרגילי הבנה: ${S.stats.exRight} מתוך ${S.stats.exAsked}</p>` : ''}
      ${missed.length ? `<p>חזרו לתרגול אחרי טעות: ${missed.length}</p>` : ''}
      <p>${due ? `${countTerms(due)} עדיין ממתינים לחזרה.` : upcoming ? `החזרה הבאה: ${dueLabel(upcoming, now)}.` : ''}</p>
      <button type="button" class="btn" onclick="goHome()">למסך הבית</button>
    </div>
  </div>`);
  S.i = S.steps.length - 1;
}

/* ---------------- page lifecycle ---------------- */
window.addEventListener('pagehide', () => { cancelSpeech(); });
window.addEventListener('pageshow', () => { if(!document.hidden) loadVoices(); });

/* a waiting update applies itself between sessions; mid-session it waits
   behind a banner, because a reload would drop the steps still to come */
let pendingServiceWorker = null;
let reloadingForUpdate = false;
let updateReloadTimer = null;
function tryAutoUpdate(){
  if(!pendingServiceWorker || reloadingForUpdate || S) return false;
  let tries = 0;
  try{ tries = Number(sessionStorage.getItem('eeAutoUpdateTries') || 0); }catch(_){}
  if(tries >= 2) return false;
  try{ sessionStorage.setItem('eeAutoUpdateTries', String(tries + 1)); }catch(_){}
  applyAppUpdate();
  return true;
}
function showUpdateBanner(worker){
  if(!worker) return;
  pendingServiceWorker = worker;
  if(tryAutoUpdate()) return;
  if(document.getElementById('updateBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'updateBanner'; banner.className = 'update-banner';
  banner.innerHTML = `<div class="txt"><b>גרסה חדשה מוכנה</b><span>ההתקדמות שלך נשמרת.</span></div><button type="button" class="btn" onclick="applyAppUpdate()">עדכון עכשיו</button>`;
  document.body.appendChild(banner);
}
function applyAppUpdate(){
  cancelSpeech();
  if(!pendingServiceWorker){ location.reload(); return; }
  if(pendingServiceWorker.state === 'activated' || pendingServiceWorker.state === 'redundant'){ location.reload(); return; }
  reloadingForUpdate = true;
  pendingServiceWorker.postMessage({ type: 'SKIP_WAITING' });
  clearTimeout(updateReloadTimer);
  updateReloadTimer = setTimeout(() => location.reload(), 3000);
}
if(typeof navigator !== 'undefined' && 'serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(reloadingForUpdate || document.getElementById('updateBanner')){
      clearTimeout(updateReloadTimer);
      location.reload();
    }
  });
  window.addEventListener('load', () => {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => {
      if(hadController && reg.waiting) showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange', () => {
          if(worker.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(worker);
        });
      });
      reg.update().catch(() => {});
    }).catch(() => {});
  });
}

load();
if(viewTransitionsEnabled()) document.documentElement?.classList?.add('vt');
renderHome();
</script>
