<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מדברים אנגלית — 15 דקות ביום</title>
<meta name="description" content="אפליקציה ללימוד דיבור באנגלית — שיעור קצר של 15 דקות כל יום, צעד אחר צעד.">
<meta name="theme-color" content="#0e1524">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0e1524;
  --bg2:#131c30;
  --card:#1a2540;
  --card2:#22304f;
  --line:#2c3b5e;
  --text:#eef2fb;
  --dim:#93a0bd;
  --green:#34d399;
  --green-dark:#0e9f6e;
  --blue:#60a5fa;
  --amber:#fbbf24;
  --pink:#f472b6;
  --radius:20px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Heebo","Arial Hebrew",Arial,sans-serif;
  font-size:17px;
  line-height:1.55;
  overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));}
.screen{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}70%{box-shadow:0 0 0 22px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(340deg);opacity:0}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 6px}
.brand{font-size:20px;font-weight:800}
.brand small{display:block;font-size:12.5px;font-weight:500;color:var(--dim)}
.chips{display:flex;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px}
.chip.gear{cursor:pointer;font-size:16px;color:var(--text);font-family:inherit;min-width:44px;min-height:44px;justify-content:center}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:16px 20px;
  font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;color:#06281c;
  background:linear-gradient(135deg,var(--green),#6ee7b7);
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--dim);border:none;font-weight:600;font-size:15px}
.btn:disabled{filter:grayscale(.6);opacity:.55;cursor:default}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* ---------- home ---------- */
.hello{margin:14px 2px 16px}
.hello h1{font-size:26px;font-weight:800;line-height:1.3}
.hello p{color:var(--dim);font-size:15.5px;margin-top:4px}
.today{position:relative;overflow:hidden;background:linear-gradient(140deg,#153054,#132a45 55%,#12233c);border:1px solid #29466e}
.today .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(52,211,153,.15);color:var(--green);font-size:13px;font-weight:800;border-radius:999px;padding:4px 12px;margin-bottom:10px}
.today h2{font-size:23px;font-weight:800;margin-bottom:4px}
.today .goal{color:#b9c6e2;font-size:15.5px;margin-bottom:16px}
.today .deco{position:absolute;left:-18px;top:-24px;font-size:110px;opacity:.09;transform:rotate(-12deg);pointer-events:none}
.done-today{background:linear-gradient(140deg,#14352b,#11291f);border:1px solid #1e4d3a;text-align:center}
.done-today .big{font-size:46px;margin-bottom:6px}
.done-today h2{font-size:21px;margin-bottom:6px}
.done-today p{color:#a7d9c3;font-size:15px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12.5px;color:var(--dim)}
.section-title{font-size:17px;font-weight:800;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.unit{margin-bottom:14px}
.unit-head{display:flex;align-items:center;gap:10px;padding:10px 4px;color:var(--dim);font-weight:800;font-size:14.5px}
.unit-head .bar{flex:1;height:1px;background:var(--line)}
.lesson-row{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;
  cursor:pointer;transition:transform .1s ease;width:100%;color:var(--text);font-family:inherit;text-align:right;
}
.lesson-row:active{transform:scale(.98)}
.lesson-row:disabled{cursor:default}
.lesson-row .num{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;flex-shrink:0;background:var(--card2);color:var(--dim);
}
.lesson-row.done .num{background:rgba(52,211,153,.16);color:var(--green)}
.lesson-row.current .num{background:linear-gradient(135deg,var(--green),#6ee7b7);color:#06281c}
.lesson-row.locked{opacity:.45;cursor:default}
.lesson-row .info{flex:1;min-width:0}
.lesson-row .info b{display:block;font-size:16px}
.lesson-row .info span{font-size:13px;color:var(--dim)}
.lesson-row .mark{font-size:18px}

/* ---------- lesson player ---------- */
.player-top{display:flex;align-items:center;gap:12px;padding:16px 0 14px}
.xbtn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:17px;cursor:pointer;flex-shrink:0}
.pbar{flex:1;height:12px;background:var(--card);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#6ee7b7);transition:width .4s ease}
.timer{font-size:13px;font-weight:700;color:var(--dim);min-width:44px;text-align:left;font-variant-numeric:tabular-nums}
.step{padding-top:8px}
.step-label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--blue);background:rgba(96,165,250,.12);padding:4px 12px;border-radius:999px;margin-bottom:14px}
.step h2{font-size:23px;font-weight:800;margin-bottom:8px}
.step .sub{color:var(--dim);font-size:15.5px;margin-bottom:18px}

.phrase-card{
  background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--radius);padding:26px 20px;text-align:center;margin-bottom:16px;animation:pop .3s ease both;
}
.phrase-en{direction:ltr;font-size:30px;font-weight:800;letter-spacing:.2px;margin-bottom:12px;line-height:1.35}
.phrase-en .w{cursor:pointer;border-bottom:1.5px dashed rgba(147,160,189,.45);transition:color .12s ease}
.phrase-en .w:active{color:var(--green)}
.phrase-en button.w{display:inline;background:none;border:0;color:inherit;font:inherit;padding:0;line-height:inherit}
.milestone{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.45);border-radius:16px;padding:14px 16px;margin:14px 0 0;font-weight:700;font-size:15.5px;color:var(--amber);animation:pop .4s ease both}
.streak-note{margin-top:10px;font-size:14.5px;color:#a7d9c3}
.phrase-tl{font-size:19px;color:var(--amber);font-weight:700;margin-bottom:6px}
.phrase-tl::before{content:"🗣️ ";font-size:15px}
.phrase-he{font-size:17px;color:var(--dim)}
.play-big{
  margin:6px auto 0;width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),#3b82f6);color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;transition:transform .12s ease;
}
.play-big:active{transform:scale(.92)}
.speak-zone{text-align:center;margin-top:6px}
.mic-btn{
  width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;margin:8px auto 10px;
  background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;font-size:38px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
}
.mic-btn.listening{animation:pulse 1.4s infinite;background:linear-gradient(135deg,#f87171,#ef4444)}
.mic-btn:active{transform:scale(.93)}
.mic-hint{font-size:14.5px;color:var(--dim)}
.heard{margin-top:12px;font-size:15px;color:var(--dim);direction:ltr;min-height:24px}
.result-msg{
  margin:14px auto 4px;padding:12px 18px;border-radius:14px;font-weight:800;font-size:17px;
  display:inline-block;animation:pop .3s ease both;
}
.result-msg.good{background:rgba(52,211,153,.15);color:var(--green)}
.result-msg.almost{background:rgba(251,191,36,.13);color:var(--amber)}

.quiz-q{margin-bottom:16px}
.quiz-opt{
  display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:15px 16px;font-size:17px;font-weight:700;color:var(--text);
  font-family:inherit;cursor:pointer;margin-bottom:10px;transition:all .15s ease;
}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.right{border-color:var(--green);background:rgba(52,211,153,.13);color:var(--green)}
.quiz-opt.wrong{border-color:#f87171;background:rgba(248,113,113,.09);animation:shake .35s ease}

.dlg-line{display:flex;gap:10px;margin-bottom:12px;animation:fadeUp .3s ease both}
.dlg-avatar{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.dlg-bubble{background:var(--card);border:1px solid var(--line);border-radius:16px;border-top-right-radius:4px;padding:11px 14px;max-width:82%}
.dlg-line.me{flex-direction:row-reverse}
.dlg-line.me .dlg-bubble{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.35);border-top-right-radius:16px;border-top-left-radius:4px}
.dlg-en{direction:ltr;text-align:left;font-weight:800;font-size:17.5px}
.dlg-tl{font-size:14.5px;color:var(--amber);margin-top:2px}
.dlg-he{font-size:13.5px;color:var(--dim);margin-top:1px}

.finish{text-align:center;padding-top:26px}
.finish .emoji{font-size:74px;animation:pop .5s ease both}
.finish h2{font-size:26px;margin:12px 0 6px}
.finish p{color:var(--dim);font-size:16px;margin-bottom:8px}
.finish .quote{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:18px 0;font-size:16px;color:#c9d4ec}
.confetti{position:fixed;bottom:-40px;font-size:26px;pointer-events:none;animation:floatUp linear both;z-index:50}

/* ---------- onboarding ---------- */
.onb{padding-top:8vh;text-align:center}
.onb .logo{font-size:64px}
.onb h1{font-size:28px;margin:14px 0 10px}
.onb p{color:var(--dim);font-size:16.5px;margin-bottom:8px}
.onb .promise{margin:22px 0;text-align:right}
.onb .promise div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;font-size:15.5px}
.onb input{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--text);
  padding:15px;font-size:18px;font-family:inherit;text-align:center;margin:6px 0 14px;outline:none;
}
.onb input:focus{border-color:var(--green)}

/* ---------- review ---------- */
.rev-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rev-item .txt{flex:1;min-width:0}
.rev-item .en{direction:ltr;text-align:right;font-weight:800;font-size:16.5px}
.rev-item .he{font-size:13.5px;color:var(--dim)}
.rev-play{width:44px;height:44px;border-radius:50%;border:none;background:var(--card2);color:var(--blue);font-size:17px;cursor:pointer;flex-shrink:0}

/* ---------- recall, challenges & conversation ---------- */
.recall-card{background:linear-gradient(150deg,#1e2d4a,var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;text-align:center;margin-bottom:16px}
.recall-card .cue{font-size:23px;font-weight:800;margin-bottom:6px}
.recall-card .cue-note{font-size:14px;color:var(--dim)}
.hint-box{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hint-box[hidden]{display:none}
.hint-en{direction:ltr;font-size:27px;font-weight:800;line-height:1.35}
.hint-tl{font-size:18px;color:var(--amber);font-weight:700;margin-top:6px}
.hint-actions{display:flex;gap:8px;margin:12px 0 4px}
.hint-actions .btn{padding:12px;font-size:15px}
.challenge-help{color:var(--dim);font-size:14.5px;margin:-5px 0 15px}
.audio-only{font-size:15px;color:var(--dim);margin:8px 0 16px}
.order-built{direction:ltr;min-height:62px;border:1.5px dashed var(--line);border-radius:14px;padding:12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.order-built.empty::after{content:"לחץ על החלקים לפי הסדר";direction:rtl;color:var(--dim);font-size:14px}
.word-bank{direction:ltr;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.word-chip{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;font-weight:750;cursor:pointer}
.word-chip:disabled{opacity:.3;cursor:default}
.built-chip{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.4);cursor:default}
.chat-thread{margin-bottom:16px}
.voice-note{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:15px}
.vdots{display:inline-flex;margin-inline-start:6px}
.vdots i{width:6px;height:6px;border-radius:50%;background:var(--dim);margin-inline-start:4px;animation:vblink 1.1s infinite}
.vdots i:nth-child(2){animation-delay:.2s}
.vdots i:nth-child(3){animation-delay:.4s}
@keyframes vblink{0%,100%{opacity:.2}50%{opacity:1}}
.scene{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);border-radius:14px;padding:11px 14px;font-size:15.5px;font-weight:700;color:#b9d4fb;margin-bottom:14px}
.chat-thread .dlg-line:last-child{margin-bottom:0}
.branch-options{display:grid;gap:10px;margin:14px 0}
.branch-options .quiz-opt{text-align:center;margin:0}
.mic-fallback{margin-top:8px}
.word-feedback{direction:ltr;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.word-feedback span{padding:4px 8px;border-radius:8px;background:rgba(52,211,153,.13);color:var(--green);font-weight:700;font-size:14px}
.word-feedback span.missing{background:rgba(251,191,36,.12);color:var(--amber)}
.resume-note{color:#b9c6e2;font-size:14.5px;margin:8px 0 14px}
.update-banner{position:fixed;z-index:300;right:16px;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:488px;margin:auto;background:#22304f;border:1px solid #3e527e;border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.update-banner .txt{flex:1;font-size:14.5px}
.update-banner .txt b{display:block;font-size:16px}
.update-banner .btn{width:auto;padding:11px 15px;font-size:15px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeUp .2s ease}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px;border-top:1px solid var(--line)}
.sheet h3{font-size:20px;margin-bottom:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:16px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{border:none;background:transparent;color:var(--dim);font-family:inherit;font-weight:700;font-size:14px;padding:7px 14px;border-radius:9px;cursor:pointer;min-height:44px}
.seg button.on{background:var(--green);color:#06281c}
.name-edit{background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font-size:16px;font-family:inherit;width:140px;outline:none}
.name-edit:focus{border-color:var(--green)}
.toast{
  position:fixed;top:calc(18px + env(safe-area-inset-top));right:50%;transform:translateX(50%);background:var(--card2);
  border:1px solid var(--line);color:var(--text);padding:11px 20px;border-radius:99px;
  font-weight:700;font-size:15px;z-index:200;animation:pop .25s ease both;box-shadow:var(--shadow);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   מדברים אנגלית — שיעור של 15 דקות ביום, עם דגש על דיבור וביטחון עצמי
   ===================================================================== */

/* ---------------- lesson content ---------------- */
const UNITS = [
  {title:'צעדים ראשונים', emoji:'👋'},
  {title:'על עצמי', emoji:'😎'},
  {title:'יום־יום', emoji:'🍕'},
  {title:'שיחה עם חברים', emoji:'💬'},
];

const LESSONS = [
/* ---- יחידה 1: צעדים ראשונים ---- */
{
  title:'להגיד שלום', goal:'בסוף השיעור תדע להגיד שלום ולשאול מה שלומך — באנגלית אמיתית.',
  phrases:[
    {en:'Hello!', he:'שלום!', tl:'הֶלוֹ'},
    {en:'Hi!', he:'היי!', tl:'הַיי'},
    {en:'Good morning', he:'בוקר טוב', tl:'גוּד מוֹרְנִינְג'},
    {en:'How are you?', he:'מה שלומך?', tl:'הַאוּ אַר יוּ?'},
    {en:"I'm good, thanks", he:'אני בסדר, תודה', tl:'אַיְים גוּד, תֶ׳נְקְס'},
  ],
  dialogue:[
    {who:'app', en:'Hi {name}! How are you?', he:'היי! מה שלומך?', tl:'היי! האו אר יו?'},
    {who:'you', en:"I'm good, thanks", he:'אני בסדר, תודה', tl:'איים גוד, ת׳נקס'},
    {who:'app', en:'Good morning!', he:'בוקר טוב!', tl:'גוד מורנינג!'},
    {who:'you', en:'Good morning! How are you?', he:'בוקר טוב! מה שלומך?', tl:'גוד מורנינג! האו אר יו?'},
    {who:'app', en:"I'm good too! I am Tom", he:'גם אני בסדר! אני טום', tl:'אַיְים גוּד טוּ! אַיי אַם טוֹם'},
    {who:'you', en:'Hi Tom! Good morning!', he:'היי טום! בוקר טוב!', tl:'הַיי טוֹם! גוּד מוֹרְנִינְג!'},
    {who:'app', en:'How are you today?', he:'מה שלומך היום?', tl:'הַאוּ אַר יוּ טוּדֵיי?'},
    {who:'you', en:"I'm good, thanks", he:'אני בסדר, תודה', tl:'אַיְים גוּד, תֶ׳נְקְס'},
  ],
},
{
  title:'להציג את עצמך', goal:'תלמד להגיד איך קוראים לך ומאיפה אתה — הדבר הראשון בכל שיחה.',
  phrases:[

/* ---------------- state ---------------- */
const STORE_KEY = 'speakEnglishV1';
const SESSION_STEP_TYPES = new Set([
  'intro','learn','speak','quiz','listenQuiz','order','dlgIntro','listen',
  'branchChoice','branchPending','done',
]);
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && typeof s === 'object'){
      const out = Object.assign(defaults(), s);
      out.name = typeof out.name === 'string' ? out.name.slice(0,20) : '';
      out.onboarded = !!out.onboarded;
      out.completed = Math.max(0, Math.min(LESSONS.length, Math.floor(Number(out.completed) || 0)));
      out.streak = Math.max(0, Number(out.streak) || 0);
      out.lessonsToday = Math.max(0, Math.floor(Number(out.lessonsToday) || 0));
      out.hard = Array.isArray(out.hard) ? [...new Set(out.hard.filter(x=>typeof x === 'string'))].slice(-20) : [];
      out.reviewMeta = out.reviewMeta && typeof out.reviewMeta === 'object' && !Array.isArray(out.reviewMeta) ? out.reviewMeta : {};
      out.lastWarmupIds = Array.isArray(out.lastWarmupIds) ? out.lastWarmupIds.filter(x=>typeof x === 'string').slice(-20) : [];
      out.reviewMeta=normalizeReviewMeta(out.reviewMeta,out.hard);
      out.hard=reviewHardIds(out.reviewMeta,out.hard);
      out.lastWarmupIds=reviewWarmupIds(out.reviewMeta,out.lastWarmupIds);
      for(const field of ['profileUpdatedAt','settingsUpdatedAt','reviewUpdatedAt','progressUpdatedAt','sessionUpdatedAt'])
        out[field]=Math.max(0,Number(out[field])||0);
      out.finishedRuns=Array.isArray(out.finishedRuns)
        ? [...new Set(out.finishedRuns.filter(x=>typeof x==='string'))].slice(-200) : [];
      out.session = validSavedSession(out.session) ? out.session : null;
      if(out.session && ((!out.session.isReplay && out.session.idx!==out.completed) ||
        (out.session.isReplay && out.session.idx>=out.completed))) out.session=null;
      return out;
    }
  }catch(e){}
  return defaults();
}
function defaults(){
  return {
    schemaVersion:2, name:'', onboarded:false, completed:0, streak:0,
    lastDoneDate:'', lessonsToday:0, replays:0, slowSpeech:true, micEnabled:true,
    hard:[], reviewMeta:{}, lastWarmupIds:[], lastGraceTs:0, session:null,
    profileUpdatedAt:0, settingsUpdatedAt:0, reviewUpdatedAt:0,
    progressUpdatedAt:0, sessionUpdatedAt:0, finishedRuns:[],
  };
}
function normalizeReviewMeta(raw, hardIds=[]){
  const source=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
  const hardSet=new Set(Array.isArray(hardIds)?hardIds:[]);
  const ids=new Set([...Object.keys(source),...hardSet]);
  const normalized={};
  for(const id of ids){
    if(typeof id!=='string') continue;
    const value=source[id]&&typeof source[id]==='object'&&!Array.isArray(source[id])?source[id]:{};
    const meta={...value};
    for(const field of ['successes','lapses','hints','lastPracticedAt','lastWarmupAt','updatedAt','hardUpdatedAt'])
      meta[field]=Math.max(0,Number(meta[field])||0);
    meta.hard=typeof value.hard==='boolean'?value.hard:hardSet.has(id);
    normalized[id]=meta;
  }
  return normalized;
}
function reviewEntryStamp(meta){
  return Math.max(Number(meta?.updatedAt)||0,Number(meta?.hardUpdatedAt)||0,
    Number(meta?.lastPracticedAt)||0,Number(meta?.lastWarmupAt)||0);
}
function reviewHardIds(meta, preferredOrder=[]){
  const order=new Map((Array.isArray(preferredOrder)?preferredOrder:[]).map((id,i)=>[id,i]));
  return Object.keys(meta||{}).filter(id=>meta[id]?.hard).sort((a,b)=>
    (Number(meta[a].hardUpdatedAt)||reviewEntryStamp(meta[a]))-
    (Number(meta[b].hardUpdatedAt)||reviewEntryStamp(meta[b])) ||
    (order.get(a)??-1)-(order.get(b)??-1)
  ).slice(-20);
}
function reviewWarmupIds(meta, preferredOrder=[]){
  const candidates=[...new Set([
    ...(Array.isArray(preferredOrder)?preferredOrder.filter(id=>meta?.[id]):[]),
    ...Object.keys(meta||{}).filter(id=>Number(meta[id].lastWarmupAt)>0),
  ])];
  const order=new Map(candidates.map((id,i)=>[id,i]));
  return candidates.sort((a,b)=>(Number(meta[a]?.lastWarmupAt)||0)-(Number(meta[b]?.lastWarmupAt)||0) ||
    (order.get(a)??0)-(order.get(b)??0)).slice(-20);
}
function validPhraseData(p){
  return !!(p && typeof p.en === 'string' && typeof p.he === 'string' && typeof p.tl === 'string');
}
function validSessionStep(step){
  if(!step || !SESSION_STEP_TYPES.has(step.type)) return false;
  if(step.type === 'learn' || step.type === 'speak') return validPhraseData(step.p);
  if(step.type === 'quiz'){
    return validPhraseData(step.p) && Array.isArray(step.options) &&
      step.options.length >= 2 && step.options.every(x=>typeof x === 'string');
  }
  if(step.type === 'listen') return validPhraseData(step.line);
  if(step.type === 'listenQuiz'){
    return validPhraseData(step.p) && typeof step.correct === 'string' &&
      Array.isArray(step.options) && step.options.length >= 2 && step.options.every(x=>typeof x === 'string');
  }
  if(step.type === 'order'){
    return validPhraseData(step.p) && Array.isArray(step.chunks) && step.chunks.length >= 2 &&
      step.chunks.every(x=>typeof x === 'string') && Array.isArray(step.bankOrder) &&
      step.bankOrder.length === step.chunks.length &&
      step.bankOrder.every(x=>Number.isInteger(x) && x>=0 && x<step.chunks.length) &&
      new Set(step.bankOrder).size === step.chunks.length && Array.isArray(step.selected) &&
      step.selected.every(x=>Number.isInteger(x) && x>=0 && x<step.chunks.length);
  }
  if(step.type === 'branchChoice'){
    return Array.isArray(step.options) && step.options.length >= 2 && step.options.every(option=>
      option && typeof option.label === 'string' && validPhraseData(option.answer) && validPhraseData(option.reply));
  }
  return true;
}
function validSavedSession(s){
  if(!(s && s.version === SESSION_VERSION && Number.isInteger(s.idx) &&
    s.idx >= 0 && s.idx < LESSONS.length && Array.isArray(s.steps) &&
    s.steps.length > 0 && s.steps.length <= 100 && s.steps.every(validSessionStep) &&
    Number.isInteger(s.i) && s.i >= 0 && s.i < s.steps.length &&
    typeof s.isReplay === 'boolean' && Number.isFinite(Number(s.elapsedMs)) && Number(s.elapsedMs)>=0)) return false;
  const current=s.steps[s.i];
  return current.type !== 'done' && current.type !== 'branchPending';
}
function dateValue(value){
  const match=String(value||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!match) return 0;
  return Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3]));
}
function touchState(field){ state[field]=Math.max(Date.now(),(Number(state[field])||0)+1); }
function rememberFinishedRun(runId){
  if(typeof runId!=='string'||!runId) return;
  state.finishedRuns=(state.finishedRuns||[]).filter(id=>id!==runId);
  state.finishedRuns.push(runId);
  state.finishedRuns=state.finishedRuns.slice(-200);
}
function reconcileStoredProgress(){
  try{
    const stored=JSON.parse(localStorage.getItem(STORE_KEY));
    if(!stored || typeof stored !== 'object') return;

    const storedProfileTs=Math.max(0,Number(stored.profileUpdatedAt)||0);
    if(storedProfileTs>(Number(state.profileUpdatedAt)||0)){
      state.name=typeof stored.name==='string'?stored.name.slice(0,20):'';
      state.onboarded=!!stored.onboarded;
    }
    state.profileUpdatedAt=Math.max(Number(state.profileUpdatedAt)||0,storedProfileTs);

    const storedSettingsTs=Math.max(0,Number(stored.settingsUpdatedAt)||0);
    if(storedSettingsTs>(Number(state.settingsUpdatedAt)||0)){
      state.slowSpeech=stored.slowSpeech!==false;
      state.micEnabled=stored.micEnabled!==false;
    }
    state.settingsUpdatedAt=Math.max(Number(state.settingsUpdatedAt)||0,storedSettingsTs);

    const localReviewTs=Math.max(0,Number(state.reviewUpdatedAt)||0);
    const storedReviewTs=Math.max(0,Number(stored.reviewUpdatedAt)||0);
    const localReview=normalizeReviewMeta(state.reviewMeta,state.hard);
    const storedReview=normalizeReviewMeta(stored.reviewMeta,stored.hard);
    const mergedReview={};
    for(const id of new Set([...Object.keys(localReview),...Object.keys(storedReview)])){
      const localMeta=localReview[id], storedMeta=storedReview[id];
      if(!localMeta) mergedReview[id]=storedMeta;
      else if(!storedMeta) mergedReview[id]=localMeta;
      else {
        const localStamp=reviewEntryStamp(localMeta), storedStamp=reviewEntryStamp(storedMeta);
        mergedReview[id]=storedStamp>localStamp || (storedStamp===localStamp&&storedReviewTs>localReviewTs)
          ? storedMeta : localMeta;
      }
    }
    state.reviewMeta=mergedReview;
    state.hard=reviewHardIds(mergedReview,[
      ...(Array.isArray(stored.hard)?stored.hard:[]),...(Array.isArray(state.hard)?state.hard:[]),
    ]);
    state.lastWarmupIds=reviewWarmupIds(mergedReview,[
      ...(Array.isArray(state.lastWarmupIds)?state.lastWarmupIds:[]),
      ...(Array.isArray(stored.lastWarmupIds)?stored.lastWarmupIds:[]),
    ]);
    state.reviewUpdatedAt=Math.max(localReviewTs,storedReviewTs);

    state.completed=Math.min(LESSONS.length,Math.floor(Math.max(Number(state.completed)||0,Number(stored.completed)||0)));
    state.replays=Math.max(Number(state.replays)||0,Number(stored.replays)||0);
    state.lastGraceTs=Math.max(Number(state.lastGraceTs)||0,Number(stored.lastGraceTs)||0);
    state.progressUpdatedAt=Math.max(Number(state.progressUpdatedAt)||0,Number(stored.progressUpdatedAt)||0);
    const localDay=dateValue(state.lastDoneDate), storedDay=dateValue(stored.lastDoneDate);
    if(storedDay>localDay){
      state.lastDoneDate=stored.lastDoneDate;
      state.streak=Math.max(0,Number(stored.streak)||0);
      state.lessonsToday=Math.max(0,Math.floor(Number(stored.lessonsToday)||0));
    } else if(storedDay===localDay){
      state.streak=Math.max(Number(state.streak)||0,Number(stored.streak)||0);
      state.lessonsToday=Math.max(Number(state.lessonsToday)||0,Math.floor(Number(stored.lessonsToday)||0));
    }

    state.finishedRuns=[...new Set([
      ...(Array.isArray(stored.finishedRuns)?stored.finishedRuns.filter(x=>typeof x==='string'):[]),
      ...(Array.isArray(state.finishedRuns)?state.finishedRuns.filter(x=>typeof x==='string'):[]),
    ])].slice(-200);
    const finishedSet=new Set(state.finishedRuns);
    const localSession=validSavedSession(state.session)&&!finishedSet.has(state.session.runId)?state.session:null;
    const storedSession=validSavedSession(stored.session)&&!finishedSet.has(stored.session.runId)?stored.session:null;
    const localSessionTs=Math.max(0,Number(state.sessionUpdatedAt)||0);
    const storedSessionTs=Math.max(0,Number(stored.sessionUpdatedAt)||0);
    let chosenSession=localSession;
    const sameRun=localSession&&storedSession&&localSession.runId&&localSession.runId===storedSession.runId;
    if(sameRun){
      if(storedSession.i>localSession.i) chosenSession=storedSession;
      else if(storedSession.i===localSession.i){
        const furthestElapsed=Math.max(Number(localSession.elapsedMs)||0,Number(storedSession.elapsedMs)||0);
        localSession.elapsedMs=furthestElapsed;
        storedSession.elapsedMs=furthestElapsed;
        if(storedSessionTs>localSessionTs || (storedSessionTs===localSessionTs &&
          (Number(storedSession.savedAt)||0)>(Number(localSession.savedAt)||0))) chosenSession=storedSession;
      }
    } else if(storedSessionTs>localSessionTs) chosenSession=storedSession;
    else if(storedSessionTs===localSessionTs && localSession && storedSession &&
      (Number(storedSession.savedAt)||0)>(Number(localSession.savedAt)||0)) chosenSession=storedSession;
    else if(storedSessionTs===localSessionTs && !localSession && storedSession){
      chosenSession=storedSession;
    }
    state.session=chosenSession;
    state.sessionUpdatedAt=Math.max(localSessionTs,storedSessionTs);
    if(state.session && ((!state.session.isReplay && state.session.idx!==state.completed) ||
      (state.session.isReplay && state.session.idx>=state.completed))){
      rememberFinishedRun(state.session.runId);
      state.session=null;
      touchState('sessionUpdatedAt');
    }
  }catch(e){}
}
function save(){
  try{ reconcileStoredProgress(); localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
  catch(e){ return false; }
}
function dateNDaysAgo(n){
  const d = new Date();
  d.setHours(12,0,0,0);
  d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function todayStr(){ return dateNDaysAgo(0); }
function yesterdayStr(){ return dateNDaysAgo(1); }
/* how many lessons were completed today; states saved before the bonus
   feature existed have no counter, so a lastDoneDate of today counts as 1 */
function lessonsDoneToday(){
  if(state.lastDoneDate !== todayStr()) return 0;
  return Math.max(1, Math.floor(Number(state.lessonsToday) || 0));
}
const MAX_LESSONS_PER_DAY = 2;
/* phrases the learner struggled with, remembered across days for warm-up review */
function reviewMetaFor(id){
  state.reviewMeta=state.reviewMeta||{};
  if(!state.reviewMeta[id]) state.reviewMeta[id]={
    successes:0,lapses:0,hints:0,lastPracticedAt:0,lastWarmupAt:0,
    updatedAt:0,hard:false,hardUpdatedAt:0,
  };
  return state.reviewMeta[id];
}
function setReviewHard(id, hard, at=Date.now()){
  if(!id) return;
  const meta=reviewMetaFor(id);
  meta.hard=!!hard;
  meta.hardUpdatedAt=at;
  meta.updatedAt=Math.max(Number(meta.updatedAt)||0,at);
}
function addHard(id, persist=true, at=Date.now()){
  if(!id) return;
  state.hard=(state.hard||[]).filter(x=>x!==id);
  state.hard.push(id);
  setReviewHard(id,true,at);
  if(state.hard.length>20){
    const removed=state.hard.shift();
    if(removed) setReviewHard(removed,false,at);
  }
  if(persist){ touchState('reviewUpdatedAt'); save(); }
}
function removeHard(id, persist=true, at=Date.now()){
  if(!id) return;
  state.hard = (state.hard || []).filter(x => x !== id);
  setReviewHard(id,false,at);
  if(persist){ touchState('reviewUpdatedAt'); save(); }
}
function notePractice(id, result, usedHint=false, wasWarmup=false){
  if(!id) return;
  const at=Date.now();
  const meta=reviewMetaFor(id);
  meta.lastPracticedAt=at;
  if(wasWarmup){
    meta.lastWarmupAt=at;
    state.lastWarmupIds = (state.lastWarmupIds || []).filter(x=>x!==id);
    state.lastWarmupIds.push(id);
    state.lastWarmupIds = state.lastWarmupIds.slice(-20);
  }
  if(result === 'pass'){
    meta.successes = (meta.successes || 0) + 1;
    if(!usedHint) removeHard(id,false,at);
    else addHard(id,false,at);
  } else if(result === 'fail'){
    meta.lapses = (meta.lapses || 0) + 1;
    addHard(id,false,at);
  }
  meta.updatedAt=Math.max(Number(meta.updatedAt)||0,at);
  touchState('reviewUpdatedAt');
  save();
}

let voices = [];
let autoSpeakTimer = null;
let uiEpoch = 0;
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  if(!voices.length) loadVoices();
  const prefs = ['Google US English','Samantha','Microsoft Zira','Microsoft Aria'];
  for(const p of prefs){ const v = voices.find(v=>v.name.indexOf(p)>-1); if(v) return v; }
  return voices.find(v=>/^en(-|_)US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)) || null;
}
function speak(text, cb){
  if(!('speechSynthesis' in window)){ if(cb) cb(); return; }
  if(typeof L !== 'undefined' && L && L.rec){
    stopRecognition();
    const micButton=document.getElementById('micBtn');
    const micHint=document.getElementById('micHint');

function cancelAutoSpeak(){

    autoSpeakTimer = null;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let micUnavailableThisSession = false;
function micAvailable(){ return !!SR && state.micEnabled && !micUnavailableThisSession; }
function normalize(s){
  return String(s || '').toLowerCase().replace(/[’‘]/g,"'")
    .replace(/\b([1-9]|10):00\b/g,'$1 oclock')
    .replace(/\b20\b/g,'twenty').replace(/\b17\b/g,'seventeen').replace(/\b10\b/g,'ten').replace(/\b9\b/g,'nine')
    .replace(/\b8\b/g,'eight').replace(/\b7\b/g,'seven').replace(/\b6\b/g,'six')
    .replace(/\b5\b/g,'five').replace(/\b4\b/g,'four').replace(/\b3\b/g,'three')
    .replace(/\b2\b/g,'two').replace(/\b1\b/g,'one')
    .replace(/\bdont\b/g,"don't").replace(/\bcant\b/g,"can't").replace(/\bcannot\b/g,'can not')
    .replace(/i'm/g,'i am').replace(/what's/g,'what is').replace(/it's/g,'it is')
    .replace(/don't/g,'do not').replace(/can't/g,'can not').replace(/you're/g,'you are')
    .replace(/i'll/g,'i will').replace(/let's/g,'let us').replace(/that's/g,'that is')
    .replace(/\bo\s*'?\s*clock\b/g,'oclock').replace(/\bokay\b/g,'ok')
    .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function matchDetails(target, heard){
  const t = normalize(target).split(' ').filter(Boolean);
  const h = normalize(heard).split(' ').filter(Boolean);
  if(!t.length) return {score:1, words:[], matched:[], criticalMismatch:false};

  // Longest common subsequence: word order matters, while a dropped short word
  // does not automatically fail an otherwise clear beginner sentence.
  const dp = Array.from({length:t.length+1}, ()=>Array(h.length+1).fill(0));
  for(let i=1;i<=t.length;i++){
    for(let j=1;j<=h.length;j++){
      dp[i][j] = t[i-1] === h[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const matched = Array(t.length).fill(false);
  let i=t.length, j=h.length;
  while(i>0 && j>0){
    if(t[i-1] === h[j-1]){ matched[i-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  let score = dp[t.length][h.length] / Math.max(t.length, h.length, 1);
  const critical = new Set(['not','no','never','without']);
  const targetCritical = t.filter(w=>critical.has(w));
  const heardCritical = h.filter(w=>critical.has(w));
  const criticalMismatch = targetCritical.some(w=>!heardCritical.includes(w)) || heardCritical.some(w=>!targetCritical.includes(w));
  if(criticalMismatch) score = Math.min(score, .49);
  return {score, words:t, matched, criticalMismatch};
}
function matchScore(target, heard){ return matchDetails(target, heard).score; }

/* ================= lesson player ================= */
let L = null; // current lesson session
function shuffled(arr){
  const out = arr.slice();
  for(let i=out.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [out[i],out[j]] = [out[j],out[i]];
  }
  return out;
}
function allLearnedPhrases(idx){
  const out = [];
  for(let li=0;li<idx;li++) LESSONS[li].phrases.forEach((p,pi)=>out.push({p,id:li+':'+pi,li,pi}));
  return out;
}
function warmupOrder(items, hardFirst=false){
  return shuffled(items).sort((a,b)=>{
    const am = (state.reviewMeta || {})[a.id] || {};
    const bm = (state.reviewMeta || {})[b.id] || {};
    if(hardFirst){
      const ah = (am.lapses||0) + (am.hints||0) - (am.successes||0);
      const bh = (bm.lapses||0) + (bm.hints||0) - (bm.successes||0);
      if(ah !== bh) return bh-ah;
    }
    return (am.lastWarmupAt||0) - (bm.lastWarmupAt||0);
  });
}
function takeWarmup(pool, amount, chosen, lastSet, allowRecentRepeat=false){
  if(amount <= 0) return;
  const fresh = pool.filter(x=>!chosen.has(x.id) && (allowRecentRepeat || !lastSet.has(x.id)));
  const repeated = pool.filter(x=>!chosen.has(x.id) && !fresh.includes(x));
  for(const item of [...fresh,...repeated]){
    if(amount-- <= 0) break;
    chosen.set(item.id,item);
  }
}
function arrangeWarmup(items, hardSet, recentStart){
  const hard = shuffled(items.filter(x=>hardSet.has(x.id)));
  const recent = shuffled(items.filter(x=>!hardSet.has(x.id) && x.li>=recentStart));
  const older = shuffled(items.filter(x=>!hardSet.has(x.id) && x.li<recentStart));
  const ordered = [];
  // At the 20-item cap this creates H-R-H-O instead of a discouraging block
  // of ten difficult phrases followed by everything else.
  while(hard.length || recent.length || older.length){
    if(hard.length) ordered.push(hard.shift());
    if(recent.length) ordered.push(recent.shift());
    if(hard.length) ordered.push(hard.shift());
    if(older.length) ordered.push(older.shift());
  }
  return ordered;
}
function selectWarmup(idx, target){
  const learned = allLearnedPhrases(idx);
  const hardSet = new Set(state.hard || []);
  const lastSet = new Set(state.lastWarmupIds || []);
  const chosen = new Map();
  const recentStart = Math.max(0,idx-2);
  const olderExists = learned.some(x=>x.li < recentStart);
  const recentReserve = Math.min(5,Math.max(1,Math.floor(target/4)));
  const oldReserve = olderExists ? Math.min(5,Math.max(1,Math.floor(target/4))) : 0;
  const hardReserve = Math.min(10,Math.max(0,target-recentReserve-oldReserve));

  const hard = warmupOrder(learned.filter(x=>hardSet.has(x.id)), true);
  takeWarmup(hard,hardReserve,chosen,lastSet);

  const recent = warmupOrder(learned.filter(x=>!hardSet.has(x.id) && x.li>=recentStart));
  takeWarmup(recent,recentReserve,chosen,lastSet);

  const older = warmupOrder(learned.filter(x=>!hardSet.has(x.id) && x.li<recentStart));
  takeWarmup(older,oldReserve,chosen,lastSet);

  // Fill a small/uneven bucket without duplicating a phrase.
  takeWarmup(warmupOrder(learned.filter(x=>!hardSet.has(x.id))),target-chosen.size,chosen,lastSet);
  takeWarmup(hard,target-chosen.size,chosen,lastSet);
  return arrangeWarmup([...chosen.values()].slice(0,target),hardSet,recentStart);
}
/* {name} tokens appear only in bot (listen) lines. The display shows the
   learner's name as typed; speech drops it unless it's written in Latin
   letters, since the English voice can't pronounce a Hebrew name. */
function fillName(s, nm){
  const name = (nm !== undefined ? nm : (state.name || '')).trim();
  return String(s)
    .replace(/,\s*\{name\}/g, name ? ', ' + name : '')
    .replace(/\s*\{name\}/g, name ? ' ' + name : '')
    .replace(/\s{2,}/g, ' ')
    .replace(/\s+([!?.,])/g, '$1')
    .trim();
}
function fillNameSpoken(s){
  const nm = (state.name || '').trim();
  return fillName(s, /^[A-Za-z' .-]+$/.test(nm) ? nm : '');
}
function phraseIdForText(en, maxLessonIdx){
  const target = normalize(en);
  for(let li=0;li<=maxLessonIdx;li++){
    const pi = LESSONS[li].phrases.findIndex(p=>normalize(p.en)===target);
    if(pi>-1) return li+':'+pi;
  }
  return null;
}
function splitPhraseChunks(en){
  const words = String(en).trim().split(/\s+/);
  if(words.length <= 4) return words;
  const size = Math.ceil(words.length/4);
  const chunks = [];
  for(let i=0;i<words.length;i+=size) chunks.push(words.slice(i,i+size).join(' '));
  return chunks;
}
function makeOrderStep(p, hid){
  const chunks = splitPhraseChunks(p.en);
  let bankOrder = shuffled(chunks.map((_,i)=>i));
  if(bankOrder.every((v,i)=>v===i) && bankOrder.length>1) bankOrder = bankOrder.slice().reverse();
  return {type:'order',p,hid,chunks,bankOrder,selected:[]};
}
function buildChallengeSteps(idx, lesson){
  const type = CHALLENGE_PLAN[idx] || 'listen';
  let pairs = lesson.phrases.map((p,pi)=>({p,pi}));
  if(type === 'order' && ORDER_PHRASE_INDEXES[idx]) pairs = ORDER_PHRASE_INDEXES[idx].map(pi=>({p:lesson.phrases[pi],pi}));
  else pairs = shuffled(pairs).slice(0,3);
  return pairs.map(({p,pi})=>{
    const hid = idx+':'+pi;
    if(type === 'order') return makeOrderStep(p,hid);
    if(type === 'recall') return {type:'speak',p,hid,challenge:true};
    const wrong = shuffled(lesson.phrases.filter(x=>x!==p)).slice(0,2).map(x=>x.he);
    return {type:'listenQuiz',p,hid,correct:p.he,options:shuffled([p.he,...wrong])};
  });
}
function startLesson(idx, isReplay, force=false){
  if(!Number.isInteger(idx) || idx<0 || idx>=LESSONS.length) return;
  if(state.session && !force){
    if(state.session.idx === idx && !!state.session.isReplay === !!isReplay) return resumeLesson();
    if(!confirm('יש שיעור שעצרת באמצע. להתחיל שיעור אחר ולוותר על המקום השמור?')) return;
  }
  rememberFinishedRun(state.session?.runId);
  state.session = null;
  const lesson = LESSONS[idx];
  const steps = [{type:'intro'}];
  let warmupIds = [];
  // The cumulative review deliberately grows with the course and stops at 20.
  // At the cap: up to 10 hard, 5 recent and 5 older phrases.
  if(!isReplay && idx > 0){
    const target = Math.min(2 + idx, 20);
    const chosen = selectWarmup(idx,target);
    warmupIds = chosen.map(x=>x.id);
    chosen.forEach(x=>steps.push({type:'speak',p:x.p,warmup:true,hid:x.id}));
  }
  lesson.phrases.forEach((p,pi)=>{
    const hid = idx+':'+pi;
    steps.push({type:'learn',p,hid});
    steps.push({type:'speak',p,hid});
  });
  steps.push(...buildChallengeSteps(idx,lesson));
  steps.push({type:'dlgIntro',unitChallenge:!!BRANCH_DIALOGUES[idx]});
  const branch = BRANCH_DIALOGUES[idx];
  if(branch){
    branch.rounds.forEach(round=>{
      steps.push({type:'listen',line:round.ask,isBranchAsk:true});
      steps.push({type:'branchChoice',options:round.options});
      // Reserve the two choice-dependent screens so the progress bar never
      // moves backwards when the learner selects an answer.
      steps.push({type:'branchPending'});
      steps.push({type:'branchPending'});
    });
  } else {
    // when the lesson has a closing choice, the last scripted exchange
    // (lines 7-8) is replaced by ask → choice → answer → reply
    const choice = LESSON_CHOICES[idx];
    const lines = choice ? lesson.dialogue.slice(0, 6) : lesson.dialogue;
    lines.forEach(line=>{
      steps.push(line.who === 'app'
        ? {type:'listen',line}
        : {type:'speak',p:line,isDlg:true,hid:phraseIdForText(line.en,idx)});
    });
    if(choice){
      steps.push({type:'listen',line:lesson.dialogue[6],isBranchAsk:true});
      steps.push({type:'branchChoice',options:choice.options});
      steps.push({type:'branchPending'});
      steps.push({type:'branchPending'});
    }
  }
  steps.push({type:'done'});
  L = {
    idx,lesson,steps,i:0,isReplay,tries:0,attempts:0,rec:null,timerId:null,
    elapsedBeforeMs:0,activeSince:Date.now(),chat:[],warmupIds,
    runId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),
  };
  saveLessonCheckpoint();
  renderStep();
  startLessonClock();
}
function activeElapsedMs(){
  if(!L) return 0;
  return (L.elapsedBeforeMs||0) + (L.activeSince ? Date.now()-L.activeSince : 0);
}
function elapsed(){
  const s = Math.floor(activeElapsedMs()/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function updateTimer(){ const el = document.getElementById('timer'); if(el) el.textContent = elapsed(); }
function startLessonClock(){
  if(!L) return;
  if(!L.activeSince) L.activeSince = Date.now();
  if(L.timerId) clearInterval(L.timerId);
  L.timerId = setInterval(updateTimer,1000);
}
function pauseLessonClock(){
  if(!L) return;
  if(L.activeSince){ L.elapsedBeforeMs = activeElapsedMs(); L.activeSince = 0; }
  if(L.timerId){ clearInterval(L.timerId); L.timerId = null; }
}
function saveLessonCheckpoint(){
  if(!L || !L.steps || L.steps[L.i]?.type === 'done') return;
  const savedAt=Date.now();
  state.session = {
    version:SESSION_VERSION, idx:L.idx, isReplay:!!L.isReplay, i:L.i,
    steps:L.steps, elapsedMs:activeElapsedMs(), chat:L.chat||[], warmupIds:L.warmupIds||[],
    runId:L.runId, savedAt,
  };
  touchState('sessionUpdatedAt');
  save();
}
function clearLessonCheckpoint(){
  rememberFinishedRun(state.session?.runId);
  state.session = null; touchState('sessionUpdatedAt'); save();
}
function resumeLesson(){
  const s = state.session;
  if(!validSavedSession(s)){
    rememberFinishedRun(s?.runId); state.session = null; touchState('sessionUpdatedAt'); save(); renderHome(); return;
  }
  if((!s.isReplay && s.idx !== state.completed) || (s.isReplay && s.idx >= state.completed)){
    rememberFinishedRun(s.runId); state.session = null; touchState('sessionUpdatedAt'); save(); renderHome(); return;
  }
  L = {
    idx:s.idx,lesson:LESSONS[s.idx],steps:s.steps,i:s.i,isReplay:!!s.isReplay,
    tries:0,attempts:0,rec:null,timerId:null,elapsedBeforeMs:Number(s.elapsedMs)||0,
    activeSince:Date.now(),chat:Array.isArray(s.chat)?s.chat:[],warmupIds:Array.isArray(s.warmupIds)?s.warmupIds:[],
    runId:typeof s.runId==='string'?s.runId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),
  };
  renderStep();
  startLessonClock();
}
function restartSavedLesson(){
  if(!state.session) return;
  const idx=state.session.idx, isReplay=!!state.session.isReplay;
  if(!confirm('להתחיל את השיעור הזה מחדש? המקום השמור יימחק.')) return;
  rememberFinishedRun(state.session.runId);
  state.session=null; touchState('sessionUpdatedAt'); save(); startLesson(idx,isReplay,true);
}
function exitLesson(){
  if(confirm('לצאת מהשיעור? המקום שלך יישמר ותוכל להמשיך מכאן כשתחזור.')){
    pauseLessonClock(); saveLessonCheckpoint(); stopLessonTimers(false); L=null; renderHome();
  }
}
function stopLessonTimers(keepCheckpoint=true){
  if(L && keepCheckpoint){ pauseLessonClock(); saveLessonCheckpoint(); }
  else if(L && L.timerId){ clearInterval(L.timerId); L.timerId=null; }
  cancelAutoSpeak();
  stopRecognition();
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function next(){
  if(!L) return;
  const current = L.steps[L.i];
  if(current?.type === 'listen' && current.line) L.chat.push({who:'app',line:current.line});
  if(current?.type === 'speak' && current.isDlg && current.p) L.chat.push({who:'you',line:current.p});
  stopRecognition();
  L.i++; L.tries = 0;
  saveLessonCheckpoint();

}

function renderStep(){
  const step = L.steps[L.i];

  if(step.type !== 'done') saveLessonCheckpoint();
  if(step.type === 'intro') return renderIntro();
  if(step.type === 'learn') return renderLearn(step);
  if(step.type === 'speak') return renderSpeak(step);

  if(step.type === 'order') return renderOrder(step);
  if(step.type === 'dlgIntro') return renderDlgIntro();
  if(step.type === 'listen') return renderListen(step);

}

function skipSpeak(){

function wordFeedbackHtml(details){
  return `<div class="word-feedback">${details.words.map((w,i)=>`<span class="${details.matched[i]?'':'missing'}">${esc(w)}</span>`).join('')}</div>`;
}
function showMicFallback(msg){
  const hint=document.getElementById('micHint');
  if(hint) hint.innerHTML=msg;
  const manual=document.getElementById('manualMicBtn');
  if(manual) manual.hidden=false;
}
/* one tap starts listening; a tap while listening ends the recording early,
   so background noise can't keep an attempt hanging open */
function micTap(target){
  if(L && L.rec){
    const hint=document.getElementById('micHint');
    if(hint) hint.textContent='רגע, בודק מה שמעתי...';
    try{ L.rec.stop(); }catch(e){ try{ L.rec.abort(); }catch(_){} }
    return;
  }
  startListening(target);
}
function startListening(target){
  const btn=document.getElementById('micBtn');
  const hint=document.getElementById('micHint');
  const heardEl=document.getElementById('heard');
  if(!SR){ showMicFallback('בדיקת הקול לא זמינה כאן. אמור את המשפט בקול והמשך ידנית.'); return; }
  stopRecognition();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  const rec=new SR();
  const session=L, stepIndex=L.i, epoch=uiEpoch;
  L.rec=rec;
  L.curStep.retryMessage='';
  L.curStep.heardText='';
  L.curStep.heardDetails=null;
  if(heardEl) heardEl.innerHTML='';
  const resultArea=document.getElementById('resultArea');
  if(resultArea) resultArea.innerHTML='';
  L.attempts=(L.attempts||0)+1;
  L.curStep.attempts=L.attempts;
  saveLessonCheckpoint();
  rec.lang='en-US';
  // iOS Safari streams partial transcripts while the learner is still talking
  // (even with interimResults=false), so a single result event must never end
  // the attempt: we accumulate the best transcript across every event and only
  // decide when recognition really ends — or the moment a clear pass arrives.
  rec.interimResults=true;
  rec.maxAlternatives=4;
  let got=false, done=false;
  let best='', bestDetails={score:0,words:[],matched:[],criticalMismatch:false};
  const active=()=>!!L&&L===session&&L.i===stepIndex&&L.rec===rec&&uiEpoch===epoch;
  // while listening the mic button shows ⏹ — micTap() ends the attempt early
  const restoreMicButton=()=>{
    btn.classList.remove('listening');
    btn.textContent='🎤';
    btn.setAttribute('aria-label','התחלת הקלטה');
  };
  btn.classList.add('listening');
  btn.textContent='⏹';
  btn.setAttribute('aria-label','סיום ההקלטה');
  hint.textContent='מקשיב... דבר, וכשסיימת לחץ ⏹';
  rec.onresult=(e)=>{
    if(done||!active()) return;
    for(let ri=0;ri<e.results.length;ri++){
      const result=e.results[ri];
      if(!result) continue;
      for(let ai=0;ai<result.length;ai++){
        const alt=result[ai];
        const transcript=alt&&typeof alt.transcript==='string'?alt.transcript.trim():'';
        if(!transcript) continue;
        got=true;
        const details=matchDetails(target,transcript);
        if(details.score>=bestDetails.score){ bestDetails=details; best=transcript; }
      }
    }
    if(!got) return;
    const step=L.curStep||{};
    step.heardText=best;
    step.heardDetails=bestDetails;
    if(heardEl) heardEl.innerHTML=`<div>זה מה שהטלפון קלט: “${esc(best)}”</div>${wordFeedbackHtml(bestDetails)}`;
    if(bestDetails.score>=.70&&!bestDetails.criticalMismatch){
      done=true;
      step.tries=(step.tries||0)+1;
      L.tries=step.tries;
      stopRecognition();
      recordStepResult(step,'pass');
      showResult('pass',pick(PRAISE));
    }
  };
  rec.onerror=(e)=>{
    if(done||!active()||got) return;
    restoreMicButton();
    const code=e?.error||'';
    if(code==='aborted') return;
    if(code==='not-allowed'||code==='service-not-allowed'||code==='audio-capture'||code==='language-not-supported'){
      micUnavailableThisSession=true;
      showMicFallback(code==='audio-capture'
        ? 'המיקרופון אינו זמין כרגע. אמור את המשפט בקול והמשך בלי בדיקה.'
        : code==='language-not-supported'
          ? 'בדיקת הקול באנגלית אינה זמינה במכשיר הזה. אמור את המשפט בקול והמשך בלי בדיקה.'
          : 'אין הרשאה למיקרופון. אמור את המשפט בקול והמשך בלי בדיקה.');
    }
    else if(code==='no-speech') showMicFallback('לא נקלט קול. אפשר לנסות שוב או להמשיך ידנית.');
    else if(code==='network') showMicFallback('בדיקת הקול אינה זמינה כרגע בגלל החיבור. אפשר להמשיך ידנית.');
    else showMicFallback('בדיקת הקול לא הצליחה. אמור את המשפט בקול והמשך ידנית.');
  };
  rec.onend=()=>{
    if(!active()) return;
    L.rec=null;
    restoreMicButton();
    if(done) return;
    if(!got){
      const t=hint.textContent;
      if(t.indexOf('מקשיב')>-1||t.indexOf('בודק')>-1) hint.textContent='לא שמעתי כלום — נסה שוב, קרוב לטלפון 🎤';
      return;
    }
    // the attempt ended without a clear pass — one full try, judged on the
    // best transcript heard during the whole attempt
    const step=L.curStep||{};
    step.tries=(step.tries||0)+1;
    L.tries=step.tries;
    saveLessonCheckpoint();
    if(bestDetails.score>=.70&&!bestDetails.criticalMismatch){
      recordStepResult(step,'pass');
      showResult('pass',pick(PRAISE));
    } else if(L.tries>=3){
      recordStepResult(step,'fail');
      if(step.warmup) showResult('pass','לא נורא — המשפט הזה יחזור בחימום הבא. ממשיכים! 💪');
      else if(step.requeued) showResult('pass','התאמנת על זה חזק היום — עם עוד תרגול זה יישב. ממשיכים! 💪');
      else showResult('requeue','הטלפון עדיין לא קלט את כל המשפט. נמשיך ונחזור אליו שוב בסוף');
    } else if(bestDetails.score>=.40) showResult('retry',pick(ALMOST));
    else showResult('retry','התמלול לא היה בטוח. נסה שוב לאט, או המשך ידנית — יש לך את זה');
  };
  try{rec.start();}
  catch(e){
    if(L&&L===session&&L.rec===rec) L.rec=null;
    restoreMicButton();
    showMicFallback('בדיקת הקול לא נפתחה. אמור את המשפט בקול והמשך ידנית.');
  }
}
function showResult(kind, msg){
  const step=L?.curStep;
  if(!step) return;
  if(kind==='retry') step.retryMessage=msg;
  else {
    step.resultKind=kind;
    step.resultMessage=msg;
    step.retryMessage='';
  }
  saveLessonCheckpoint();
  renderSpeak(step);
  if(kind === 'pass' && navigator.vibrate) navigator.vibrate(40);
}
function requeueAndNext(){
  const step = L.curStep;
  recordStepResult(step,'fail');
  if(step && !step.requeued && !step.warmup){
    const hid = step.hid || null;
    const doneIdx = L.steps.findIndex(s=>s.type === 'done');
    L.steps.splice(doneIdx, 0, {type:'speak', p:step.p, isDlg:step.isDlg, requeued:true, hid});
    saveLessonCheckpoint();
  }
  next();
}

/* ---- quiz ---- */
function renderQuiz(step){
  const p = step.p;
  playerShell(`
    <div class="step-label">🧩 זיהוי מהיר — אתה בטוח יודע את זה</div>
    <div class="phrase-card quiz-q">
      <div class="phrase-en" dir="ltr" lang="en">${esc(p.en)}</div>
      <button class="play-big" onclick="speak('${jsEsc(p.en)}')" aria-label="השמע">🔊</button>
    </div>
    <p class="sub">מה זה אומר?</p>
    <div id="quizOpts">
      ${step.options.map(o=>`<button class="quiz-opt" onclick="answerQuiz(this, ${o===p.he})">${esc(o)}</button>`).join('')}
    </div>
    <div id="quizResult"></div>
  `);
  scheduleSpeak(p.en);
}
function answerQuiz(btn, correct){
  const opts = document.querySelectorAll('.quiz-opt');
  if(correct){
    btn.classList.add('right');
    opts.forEach(o=>o.onclick=null);
    document.getElementById('quizResult').innerHTML =
      `<div class="result-msg good">${esc(pick(PRAISE))}</div><button class="btn" style="margin-top:12px" onclick="next()">ממשיכים ⬅</button>`;
    if(navigator.vibrate) navigator.vibrate(40);
  } else {
    btn.classList.add('wrong');
    btn.onclick = null;
    document.getElementById('quizResult').innerHTML =
      `<div class="result-msg almost">לא זה — אבל עכשיו זה יישאר לך בראש! נסה שוב 😉</div>`;
  }
}

/* ---- varied, predictable lesson challenges ---- */
function renderListenQuiz(step){
  playerShell(`
    <div class="step-label">🎧 אתגר שמיעה</div>
    <h2>מה שמעת?</h2>
    <p class="challenge-help">אפשר לשמוע שוב כמה פעמים שצריך</p>
    ${step.correctAnswered?`
      <div class="phrase-card">
        <div class="phrase-en" dir="ltr" lang="en">${wordSpans(step.p.en)}</div>
        <div class="phrase-tl">${esc(step.p.tl)}</div>
        <div class="phrase-he">${esc(step.p.he)}</div>
      </div>
      <div class="result-msg good">${esc(pick(PRAISE))}</div>
      <button class="btn" style="margin-top:12px" onclick="next()">ממשיכים ⬅</button>
    `:`
      <div class="recall-card">
        <button class="play-big" onclick="speak('${jsEsc(step.p.en)}')" aria-label="השמעת המשפט">🔊</button>
        <div class="audio-only">המשפט מוסתר — מקשיבים ובוחרים משמעות</div>
      </div>
      <div>
        ${step.options.map((o,i)=>`<button class="quiz-opt ${(step.wrongIndexes||[]).includes(i)?'wrong':''}" ${(step.wrongIndexes||[]).includes(i)?'disabled':''} onclick="answerListenQuiz(${i})">${esc(o)}</button>`).join('')}
      </div>
      <div id="quizResult" role="status" aria-live="polite">${step.feedback?`<div class="result-msg almost">${esc(step.feedback)}</div>`:''}</div>
    `}
  `);
  if(!step.correctAnswered) scheduleSpeak(step.p.en);
}
function answerListenQuiz(optionIndex){
  const step=L?.steps[L.i];
  if(!step||step.type!=='listenQuiz'||step.correctAnswered) return;
  if(step.options[optionIndex]===step.correct){
    step.correctAnswered=true;
    recordStepResult(step,'pass');
  } else {
    step.wrongIndexes=step.wrongIndexes||[];
    if(!step.wrongIndexes.includes(optionIndex)) step.wrongIndexes.push(optionIndex);
    if(!step.hadWrong){ step.hadWrong=true; step.usedHint=true; noteHint(step); }
    step.feedback='לא זה — שמע שוב ונסה אפשרות אחרת';
    saveLessonCheckpoint();
  }
  renderListenQuiz(step);
}
function renderOrder(step){
  playerShell(`
    <div class="step-label">🧩 אתגר סדר</div>
    <h2>בנה את המשפט</h2>
    <p class="challenge-help">${esc(step.p.he)} · לחץ על החלקים לפי הסדר</p>
    ${step.showHint?`<div class="milestone" style="margin-bottom:12px"><span dir="ltr" lang="en">${esc(step.p.en)}</span></div>`:''}
    <div class="order-built ${step.selected.length?'':'empty'}">
      ${step.selected.map(id=>`<span class="word-chip built-chip">${esc(step.chunks[id])}</span>`).join('')}
    </div>
    <div class="word-bank">
      ${step.bankOrder.map(id=>`<button class="word-chip" ${step.selected.includes(id)?'disabled':''} onclick="selectOrderChunk(${id})">${esc(step.chunks[id])}</button>`).join('')}
    </div>
    ${step.correct?`
      <div class="result-msg good">בדיוק! בנית את המשפט נכון 👏</div>
      <div class="phrase-tl" style="text-align:center;margin:8px 0">${esc(step.p.tl)}</div>
      <button class="btn" style="margin-top:12px" onclick="next()">ממשיכים ⬅</button>
    `:step.wrong?`
      <div class="result-msg almost">החלקים נכונים — רק הסדר עוד לא. נסה שוב בנחת.</div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn secondary" onclick="resetOrder()">נסה שוב</button>
        <button class="btn ghost" onclick="revealOrderHint()">הצג רמז</button>
      </div>
    `:`
      <div class="btn-row">
        <button class="btn ghost" ${step.selected.length?'':'disabled'} onclick="undoOrder()">בטל חלק אחרון</button>
        <button class="btn ghost" onclick="revealOrderHint()">צריך רמז?</button>
      </div>
    `}
  `);
}
function selectOrderChunk(id){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order'||step.correct||step.selected.includes(id)) return;
  step.selected.push(id);
  if(step.selected.length===step.chunks.length){
    step.correct=step.selected.every((v,i)=>v===i);
    step.wrong=!step.correct;
    if(step.correct) recordStepResult(step,'pass');
    else if(!step.hadWrong){ step.hadWrong=true; step.usedHint=true; noteHint(step); }
  }
  saveLessonCheckpoint();
  renderOrder(step);
}
function undoOrder(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order'||step.correct) return;
  step.selected.pop(); step.wrong=false; saveLessonCheckpoint(); renderOrder(step);
}
function resetOrder(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order') return;
  step.selected=[]; step.wrong=false; saveLessonCheckpoint(); renderOrder(step);
}
function revealOrderHint(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order') return;
  if(!step.showHint){ step.showHint=true; step.usedHint=true; noteHint(step); }
  saveLessonCheckpoint(); renderOrder(step);
}

/* ---- dialogue ---- */
function renderDlgIntro(){
  const unitChallenge=!!L.steps[L.i].unitChallenge;
  const scene=SCENES[L.idx];
  playerShell(`
    <div class="step-label">${unitChallenge?'🏆 אתגר שיחה לסיום היחידה':'💬 תרגול שיחה'}</div>
    <h2>${unitChallenge?'בוחר תשובה ומדבר':'עכשיו — שיחה!'}</h2>
    ${scene?`<p class="scene">${esc(scene)}</p>`:''}
    <p class="sub">אני אגיד את השורות שלי 🤖, ואתה תגיד את שלך 🗣️.<br>${unitChallenge?'אתה תבחר בעברית מה אתה רוצה לענות, ואז תגיד את זה באנגלית.':'בסוף השיחה תבחר בעצמך מה לענות 😎 ותמיד אפשר לפתוח רמז.'}</p>
    <button class="btn" onclick="next()">מתחילים את השיחה 💬</button>
  `);
}
function renderListen(step){
  const line = step.line;
  const nextType=L.steps[L.i+1]?.type;
  const shownEn=fillName(line.en);
  const spokenEn=fillNameSpoken(line.en);
  playerShell(`
    ${chatThreadHtml()}
    <div class="step-label">💬 בשיחה — אני מדבר</div>
    <div class="dlg-line" id="voiceNote">
      <div class="dlg-avatar">🤖</div>
      <div class="dlg-bubble voice-note">🎙️ מקליט הודעה קולית<span class="vdots"><i></i><i></i><i></i></span></div>
    </div>
    <div id="botLine" hidden>
      <div class="dlg-line">
        <div class="dlg-avatar">🤖</div>
        <div class="dlg-bubble">
          <div class="dlg-en" dir="ltr" lang="en">${esc(shownEn)}</div>
          <div class="dlg-tl">${esc(line.tl)}</div>
          <div class="dlg-he">${esc(line.he)}</div>
        </div>
      </div>
      <div style="text-align:center;margin:10px 0 18px">
        <button class="play-big" onclick="speak('${jsEsc(spokenEn)}')" aria-label="השמע שוב">🔊</button>
      </div>
      <button class="btn" onclick="next()">${nextType==='branchChoice'?'לבחירת התשובה שלי ⬅':nextType==='done'?'סיימנו את השיחה ⬅':nextType==='listen'?'ממשיכים בשיחה ⬅':'הבנתי — תורי לענות ⬅'}</button>
    </div>
  `);
  // the voice-note indicator plays for a moment, then the message "arrives"
  const epoch=uiEpoch;
  setTimeout(()=>{
    if(uiEpoch!==epoch) return;
    const vn=document.getElementById('voiceNote');
    const bl=document.getElementById('botLine');
    if(vn) vn.hidden=true;
    if(bl) bl.hidden=false;
    speak(spokenEn);
  }, 900);
}
function renderBranchChoice(step){
  playerShell(`
    ${chatThreadHtml()}
    <div class="step-label">💬 מה אתה רוצה לענות?</div>
    <h2>בחר את הכוונה בעברית</h2>
    <p class="sub">אחרי הבחירה תגיד את התשובה באנגלית מהזיכרון.</p>
    <div class="branch-options">
      ${step.options.map((o,i)=>`<button class="quiz-opt" onclick="chooseBranch(${i})">${esc(o.label)}</button>`).join('')}
    </div>
  `);
}
function chooseBranch(optionIndex){
  const step=L?.steps[L.i];
  if(!step||step.type!=='branchChoice'||!step.options[optionIndex]) return;
  const option=step.options[optionIndex];
  step.selectedIndex=optionIndex;
  const hid=phraseIdForText(option.answer.en,L.idx);
  L.steps.splice(L.i+1,2,
    {type:'speak',p:option.answer,isDlg:true,challenge:true,hid,branch:true},
    {type:'listen',line:option.reply,isBranchReply:true}
  );
  L.i++;
  saveLessonCheckpoint();
  renderStep();
}

/* ---- done ---- */
function renderDone(){
  const durationMs=activeElapsedMs();
  pauseLessonClock();
  stopLessonTimers(false);
  const wasReplay = L.isReplay;
  let streakNote = '', milestones = [];
  if(!wasReplay){
    state.completed = Math.max(state.completed, L.idx + 1);
    const today = todayStr();
    if(state.lastDoneDate === today){
      // a bonus lesson: the day's counter grows, the streak already counted
      state.lessonsToday = lessonsDoneToday() + 1;
    }
    if(state.lastDoneDate !== today){
      const prevStreak = state.streak;
      if(state.lastDoneDate === dateNDaysAgo(1)){
        state.streak++;
      } else if(state.lastDoneDate === dateNDaysAgo(2) && Date.now() - (state.lastGraceTs || 0) > 6*864e5){
        // one missed day forgiven, once a week — the streak survives
        state.streak++;
        state.lastGraceTs = Date.now();
        streakNote = 'פספסת יום אחד — אבל הרצף שלך ניצל 🛟 (קורה לכולם)';
      } else {
        if(state.lastDoneDate) streakNote = 'חזרת — וזה מה שחשוב! רצף חדש מתחיל היום 💪';
        state.streak = 1;
      }
      state.lastDoneDate = today;
      state.lessonsToday = 1;
      const STREAK_MSGS = {3:'שלושה ימים — זה כבר מתחיל להיות הרגל!', 7:'שבוע שלם ברצף! רצינות אמיתית', 14:'שבועיים ברצף — אתה מכונה!', 30:'חודש שלם. וואו. פשוט וואו'};
      if(state.streak !== prevStreak && STREAK_MSGS[state.streak])
        milestones.push('🔥 ' + state.streak + ' ימים ברצף — ' + STREAK_MSGS[state.streak]);
    }
    if((L.idx + 1) % LESSONS_PER_UNIT === 0){
      const u = UNITS[Math.floor(L.idx / LESSONS_PER_UNIT)];
      milestones.push('🏆 סיימת את כל יחידת "' + u.title + '"! אתה כבר יודע ' + (state.completed*5) + ' משפטים באנגלית');
    }
  } else {
    state.replays=(state.replays||0)+1;
  }
  touchState('progressUpdatedAt');
  rememberFinishedRun(L.runId);
  state.session=null;
  touchState('sessionUpdatedAt');
  save();
  confetti();
  if(milestones.length) setTimeout(confetti, 900);
  const mins = Math.max(1, Math.round(durationMs/60000));
  const nm = state.name ? ' ' + state.name : '';
  playerShell(`
    <div class="finish">
      <div class="emoji">${wasReplay ? '🔁' : milestones.length ? '🏆' : '🏅'}</div>
      <h2>${wasReplay ? 'סיימת את החזרה!' : 'כל הכבוד' + esc(nm) + '!'}</h2>
      <p>${wasReplay
          ? 'חזרת על שיעור — וזה בדיוק מה שהופך ידע לזיכרון לתמיד.'
          : `סיימת את שיעור ${L.idx+1} ${mins===1?'בדקה אחת':'ב־'+mins+' דקות'} · למדת 5 משפטים חדשים 🗣️`}
      </p>
      ${!wasReplay ? `<div class="chip" style="display:inline-flex;margin-top:4px">🔥 ${state.streak} ימים ברצף</div>` : ''}
      ${streakNote ? `<div class="streak-note">${esc(streakNote)}</div>` : ''}
      ${milestones.map(m=>`<div class="milestone">${esc(m)}</div>`).join('')}
      <div class="quote">💬 ${esc(pick(FINISH_QUOTES))}</div>
      <button class="btn" onclick="renderHome()">${wasReplay ? 'חזרה הביתה'
        : (lessonsDoneToday() < MAX_LESSONS_PER_DAY && state.completed < LESSONS.length) ? 'חזרה הביתה 🏠 (מחכה לך בונוס 🎁)'
        : 'סיימנו להיום — נתראה מחר! 👋'}</button>
    </div>
  `);
  L = null;
}

/* ================= boot ================= */
// iOS Safari blocks speech synthesis until it runs inside a user gesture —
// unlock it on the first tap so auto-play of phrases works afterwards.
let speechUnlocked = false;
document.addEventListener('pointerdown', ()=>{
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  speechSynthesis.speak(u);
}, true);
document.addEventListener('visibilitychange',()=>{
  if(!L) return;
  if(document.hidden){ pauseLessonClock(); saveLessonCheckpoint(); }
  else startLessonClock();
});
window.addEventListener('pagehide',()=>{
  if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
  cancelAutoSpeak(); stopRecognition();
  if('speechSynthesis' in window) speechSynthesis.cancel();
});

let pendingServiceWorker=null;
let reloadingForUpdate=false;
let updateReloadTimer=null;
function showUpdateBanner(worker){
  if(!worker||document.getElementById('updateBanner')) return;
  pendingServiceWorker=worker;
  const banner=document.createElement('div');
  banner.id='updateBanner'; banner.className='update-banner';
  banner.innerHTML=`<div class="txt"><b>גרסה חדשה מוכנה</b><span>העדכון ישמור את ההתקדמות שלך.</span></div><button class="btn" onclick="applyAppUpdate()">עדכון עכשיו</button>`;
  document.body.appendChild(banner);
}
function applyAppUpdate(){
  if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
  if(!pendingServiceWorker){ location.reload(); return; }
  if(pendingServiceWorker.state==='activated'||pendingServiceWorker.state==='redundant'){
    location.reload(); return;
  }
  reloadingForUpdate=true;
  pendingServiceWorker.postMessage({type:'SKIP_WAITING'});
  clearTimeout(updateReloadTimer);
  updateReloadTimer=setTimeout(()=>location.reload(),3000);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadingForUpdate||document.getElementById('updateBanner')){
      if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
      clearTimeout(updateReloadTimer);
      location.reload();
    }
  });
  window.addEventListener('load',()=>{
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>{
      if(hadController&&reg.waiting) showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller) showUpdateBanner(worker);
        });
      });
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
}
if(state.onboarded) renderHome(); else renderOnboarding();
</script>
