function setStageCue(cue){
  const el=document.getElementById('stageStatus');
  if(!el||!L) return;
  el.className='stage-status cue-'+cue;
  el.innerHTML=stageCueHtml(cue, conversationMeta(L.idx).character);
}
/* Every beat of the conversation used to rebuild this whole screen: the
   figure snapped mid-breath, the blink restarted, and the scene faded in
   from scratch each time the caption changed — the person looked replaced,
   not like someone standing there talking to you. When the same scene is
   already on stage, morph it in place: only the words and the pose move. */
function stagePlaceHtml(meta, history){
  return `${meta.placeEmoji} ${esc(meta.place)}${history?` · <button class="stage-history" onclick="openChatHistory()">📜 מה נאמר עד עכשיו</button>`:''}`;
}
function swapStageBlock(el, html){
  if(!el) return;
  const changed=el.__stageHtml!==html;
  // the markup is always rebuilt from state, exactly as a full render would
  el.__stageHtml=html;
  el.innerHTML=html;
  // but pause/resume redraws the same words — don't make them jump again
  if(!changed) return;
  el.classList.remove('stage-swap');
  void el.offsetWidth;
  el.classList.add('stage-swap');
}
function updateStageInPlace(sceneKey, state_, cue, caption, composer, pct, meta, history){
  const screen=document.querySelector('#app > .conversation-screen.stage-screen');
  if(!screen||screen.dataset.scene!==sceneKey) return false;
  // the side effects a full render would have had
  uiEpoch++;
  cancelAutoSpeak();
  stopRecognition();
  const bar=screen.querySelector('.pbar');
  if(bar){ bar.setAttribute('aria-valuenow',String(pct)); const fill=bar.querySelector('i'); if(fill) fill.style.width=pct+'%'; }
  const timer=screen.querySelector('#timer');
  if(timer) timer.textContent=elapsed();
  const avatar=screen.querySelector('.stage-avatar');
  const modern=meta.character?.look?.variant==='modern-v2';
  const bd=PRACTICE_BACKDROPS[meta.bg]||PRACTICE_BACKDROPS['living-room'];
  if(avatar) avatar.className='stage-avatar '+state_+' char-'+(meta.characterId||'unknown')+(modern?' modern-cast':'')+' light-'+(bd.lightSide||'left');
  const art=screen.querySelector('.person-art');
  if(art){
    // never silence a mouth mid-word: the live voice classes survive the morph
    const keep=['voicing','mouth-js'].filter(c=>art.classList.contains(c));
    // variant classes are part of the illustration, not of the current beat
    const transient=new Set(['idle','waiting','speaking','listening','reacting','thinking','voicing','mouth-js']);
    const persistent=[...art.classList].filter(c=>c!=='person-art'&&!transient.has(c));
    art.setAttribute('class',['person-art',...persistent,state_,...keep].join(' '));
  }
  const place=screen.querySelector('.stage-place');
  if(place) place.innerHTML=stagePlaceHtml(meta,history);
  const status=screen.querySelector('#stageStatus');
  if(status){ status.className='stage-status cue-'+cue; status.innerHTML=stageCueHtml(cue,meta.character); }
  swapStageBlock(screen.querySelector('#stageCaption'),caption);
  swapStageBlock(screen.querySelector('.conversation-composer'),composer);
  return true;
}
function stageShell(state_, caption, composer, cue){
  const pct=Math.round(L.i/(L.steps.length-1)*100);
  const meta=conversationMeta(L.idx);
  const history=(L.chat||[]).length;
  const modern=meta.character?.look?.variant==='modern-v2';
  const sceneKey=(meta.characterId||'')+'|'+(meta.bg||'');
  if(updateStageInPlace(sceneKey, state_, cue||state_, caption, composer, pct, meta, history)) return;
  const bd=PRACTICE_BACKDROPS[meta.bg]||PRACTICE_BACKDROPS['living-room'];
  h(`<div class="conversation-screen stage-screen" data-scene="${esc(sceneKey)}">
    <div class="stage-bg scene-motion-${esc(bd.motionProfile||'dust')}" data-backdrop="${esc(bd.id)}" data-light="${esc(bd.lightSide||'left')}" aria-hidden="true" style="--sky:${bd.sky};--ground:${bd.ground};--scene-light:${bd.lightColor||'#ffffff'}">
      <svg class="backdrop-art backdrop-${esc(bd.id)}" data-art="${esc(bd.id)}" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice">${bd.art}</svg>
    </div>
    <div class="conversation-top">
      <button class="xbtn" onclick="exitLesson()" aria-label="יציאה מהתרגול">✕</button>
      <div class="pbar" role="progressbar" aria-label="התקדמות בשיחה" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      <div class="timer" id="timer" aria-label="זמן תרגול">${elapsed()}</div>
    </div>
    <div class="stage" style="--who:${meta.character.color}">
      <div class="stage-place">${stagePlaceHtml(meta,history)}</div>
      <div class="stage-avatar ${state_} char-${esc(meta.characterId||'unknown')}${modern?' modern-cast':''} light-${esc(bd.lightSide||'left')}">
        <span class="ring r1"></span><span class="ring r2"></span>
        ${meta.character.look
          ? personArt(meta.character.look, state_)
          : `<span class="face" aria-hidden="true">${meta.character.avatar}</span>`}
      </div>
      <div class="stage-name">${esc(meta.character.name)}${meta.role?` <span>· ${esc(meta.role)}</span>`:''}</div>
      <div class="stage-status cue-${cue||state_}" id="stageStatus">${stageCueHtml(cue||state_, meta.character)}</div>
      <div class="stage-caption" id="stageCaption">${caption}</div>
    </div>
    <div class="conversation-composer">${composer}</div>
  </div>`);
}
function captionHtml(line, step, opts={}){
  const en=ptext(line,'en'), he=ptext(line,'he'), tl=ptext(line,'tl');
  return `
    <div class="cap-en" dir="ltr" lang="en">${esc(en)}</div>
    <div class="cap-aid" id="capHe" ${step?.showHe?'':'hidden'}>${esc(he)}</div>
    <div class="cap-aid tl" id="capTl" ${step?.showTl?'':'hidden'}>${esc(tl)}</div>
    <div class="cap-actions">
      ${opts.replay!==false?`<button class="bubble-action" onclick="replayStageLine()" aria-label="השמע שוב">🔊</button>`:''}
      <button class="bubble-action" aria-pressed="${!!step?.showHe}" onclick="toggleCaptionAid('he',this)">תרגום</button>
      <button class="bubble-action" aria-pressed="${!!step?.showTl}" onclick="toggleCaptionAid('tl',this)">איך אומרים?</button>
    </div>`;
}
function toggleCaptionAid(kind, button){
  const step=L?.steps?.[L.i];
  if(!step) return;
  const field=kind==='tl'?'showTl':'showHe';
  step[field]=!step[field];
  const panel=document.getElementById(kind==='tl'?'capTl':'capHe');
  if(panel) panel.hidden=!step[field];
  if(button) button.setAttribute('aria-pressed',String(!!step[field]));
  // reading takes time — give the conversation a longer beat, on its own
  delayDialogueFlow(4000);
}
function stageCaptionLine(){
  const step=L?.steps?.[L.i];
  if(!step) return null;
  if(step.type==='listen') return step.line;
  // while choosing an answer the caption still shows the last thing the
  // character said — that is the line the replay button must repeat
  if(step.type==='branchChoice') return [...(L.chat||[])].reverse().find(x=>x.who==='app')?.line || null;
  return step.p || null;
}
function replayStageLine(){
  const line=stageCaptionLine();
  if(!line) return;
  replayHoldingFlow(ptext(line,'en',true));
}
function openChatHistory(){
  if(!L) return;
  // hold the flow while the history sheet is open; closing it resumes alone
  const session=L,stepIndex=L.i;
  const pending=dialogueTimer?dialogueFlowNext:null;
  if(pending) invalidateDialogueFlow(false);
  const closeAnd=()=>{ if(pending&&L===session&&L.i===stepIndex) scheduleDialogueFlow(pending,900); };
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
    <h3>📜 מה נאמר עד עכשיו</h3>
    <div style="max-height:60vh;overflow:auto">${chatMessagesHtml()}</div>
    <button class="btn secondary" style="margin-top:14px">סגור</button>
  </div>`;
  ov.querySelector('.btn').onclick=()=>{ ov.remove(); closeAnd(); };
  ov.onclick=()=>{ ov.remove(); closeAnd(); };
  document.body.appendChild(ov);
}
function dialogueShell(messages,composer){
  const pct=Math.round(L.i/(L.steps.length-1)*100);
  const meta=conversationMeta(L.idx);
  h(`<div class="conversation-screen">
    <div class="conversation-top">
      <button class="xbtn" onclick="exitLesson()" aria-label="יציאה מהשיעור">✕</button>
      <div class="pbar" role="progressbar" aria-label="התקדמות בשיעור" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      <div class="timer" id="timer" aria-label="זמן תרגול">${elapsed()}</div>
    </div>
    <div class="conversation-person">
      <div class="portrait" style="border-color:${meta.character.color}88" aria-hidden="true">${meta.character.avatar}</div>
      <div class="person-copy"><div class="person-name">${esc(meta.character.name)}${meta.role?` <span class="person-role">· ${esc(meta.role)}</span>`:''}</div><div class="person-scene">${meta.placeEmoji} ${esc(meta.place)}</div></div>
      <div class="mission">🎯 ${esc(meta.mission)}</div>
    </div>
    <div class="conversation-log" id="conversationLog" role="log" aria-live="polite">${messages}</div>
    <div class="conversation-composer">${composer}</div>
  </div>`);
  requestAnimationFrame(scrollConversationToEnd);
}
function scrollConversationToEnd(){
  const log=document.getElementById('conversationLog');
  if(log) log.scrollTop=log.scrollHeight;
}
function scrollComposerToEnd(){
  const composer=document.querySelector('.conversation-composer');
  if(composer) composer.scrollTop=composer.scrollHeight;
}
function scrollChatItemIntoView(source,index){
  const item=document.getElementById(`chat-bubble-${source}-${index}`);
  if(item?.scrollIntoView) item.scrollIntoView({block:'nearest',behavior:'smooth'});
  else scrollConversationToEnd();
}
function toggleBubbleAid(source,index,kind,button){
  const target=source==='history'?L?.chat?.[index]:L?.steps?.[L.i];
  if(!target) return;
  const field=kind==='tl'?'showTl':'showHe';
  target[field]=!target[field];
  const panel=document.getElementById(`bubble-${kind}-${source}-${index}`);
  if(panel) panel.hidden=!target[field];
  if(button) button.setAttribute('aria-pressed',String(!!target[field]));
  if(L?.steps?.[L.i]?.type==='listen'||source==='current') delayDialogueFlow(4000);
  saveLessonCheckpoint();
  requestAnimationFrame(()=>source==='history'?scrollChatItemIntoView(source,index):scrollConversationToEnd());
}
function toggleChatHistory(){
  if(!L) return;
  L.chatExpanded=!L.chatExpanded;
  const older=document.getElementById('olderMessages');
  const btn=document.getElementById('historyToggle');
  if(older) older.hidden=!L.chatExpanded;
  if(btn) btn.textContent=L.chatExpanded?'הסתר הודעות קודמות':'הצג הודעות קודמות';
  if(L.chatExpanded) delayDialogueFlow(6000);
  saveLessonCheckpoint();
  requestAnimationFrame(()=>{
    if(L.chatExpanded&&btn?.scrollIntoView) btn.scrollIntoView({block:'start',behavior:'smooth'});
    else scrollConversationToEnd();
  });
}
function replayChatMessage(source,index){
  const item=chatItem(source,index);
  if(!item) return;
  // Always use the speech-safe form. A Hebrew learner name remains visible
  // in the bubble, but is omitted from the English TTS voice.
  replayHoldingFlow(ptext(item.line,'en',true));
}
function noteHint(step){
  if(!step || !step.hid) return;
  const at=Date.now();
  const meta=reviewMetaFor(step.hid);
  meta.hints=(meta.hints||0)+1;
  meta.updatedAt=Math.max(Number(meta.updatedAt)||0,at);
  addHard(step.hid,false,at);
  touchState('reviewUpdatedAt');
  save();
}
function revealSpeakHint(){
  const step=L?.curStep;
  if(!step||step.resultKind) return;
  step.hintLevel=Math.min(2,(step.hintLevel||0)+1);
  step.usedHint=true;
  noteHint(step);
  const en=document.getElementById('englishHint');
  const tl=document.getElementById('translitHint');
  const audio=document.getElementById('hintAudio');
  const btn=document.getElementById('hintBtn');
  if(step.hintLevel>=1 && en) en.hidden=false;
  if(step.hintLevel>=2){
    if(tl) tl.hidden=false;
    if(audio) audio.hidden=false;
    if(btn) btn.hidden=true;
  } else if(btn) btn.textContent=step.isDlg?'🗣️':'עוד עזרה — תעתיק ושמיעה 🔊';
  saveLessonCheckpoint();
  if(step.isDlg) requestAnimationFrame(scrollComposerToEnd);
}
function recordStepResult(step,result){
  if(!step || step.practiceRecorded) return;
  step.practiceRecorded=true;
  notePractice(step.hid,result,!!step.usedHint,!!step.warmup);
  saveLessonCheckpoint();
}
function speakResultHtml(kind,msg){
  const cls = kind === 'pass' ? 'good' : 'almost';
  let button = '';
  if(kind === 'pass') button = `<button class="btn" style="margin-top:12px" onclick="next()">ממשיכים ⬅</button>`;
  if(kind === 'requeue') button = `<button class="btn" style="margin-top:12px" onclick="requeueAndNext()">ממשיכים — נחזור לזה בסוף ⬅</button>`;
  return `<div class="result-msg ${cls}">${esc(msg||'')}</div>${button}`;
}
function renderDialogueSpeak(step){
  const p=step.p,en=ptext(p,'en'),spokenEn=ptext(p,'en',true),he=ptext(p,'he'),tl=ptext(p,'tl');
  L.curStep=step;L.attempts=step.attempts||0;L.tries=step.tries||0;
  const mic=micAvailable(),hintLevel=step.hintLevel||0;
  const terminal=step.resultKind==='pass'||step.resultKind==='requeue';
  const heardHtml=step.heardText
    ? `<div><span dir="rtl">זה מה שהטלפון קלט:</span> <bdi dir="ltr">“${esc(step.heardText)}”</bdi></div>${step.heardDetails?.words?wordFeedbackHtml(step.heardDetails):''}`:'';
  const current=terminal?{who:'you',line:p,showHe:!!step.showHe,showTl:!!step.showTl}:null;
  const composer=terminal?`
    <div class="composer-head"><span class="composer-label">✔️ ההודעה נשלחה</span><span style="font-size:12px;color:var(--dim)">${conversationMeta(L.idx).character.name} עונה מיד</span></div>
    ${heardHtml?`<div class="heard">${heardHtml}</div>`:''}
    <div id="resultArea" role="status" aria-live="polite"><div class="result-msg good">${esc(step.resultMessage||'מעולה!')}</div></div>
    <button class="btn ghost" style="padding:7px;margin-top:2px" onclick="next()">המשך עכשיו</button>
  `:`
    <div class="composer-head"><span class="composer-label">💬 עכשיו התור שלך</span><span style="font-size:12px;color:var(--dim)">תגיד באנגלית</span></div>
    ${L.isPractice?'':`<div class="composer-intent">${esc(he)}</div>`}
    <div id="englishHint" ${hintLevel<1?'hidden':''}><div class="hint-en" dir="ltr" lang="en" style="font-size:20px;text-align:center">${esc(en)}</div></div>
    <div id="translitHint" ${hintLevel<2?'hidden':''}><div class="hint-tl" style="text-align:center;font-size:16px">${esc(tl)}</div></div>
    <div class="composer-actions">
      <button class="bubble-action" id="hintBtn" ${hintLevel>=2?'hidden':''} onclick="revealSpeakHint()" aria-label="רמז">${hintLevel===0?'💡':'🗣️'}</button>
      ${mic?`<button class="conversation-mic" id="micBtn" onclick="micTap('${jsEsc(spokenEn)}')" aria-label="התחלת הקלטה">🎤</button>`:
        `<button class="btn" style="width:auto;padding:12px 18px" onclick="manualMicDone()">אמרתי בקול ✔</button>`}
      <button class="bubble-action" id="hintAudio" ${hintLevel<2?'hidden':''} onclick="speak('${jsEsc(spokenEn)}')" aria-label="השמעת המשפט">🔊</button>
    </div>
    <div class="mic-hint composer-note" id="micHint">${mic?'לחץ על המיקרופון, דבר ולחץ שוב לסיום':'אמור את המשפט בקול והמשך'}</div>
    <div class="heard" id="heard">${heardHtml}</div>
    <div id="resultArea" role="status" aria-live="polite">${step.retryMessage?speakResultHtml('retry',step.retryMessage):''}</div>
    ${mic?`<button class="btn ghost mic-fallback" id="manualMicBtn" ${(step.attempts||0)>=3?'':'hidden'} onclick="manualMicDone()">אמרתי בקול — המשך</button>`:''}
    <button class="btn ghost" id="skipBtn" style="padding:7px" ${(step.attempts||0)>=3?'':'hidden'} onclick="skipDialogueSpeak()">קשה לי עכשיו — נמשיך בשיחה</button>
  `;
  if(L.isPractice){
    const caption=terminal
      ? `<div class="cap-sent">✔️ אמרת: <bdi dir="ltr">${esc(en)}</bdi></div>`
      : `<div class="cap-intent">${esc(he)}</div><div class="cap-intent-note">תגיד את זה באנגלית ל${esc(conversationMeta(L.idx).character.name)}</div>`;
    stageShell(terminal?'reacting':'listening', caption, composer, terminal?'heard':'listening');
  } else {
    dialogueShell(chatMessagesHtml(current,terminal?'sent-preview':''),composer);
  }
  if(terminal||step.retryMessage) requestAnimationFrame(scrollComposerToEnd);
  if(terminal){
    // The same 1.9s as before, but read as a person rather than as a wait:
    // heard you -> a beat where they take it in -> they answer.
    if(L.isPractice){
      scheduleDialogueFlow(()=>{
        setStageCue('thinking');
        setStageThinking(true);
        scheduleDialogueFlow(()=>next(),1080);
      },820);
    } else {
      scheduleDialogueFlow(()=>next(),1900);
    }
  }
}
function skipDialogueSpeak(){
  const step=L?.curStep;if(!step) return;
  recordStepResult(step,'fail');
  step.resultKind='pass';step.resultMessage='ממשיכים — המשפט יחזור אליך לתרגול 💪';step.retryMessage='';
  saveLessonCheckpoint();renderDialogueSpeak(step);
}
function renderSpeak(step){
  if(step.isDlg) return renderDialogueSpeak(step);
  const p=step.p;
  const en=ptext(p,'en'), he=ptext(p,'he'), tl=ptext(p,'tl');

  const label=step.warmup ? '🔥 חימום — משפט שכבר למדת'
    : step.requeued ? '🔁 סיבוב שני — עוד תרגול קטן'
    : step.challenge ? '🧠 אתגר — תגיד מהזיכרון' : '🎤 עכשיו אתה';

  const hintLevel=step.hintLevel||0;
  const terminalResult=step.resultKind==='pass'||step.resultKind==='requeue';
  const heardHtml=step.heardText
    ? `<div>זה מה שהטלפון קלט: “${esc(step.heardText)}”</div>${step.heardDetails?.words?wordFeedbackHtml(step.heardDetails):''}`
    : '';
  playerShell(`
    <div class="step-label">${label}</div>
    <div class="recall-card">
      <div class="cue">${esc(he)}</div>
      <div class="cue-note">נסה להגיד את המשפט באנגלית בלי להסתכל</div>
      <div class="hint-box" id="englishHint" ${hintLevel<1?'hidden':''}>
        <div class="hint-en" dir="ltr" lang="en">${esc(en)}</div>
      </div>
      <div class="hint-box" id="translitHint" ${hintLevel<2?'hidden':''}>
        <div class="hint-tl">${esc(tl)}</div>
      </div>
      <button class="play-big" id="hintAudio" ${hintLevel<2?'hidden':''} onclick="speak('${jsEsc(en)}')" aria-label="השמעת המשפט">🔊</button>
    </div>
    <button class="btn secondary" id="hintBtn" ${terminalResult||hintLevel>=2?'hidden':''} onclick="revealSpeakHint()">${hintLevel===0?'צריך רמז? הצג באנגלית':'עוד עזרה — תעתיק ושמיעה 🔊'}</button>
    <div class="speak-zone" id="speakZone">
      ${terminalResult?`
        <div class="heard">${heardHtml}</div>
        <div id="resultArea" role="status" aria-live="polite">${speakResultHtml(step.resultKind,step.resultMessage)}</div>
      `:mic?`
        <button class="mic-btn" id="micBtn" onclick="micTap('${jsEsc(en)}')" aria-label="התחלת הקלטה">🎤</button>
        <div class="mic-hint" id="micHint">לחץ על המיקרופון ותגיד את המשפט באנגלית</div>
        <div class="heard" id="heard">${heardHtml}</div>
        <div id="resultArea" role="status" aria-live="polite">${step.retryMessage?speakResultHtml('retry',step.retryMessage):''}</div>
        <button class="btn ghost mic-fallback" id="manualMicBtn" ${(step.attempts||0)>=3?'':'hidden'} onclick="manualMicDone()">אמרתי בקול — המשך בלי בדיקה</button>
        ${!step.requeued&&!step.warmup?`<button class="btn ghost" id="skipBtn" ${(step.attempts||0)>=3?'':'hidden'} onclick="skipSpeak()">קשה לי עכשיו — נחזור לזה בסוף 🔁</button>`:''}
      `:`
        <p class="mic-hint" style="margin:14px 0">תגיד את המשפט <b>בקול רם</b>. אם צריך, השתמש ברמז.</p>
        <button class="btn" onclick="manualMicDone()">אמרתי בקול! ✔</button>
        ${!step.requeued&&!step.warmup?`<button class="btn ghost" onclick="skipSpeak()">קשה לי עכשיו — נחזור לזה בסוף 🔁</button>`:''}
      `}
    </div>
  `);
}
function manualMicDone(){
  const step=L?.curStep;
  stopRecognition();
  if(step&&!step.practiceRecorded){
    step.practiceRecorded=true;
    notePractice(step.hid,'manual',!!step.usedHint,!!step.warmup);
  }
  showResult('pass','יפה — העיקר שאמרת את המשפט בקול! 💪');
}
function skipSpeak(){
  const step=L.curStep;
  recordStepResult(step,'fail');
  if(step&&(step.warmup||step.requeued)){ next(); return; }
  toast('נחזור למשפט הזה בסוף השיעור 🔁');
  requeueAndNext();
}
function wordFeedbackHtml(details){
  return `<div class="word-feedback">${details.words.map((w,i)=>`<span class="${details.matched[i]?'':'missing'}">${esc(w)}</span>`).join('')}</div>`;
}
/* the escape buttons stay hidden until the third attempt ends, so the easy
   way out never appears before a real effort was made. A genuinely broken
   mic (force=true) reveals the manual path immediately. */
function revealEscapes(force=false){
  if(!force && (L?.attempts||0) < 3) return;
  const manual=document.getElementById('manualMicBtn');
  if(manual) manual.hidden=false;
  if(!force){
    const skip=document.getElementById('skipBtn');
    if(skip) skip.hidden=false;
  }
}
function showMicFallback(msg, forceManual=false){
  const hint=document.getElementById('micHint');
  if(hint) hint.innerHTML=msg;
  revealEscapes(forceManual);
  requestAnimationFrame(scrollComposerToEnd);
}
/* one tap starts listening; a tap while listening ends the recording early,
   so background noise can't keep an attempt hanging open */
function micTap(target){
  if(L && L.rec){
    const hint=document.getElementById('micHint');
    if(hint) hint.textContent='רגע, בודק מה שמעתי...';
    try{ L.rec.stop(); }catch(e){ try{ L.rec.abort(); }catch(_){} }
    return;
  }
  startListening(target);
}
function startListening(target){
  const btn=document.getElementById('micBtn');
  const hint=document.getElementById('micHint');
  const heardEl=document.getElementById('heard');
  if(!SR){ showMicFallback('בדיקת הקול לא זמינה כאן. אמור את המשפט בקול והמשך ידנית.', true); return; }
  stopRecognition();
  cancelSpeech();
  const rec=new SR();
  const session=L, stepIndex=L.i, epoch=uiEpoch;
  L.rec=rec;
  L.curStep.retryMessage='';
  L.curStep.heardText='';
  L.curStep.heardDetails=null;
  if(heardEl) heardEl.innerHTML='';
  const resultArea=document.getElementById('resultArea');
  if(resultArea) resultArea.innerHTML='';
  L.attempts=(L.attempts||0)+1;
  L.curStep.attempts=L.attempts;
  saveLessonCheckpoint();
  rec.lang='en-US';
  // iOS Safari streams partial transcripts while the learner is still talking
  // (even with interimResults=false), so a single result event must never end
  // the attempt: we accumulate the best transcript across every event and only
  // decide when recognition really ends — or the moment a clear pass arrives.
  rec.interimResults=true;
  rec.maxAlternatives=4;
  let got=false, done=false;
  const soft=softWordsFor(L.curStep);
  let best='', bestDetails={score:0,words:[],matched:[],criticalMismatch:false};
  const active=()=>!!L&&L===session&&L.i===stepIndex&&L.rec===rec&&uiEpoch===epoch;
  // while listening the mic button shows ⏹ — micTap() ends the attempt early
  const restoreMicButton=()=>{
    btn.classList.remove('listening');
    btn.textContent='🎤';
    btn.setAttribute('aria-label','התחלת הקלטה');
  };
  btn.classList.add('listening');
  btn.textContent='⏹';
  btn.setAttribute('aria-label','סיום ההקלטה');
  hint.textContent='מקשיב... דבר, וכשסיימת לחץ ⏹';
  rec.onresult=(e)=>{
    if(done||!active()) return;
    for(let ri=0;ri<e.results.length;ri++){
      const result=e.results[ri];
      if(!result) continue;
      for(let ai=0;ai<result.length;ai++){
        const alt=result[ai];
        const transcript=alt&&typeof alt.transcript==='string'?alt.transcript.trim():'';
        if(!transcript) continue;
        got=true;
        const details=matchDetails(target,transcript,soft);
        if(details.score>=bestDetails.score){ bestDetails=details; best=transcript; }
      }
    }
    if(!got) return;
    const step=L.curStep||{};
    step.heardText=best;
    // while still recording, show ONLY what was heard — the word-by-word
    // feedback lists the target words, which would spoil the recall exercise
    step.heardDetails=null;
    if(heardEl) heardEl.innerHTML=`<div>זה מה שהטלפון קלט: “${esc(best)}”</div>`;
    requestAnimationFrame(scrollComposerToEnd);
    // finalize early ONLY when every word of the phrase was heard in order —
    // stopping at a partial match used to cut the mic off mid-sentence
    const missedNow=bestDetails.words.filter((w,i)=>!bestDetails.matched[i]);
    if(!bestDetails.criticalMismatch&&!missedNow.length){
      done=true;
      step.tries=(step.tries||0)+1;
      L.tries=step.tries;
      step.heardDetails=bestDetails;
      stopRecognition();
      recordStepResult(step,'pass');
      showResult('pass',pick(PRAISE));
    }
  };
  rec.onerror=(e)=>{
    if(done||!active()||got) return;
    restoreMicButton();
    const code=e?.error||'';
    if(code==='aborted') return;
    if(code==='not-allowed'||code==='service-not-allowed'||code==='audio-capture'||code==='language-not-supported'){
      micUnavailableThisSession=true;
      showMicFallback(code==='audio-capture'
        ? 'המיקרופון אינו זמין כרגע. אמור את המשפט בקול והמשך בלי בדיקה.'
        : code==='language-not-supported'
          ? 'בדיקת הקול באנגלית אינה זמינה במכשיר הזה. אמור את המשפט בקול והמשך בלי בדיקה.'
          : 'אין הרשאה למיקרופון. אמור את המשפט בקול והמשך בלי בדיקה.', true);
    }
    else if(code==='no-speech') showMicFallback('לא נקלט קול. אפשר לנסות שוב או להמשיך ידנית.');
    else if(code==='network') showMicFallback('בדיקת הקול אינה זמינה כרגע בגלל החיבור. אפשר להמשיך ידנית.');
    else showMicFallback('בדיקת הקול לא הצליחה. אמור את המשפט בקול והמשך ידנית.');
  };
  rec.onend=()=>{
    if(!active()) return;
    L.rec=null;
    restoreMicButton();
    if(done) return;
    if(!got){
      const t=hint.textContent;
      if(t.indexOf('מקשיב')>-1||t.indexOf('בודק')>-1) hint.textContent='לא שמעתי כלום — נסה שוב, קרוב לטלפון 🎤';
      revealEscapes();
      return;
    }
    // the attempt ended without a clear pass — one full try, judged on the
    // best transcript heard during the whole attempt. Only now is the
    // word-by-word feedback revealed, so it can't spoil the answer mid-attempt
    const step=L.curStep||{};
    step.tries=(step.tries||0)+1;
    L.tries=step.tries;
    step.heardDetails=bestDetails;
    saveLessonCheckpoint();
    const missed=bestDetails.words.filter((w,i)=>!bestDetails.matched[i]);
    if(!bestDetails.criticalMismatch&&!missed.length){
      recordStepResult(step,'pass');
      showResult('pass',pick(PRAISE));
    } else if(bestDetails.score>=.70&&!bestDetails.criticalMismatch&&L.tries<3){
      // almost there — a word went missing, so the practice repeats it
      showResult('retry','כמעט! 👏 לא שמעתי את: ' + missed.join(', ') + ' — עוד פעם, והפעם תדגיש אותה 💪');
    } else if(L.tries>=3){
      recordStepResult(step,'fail');
      if(step.warmup) showResult('pass','לא נורא — המשפט הזה יחזור בחימום הבא. ממשיכים! 💪');
      else if(step.requeued) showResult('pass','התאמנת על זה חזק היום — עם עוד תרגול זה יישב. ממשיכים! 💪');
      else if(step.isDlg) showResult('pass','כל הכבוד שניסית — נמשיך בשיחה והמשפט יחזור בתרגול 💪');
      else showResult('requeue','הטלפון עדיין לא קלט את כל המשפט. נמשיך ונחזור אליו שוב בסוף');
    } else if(bestDetails.score>=.40) showResult('retry',pick(ALMOST));
    else showResult('retry','התמלול לא היה בטוח. נסה שוב לאט, או המשך ידנית — יש לך את זה');
  };
  try{rec.start();}
  catch(e){
    if(L&&L===session&&L.rec===rec) L.rec=null;
    restoreMicButton();
    showMicFallback('בדיקת הקול לא נפתחה. אמור את המשפט בקול והמשך ידנית.', true);
  }
}
function showResult(kind, msg){
  const step=L?.curStep;
  if(!step) return;
  if(kind==='retry') step.retryMessage=msg;
  else {
    step.resultKind=kind;
    step.resultMessage=msg;
    step.retryMessage='';
  }
  saveLessonCheckpoint();
  renderSpeak(step);
  if(kind === 'pass' && navigator.vibrate) navigator.vibrate(40);
}
function requeueAndNext(){
  const step = L.curStep;
  recordStepResult(step,'fail');
  if(step && !step.requeued && !step.warmup){
    const hid = step.hid || null;
    const doneIdx = L.steps.findIndex(s=>s.type === 'done');
    L.steps.splice(doneIdx, 0, {type:'speak', p:step.p, isDlg:step.isDlg, requeued:true, hid});
    saveLessonCheckpoint();
  }
  next();
}

    saveLessonCheckpoint();

function selectOrderChunk(id){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order'||step.correct||step.selected.includes(id)) return;
  step.selected.push(id);
  if(step.selected.length===step.chunks.length){
    step.correct=step.selected.every((v,i)=>v===i);
    step.wrong=!step.correct;
    if(step.correct) recordStepResult(step,'pass');
    else if(!step.hadWrong){ step.hadWrong=true; step.usedHint=true; noteHint(step); }
  }
  saveLessonCheckpoint();
  renderOrder(step);
}
function undoOrder(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order'||step.correct) return;
  step.selected.pop(); step.wrong=false; saveLessonCheckpoint(); renderOrder(step);
}
function resetOrder(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order') return;
  step.selected=[]; step.wrong=false; saveLessonCheckpoint(); renderOrder(step);
}
function revealOrderHint(){
  const step=L?.steps[L.i];
  if(!step||step.type!=='order') return;
  if(!step.showHint){ step.showHint=true; step.usedHint=true; noteHint(step); }
  saveLessonCheckpoint(); renderOrder(step);
}

function renderListen(step){
  invalidateDialogueFlow(true);
  const line=step.line,meta=conversationMeta(L.idx),spokenEn=ptext(line,'en',true);
  // Two lines from the same character in a row are one turn, not two
  // messages: no 'about to speak' announcement in between, and only a
  // breath between the sentences instead of a full reading pause.
  const continuing=L.steps[L.i-1]?.type==='listen';
  const runsOn=L.steps[L.i+1]?.type==='listen';
  if(continuing) step.arrived=true;
  const current=step.arrived?{who:'app',line,showHe:!!step.showHe,showTl:!!step.showTl}:null;
  const typing=`<div class="dlg-line typing-line"><div class="dlg-avatar" aria-hidden="true">${meta.character.avatar}</div><div class="dlg-bubble voice-note">🎙️ ${esc(meta.character.name)} שולח הודעה<span class="vdots"><i></i><i></i><i></i></span></div></div>`;
  // No pause and no skip: the conversation just flows, like a real one.
  // Whoever needs a moment gets it by opening an aid or replaying a line —
  // the flow waits a little longer on its own and then carries on.
  const composer=`
    <div class="flow-controls">
      <span id="flowStatus">${step.arrived?meta.character.name+' מדבר…':'הודעה חדשה בדרך…'}</span>
    </div>`;
  if(L.isPractice){
    const eventHtml=storyEventHtml(step.event);
    stageShell(step.arrived?'speaking':'waiting',
      step.arrived
        ? eventHtml+captionHtml(line,step)
        : `<div class="cap-typing">${esc(meta.character.name)} עומד לדבר<span class="vdots"><i></i><i></i><i></i></span></div>`,
      composer,
      step.arrived?'speaking':'incoming');
  } else {
    dialogueShell(chatMessagesHtml(current,step.arrived?'conversation-current':'' )+(step.arrived?'':typing),composer);
  }
  if(!step.arrived){
    scheduleDialogueFlow(()=>{ step.arrived=true;saveLessonCheckpoint();renderListen(step); },600);
    return;
  }
  // when the same character keeps talking, a breath is enough — but without a
  // voice the delay is the only time there is to read, so keep that readable
  const voiced='speechSynthesis' in window;
  const readingDelay=runsOn
    ? (voiced?340:Math.max(1200,Math.min(2600,spokenEn.length*32)))
    : Math.max(1900,Math.min(3400,spokenEn.length*38));
  const speechDeadline=Date.now()+20000;
  const afterSpeech=()=>{
    const status=document.getElementById('flowStatus');
    if(status) status.textContent=runsOn?meta.character.name+' ממשיך…':'ממשיך בעוד רגע…';
    // an open translation means someone is reading — grant the extra beat
    scheduleDialogueFlow(()=>next(),readingDelay+((step.showHe||step.showTl)?1800:0));
  };
  const watchdog=()=>{
    if('speechSynthesis' in window&&speechSynthesis.speaking){
      if(Date.now()<speechDeadline){ scheduleDialogueFlow(watchdog,900); return; }
      // a stuck speech engine must not stall the conversation: cut it loose
      cancelSpeech();
      afterSpeech();
      return;
    }
    afterSpeech();
  };
  scheduleDialogueFlow(watchdog,Math.max(5500,spokenEn.length*160));
  speak(spokenEn,afterSpeech);
}
function renderBranchChoice(step){
  invalidateDialogueFlow(false);
  const one=step.options.length===1;
  const composer=`
    <div class="composer-head"><span class="composer-label">${one?'💬 המשפט שמתאים עכשיו':'💡 רעיונות למה אפשר לענות'}</span><span style="font-size:12px;color:var(--dim)">${one?'אומרים אותו באנגלית':'בחר אחד — ואומרים אותו באנגלית'}</span></div>
    <div class="conversation-options">
      ${step.options.map((o,i)=>`<button class="conversation-option" onclick="chooseBranch(${i})">${esc(fillProfileText(o.label,'he'))}</button>`).join('')}
    </div>`;
  if(L.isPractice){
    const prev=[...(L.chat||[])].reverse().find(x=>x.who==='app');
    const eventHtml=storyEventHtml(step.event);
    stageShell('waiting', eventHtml+(prev?captionHtml(prev.line,step):'<div class="cap-typing">מה אפשר לענות?</div>'), composer, 'choosing');
  } else {
    dialogueShell(chatMessagesHtml(), composer);
  }
}
function chooseBranch(optionIndex){
  const step=L?.steps[L.i];
  if(!step||step.type!=='branchChoice'||!step.options[optionIndex]) return;
  invalidateDialogueFlow(true);
  const option=step.options[optionIndex];
  step.selectedIndex=optionIndex;
  if(L.practiceStoryId){
    L.practiceVars=applyPracticeChoice(L.practiceVars,option);
    L.practiceDecisions=L.practiceDecisions||[];
    L.practiceDecisions.push({beatId:step.practiceBeatId,optionId:option.id||String(optionIndex)});
    materializePracticeBeat(step.roundIndex+1,L);
  }
  const hid=phraseIdForText(option.answer.en,L.idx);
  L.steps.splice(L.i+1,2,
    {type:'speak',p:option.answer,isDlg:true,challenge:true,hid,branch:true,roundIndex:step.roundIndex},
    {type:'listen',line:option.reply,isBranchReply:true,roundIndex:step.roundIndex}
  );
  L.i++;
  saveLessonCheckpoint();
  renderStep();
}

/* ---- done ---- */
function renderDone(){
  const durationMs=activeElapsedMs();
  pauseLessonClock();
  stopLessonTimers(false);
  const wasReplay = L.isReplay;
  let streakNote = '', milestones = [];
  if(!wasReplay){
    state.completed = Math.max(state.completed, L.idx + 1);
    const today = todayStr();
    if(state.lastDoneDate === today){
      // a bonus lesson: the day's counter grows, the streak already counted
      state.lessonsToday = lessonsDoneToday() + 1;
    }
    if(state.lastDoneDate !== today){
      const prevStreak = state.streak;
      if(state.lastDoneDate === dateNDaysAgo(1)){
        state.streak++;
      } else if(state.lastDoneDate === dateNDaysAgo(2) && Date.now() - (state.lastGraceTs || 0) > 6*864e5){
        // one missed day forgiven, once a week — the streak survives
        state.streak++;
        state.lastGraceTs = Date.now();
        streakNote = 'פספסת יום אחד — אבל הרצף שלך ניצל 🛟 (קורה לכולם)';
      } else {
        if(state.lastDoneDate) streakNote = 'חזרת — וזה מה שחשוב! רצף חדש מתחיל היום 💪';
        state.streak = 1;
      }
      state.lastDoneDate = today;
      state.lessonsToday = 1;
      const STREAK_MSGS = {3:'שלושה ימים — זה כבר מתחיל להיות הרגל!', 7:'שבוע שלם ברצף! רצינות אמיתית', 14:'שבועיים ברצף — אתה מכונה!', 30:'חודש שלם. וואו. פשוט וואו'};
      if(state.streak !== prevStreak && STREAK_MSGS[state.streak])
        milestones.push('🔥 ' + state.streak + ' ימים ברצף — ' + STREAK_MSGS[state.streak]);
    }
    if((L.idx + 1) % LESSONS_PER_UNIT === 0){
      const u = UNITS[Math.floor(L.idx / LESSONS_PER_UNIT)];
      milestones.push('🏆 סיימת את כל יחידת "' + u.title + '"! אתה כבר יודע ' + (state.completed*5) + ' משפטים באנגלית');
    }
  } else {
    state.replays=(state.replays||0)+1;
  }
  touchState('progressUpdatedAt');
  rememberFinishedRun(L.runId);
  state.session=null;
  touchState('sessionUpdatedAt');
  save();
  confetti();
  if(milestones.length) setTimeout(confetti, 900);
  const mins = Math.max(1, Math.round(durationMs/60000));
  const nm = state.name ? ' ' + state.name : '';
  // finishing the fifth lesson of a unit hands straight over to its rehearsal
  const finishedUnit = !wasReplay && (L.idx+1) % LESSONS_PER_UNIT === 0 ? Math.floor(L.idx/LESSONS_PER_UNIT) : -1;
  playerShell(`
    <div class="finish">
      <div class="emoji">${wasReplay ? '🔁' : milestones.length ? '🏆' : '🏅'}</div>
      <h2>${wasReplay ? 'סיימת את החזרה!' : 'כל הכבוד' + esc(nm) + '!'}</h2>
      <p>${wasReplay
          ? 'חזרת על שיעור — וזה בדיוק מה שהופך ידע לזיכרון לתמיד.'
          : `סיימת את שיעור ${L.idx+1} ${mins===1?'בדקה אחת':'ב־'+mins+' דקות'} · למדת 5 משפטים חדשים 🗣️`}
      </p>
      ${!wasReplay ? `<div class="chip" style="display:inline-flex;margin-top:4px">🔥 ${state.streak} ימים ברצף</div>` : ''}
      ${streakNote ? `<div class="streak-note">${esc(streakNote)}</div>` : ''}
      ${milestones.map(m=>`<div class="milestone">${esc(m)}</div>`).join('')}
      <div class="quote">💬 ${esc(pick(FINISH_QUOTES))}</div>
      ${finishedUnit >= 0 ? `
        <button class="btn" onclick="startUnitRehearsal(${finishedUnit})">🎬 החזרה הגנרלית — שיחה שלמה</button>
        <button class="btn secondary" style="margin-top:8px" onclick="renderHome()">אחר כך — חזרה הביתה</button>
      ` : `
        <button class="btn" onclick="renderHome()">${wasReplay ? 'חזרה הביתה'
          : (lessonsDoneToday() < MAX_LESSONS_PER_DAY && state.completed < LESSONS.length) ? 'חזרה הביתה 🏠 (מחכה לך בונוס 🎁)'
          : 'סיימנו להיום — נתראה מחר! 👋'}</button>
      `}
    </div>
  `);
  L = null;
}

/* ================= boot ================= */
// iOS Safari blocks speech synthesis until it runs inside a user gesture —
// unlock it on the first tap so auto-play of phrases works afterwards.
let speechUnlocked = false;
document.addEventListener('pointerdown', ()=>{
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  speechSynthesis.speak(u);
}, true);
document.addEventListener('visibilitychange',()=>{
  if(!L) return;
  if(document.hidden){
    pauseLessonClock();
    // Both incoming messages and a successfully sent learner message can be
    // waiting on an automatic transition. Preserve that transition instead
    // of letting its timer expire silently while the tab is in the background.
    L.resumeFlowOnVisible=!!dialogueTimer;
    L.rerenderOnVisible=L.resumeFlowOnVisible||!!L.rec;
    L.stepTransitioning=false;
    cancelAutoSpeak();
    stopRecognition();
    invalidateDialogueFlow(false);
    cancelSpeech();
    saveLessonCheckpoint();
  } else {
    startLessonClock();
    L.stepTransitioning=false;
    if(L.rerenderOnVisible||L.resumeFlowOnVisible){
      L.rerenderOnVisible=false;L.resumeFlowOnVisible=false;
      L.rerenderOnPageShow=false;L.resumeFlowOnPageShow=false;renderStep();
    }
  }
});
window.addEventListener('pagehide',()=>{
  if(L){
    L.resumeFlowOnPageShow=!!dialogueTimer||!!L.resumeFlowOnVisible;
    L.rerenderOnPageShow=L.resumeFlowOnPageShow||!!L.rec;
    L.stepTransitioning=false;
    pauseLessonClock(); saveLessonCheckpoint();
  }
  cancelAutoSpeak(); invalidateDialogueFlow(false); stopRecognition();
  cancelSpeech();
});
window.addEventListener('pageshow',()=>{
  if(!L) return;
  L.stepTransitioning=false;
  if(document.hidden) return;
  startLessonClock();
  if(L.rerenderOnPageShow||L.resumeFlowOnPageShow){
    L.rerenderOnPageShow=false;L.resumeFlowOnPageShow=false;L.resumeFlowOnVisible=false;L.rerenderOnVisible=false;
    renderStep();
  }
});

let pendingServiceWorker=null;
let reloadingForUpdate=false;
let updateReloadTimer=null;
/* a waiting update applies itself when the learner is not mid-lesson:
   progress is saved, so the one automatic reload is invisible in practice.
   Mid-lesson we fall back to the banner, and after two failed automatic
   attempts in a session we stop trying and leave the banner up. */
function tryAutoUpdate(){
  if(!pendingServiceWorker || reloadingForUpdate) return false;
  if(typeof L !== 'undefined' && L) return false;
  let tries = 0;
  try{ tries = Number(sessionStorage.getItem('autoUpdTries') || 0); }catch(e){}
  if(tries >= 2) return false;
  try{ sessionStorage.setItem('autoUpdTries', String(tries + 1)); }catch(e){}
  applyAppUpdate();
  return true;
}
function showUpdateBanner(worker){
  if(!worker) return;
  pendingServiceWorker=worker;
  if(tryAutoUpdate()) return;
  if(document.getElementById('updateBanner')) return;
  const banner=document.createElement('div');
  banner.id='updateBanner'; banner.className='update-banner';
  banner.innerHTML=`<div class="txt"><b>גרסה חדשה מוכנה</b><span>העדכון ישמור את ההתקדמות שלך.</span></div><button class="btn" onclick="applyAppUpdate()">עדכון עכשיו</button>`;
  document.body.appendChild(banner);
}
function applyAppUpdate(){
  if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
  if(!pendingServiceWorker){ location.reload(); return; }
  if(pendingServiceWorker.state==='activated'||pendingServiceWorker.state==='redundant'){
    location.reload(); return;
  }
  reloadingForUpdate=true;
  pendingServiceWorker.postMessage({type:'SKIP_WAITING'});
  clearTimeout(updateReloadTimer);
  updateReloadTimer=setTimeout(()=>location.reload(),3000);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadingForUpdate||document.getElementById('updateBanner')){
      if(L){ pauseLessonClock(); saveLessonCheckpoint(); }
      clearTimeout(updateReloadTimer);
      location.reload();
    }
  });
  window.addEventListener('load',()=>{
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>{
      if(hadController&&reg.waiting) showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller) showUpdateBanner(worker);
        });
      });
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
}
if(state.onboarded) renderHome(); else renderOnboarding();
</script>
