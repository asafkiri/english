<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מדברים אנגלית — שיעור קצר ביום</title>
<meta name="description" content="אפליקציה ללימוד דיבור באנגלית — שיעור קצר אחד כל יום, צעד אחר צעד.">
<meta name="theme-color" content="#0e1524">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0e1524;
  --bg2:#131c30;
  --card:#1a2540;
  --card2:#22304f;
  --line:#2c3b5e;
  --text:#eef2fb;
  --dim:#93a0bd;
  --green:#34d399;
  --green-dark:#0e9f6e;
  --blue:#60a5fa;
  --amber:#fbbf24;
  --pink:#f472b6;
  --radius:20px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* author display rules (e.g. .btn{display:block}) override the browser's
   default [hidden] handling, so hidden must win explicitly */
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Heebo","Arial Hebrew",Arial,sans-serif;
  font-size:17px;
  line-height:1.55;
  overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));}
.screen{animation:fadeUp .35s ease both}
/* Screen changes crossfade through the View Transitions API where the browser
   has it. The per-screen fadeUp then steps aside, so the home list no longer
   flashes and re-animates on every render, and the lesson header stays put. */
.vt .screen{animation:none}
::view-transition-old(root){animation:vtOut .16s ease both}
::view-transition-new(root){animation:vtIn .24s ease both}
.player-top,.conversation-top{view-transition-name:lesson-top}
::view-transition-old(lesson-top),::view-transition-new(lesson-top){animation:none;mix-blend-mode:normal}
::view-transition-old(learning-card){animation:learningCardOut .18s ease both;mix-blend-mode:normal}
::view-transition-new(learning-card){animation:learningCardNext .28s cubic-bezier(.2,.76,.24,1) both;mix-blend-mode:normal}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}
@keyframes learningCardOut{to{opacity:0;transform:translateX(-18px) scale(.985)}}
@keyframes learningCardNext{from{opacity:0;transform:translateX(24px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}70%{box-shadow:0 0 0 22px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(340deg);opacity:0}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 6px}
.brand{font-size:20px;font-weight:800}
.brand small{display:block;font-size:12.5px;font-weight:500;color:var(--dim)}
.chips{display:flex;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px}
.chip.gear{cursor:pointer;font-size:16px;color:var(--text);font-family:inherit;min-width:44px;min-height:44px;justify-content:center}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:16px 20px;
  font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;color:#06281c;
  background:linear-gradient(135deg,var(--green),#6ee7b7);
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--dim);border:none;font-weight:600;font-size:15px}
.btn:disabled{filter:grayscale(.6);opacity:.55;cursor:default}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* ---------- home ---------- */
.hello{margin:8px 2px 12px}
.hello h1{font-size:25px;font-weight:800;line-height:1.3}
.hello p{color:var(--dim);font-size:14.5px;margin-top:3px}
.today{position:relative;overflow:hidden;background:linear-gradient(140deg,#153054,#132a45 55%,#12233c);border:1px solid #29466e}
.today .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(52,211,153,.15);color:var(--green);font-size:13px;font-weight:800;border-radius:999px;padding:4px 12px;margin-bottom:10px}
.today h2{font-size:23px;font-weight:800;margin-bottom:4px}
.today .goal{color:#b9c6e2;font-size:15.5px;margin-bottom:16px}
.today .deco{position:absolute;left:-18px;top:-24px;font-size:110px;opacity:.09;transform:rotate(-12deg);pointer-events:none}
.done-today{background:linear-gradient(140deg,#14352b,#11291f);border:1px solid #1e4d3a;text-align:center}
.done-today .big{font-size:46px;margin-bottom:6px}
.done-today h2{font-size:21px;margin-bottom:6px}
.done-today p{color:#a7d9c3;font-size:15px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12.5px;color:var(--dim)}
.section-title{font-size:17px;font-weight:800;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.unit{margin-bottom:14px}
.unit-head{display:flex;align-items:center;gap:10px;padding:10px 4px;color:var(--dim);font-weight:800;font-size:14.5px}
.unit-head .bar{flex:1;height:1px;background:var(--line)}
.lesson-row{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;
  cursor:pointer;transition:transform .1s ease;width:100%;color:var(--text);font-family:inherit;text-align:right;
}
.lesson-row:active{transform:scale(.98)}
.lesson-row:disabled{cursor:default}
.lesson-row .num{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;flex-shrink:0;background:var(--card2);color:var(--dim);
}
.lesson-row.done .num{background:rgba(52,211,153,.16);color:var(--green)}
.lesson-row.current .num{background:linear-gradient(135deg,var(--green),#6ee7b7);color:#06281c}
.lesson-row.locked{opacity:.45;cursor:default}
.lesson-row .info{flex:1;min-width:0}
.lesson-row .info b{display:block;font-size:16px}
.lesson-row .info span{font-size:13px;color:var(--dim)}
.lesson-row .mark{font-size:18px}
.home-focus{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;
  padding:13px 14px;margin-bottom:14px;background:linear-gradient(135deg,#15304e,#13263f);
  border:1px solid #29466e;border-radius:17px;animation:homeFocusIn .38s ease both;
}
.home-focus .focus-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;background:rgba(52,211,153,.13);font-size:21px}
.home-focus.done .focus-icon{background:rgba(52,211,153,.17)}
.home-focus .focus-copy{flex:1;min-width:0}
.home-focus .focus-label{font-size:12.5px;font-weight:800;color:var(--green);margin-bottom:2px}
.home-focus b{display:block;font-size:17px;line-height:1.35}
.home-focus small{display:block;color:#b9c6e2;font-size:12.5px;line-height:1.4;margin-top:2px}
.home-map-title{font-size:20px;font-weight:900;margin:17px 2px 9px;display:flex;align-items:center;justify-content:space-between}
.home-map-title small{font-size:12.5px;color:var(--dim);font-weight:650}
.course-path{position:relative}
.home-unit{margin-bottom:9px;animation:homePathIn .38s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.home-unit-head{
  width:100%;min-height:62px;display:flex;align-items:center;gap:11px;padding:10px 12px;
  color:var(--text);font:inherit;text-align:right;background:var(--card);border:1px solid var(--line);
  border-radius:16px;cursor:pointer;transition:border-color .2s ease,background .2s ease,transform .12s ease;
}
.home-unit-head:active{transform:scale(.985)}
.home-unit.active .home-unit-head{border-color:rgba(52,211,153,.36);background:linear-gradient(135deg,#192d49,#17263e)}
.home-unit.complete .home-unit-head{min-height:56px}
.home-unit.future .home-unit-head{opacity:.62}
.home-unit-emoji{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);font-size:18px;flex-shrink:0}
.home-unit-copy{flex:1;min-width:0}
.home-unit-copy b{display:block;font-size:15.5px;line-height:1.35}
.home-unit-copy span{display:block;color:var(--dim);font-size:12.5px;margin-top:1px}
.home-unit-progress{font-size:12px;font-weight:850;color:var(--green);white-space:nowrap}
.home-unit-chevron{font-size:15px;color:var(--dim);transition:transform .3s ease}
.home-unit-head[aria-expanded="true"] .home-unit-chevron{transform:rotate(180deg)}
.home-unit-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s cubic-bezier(.2,.75,.25,1),opacity .25s ease;opacity:1}
.home-unit-body.collapsed{grid-template-rows:0fr;opacity:0}
.home-unit-body-inner{min-height:0;overflow:hidden}
.home-unit .unit-promise{margin:9px 9px 7px;padding:8px 10px;border-radius:11px;background:rgba(96,165,250,.08);color:#b9c6e2}
.home-unit-lessons{position:relative;padding-top:2px}
.home-unit-lessons::before{content:"";position:absolute;right:32px;top:0;bottom:7px;width:2px;background:linear-gradient(var(--line),rgba(52,211,153,.28),var(--line));border-radius:2px}
.home-unit .lesson-row{position:relative;z-index:1;margin-bottom:7px}
.home-unit .lesson-row.done{min-height:54px;padding:8px 12px}
.home-unit .lesson-row.done .num{width:34px;height:34px;border-radius:10px}
.home-unit .lesson-row.current,.home-unit .lesson-row.paused-here{
  min-height:72px;padding:14px 13px;border-color:rgba(52,211,153,.6);
  background:linear-gradient(135deg,#1b3550,#173047);box-shadow:0 10px 28px rgba(0,0,0,.18);
  animation:homeCurrentIn .7s cubic-bezier(.2,.8,.25,1) both;
}
.home-unit .lesson-row.current .info b,.home-unit .lesson-row.paused-here .info b{font-size:18px}
.home-unit .lesson-row.locked{min-height:49px;padding:7px 12px}
.home-unit .lesson-row.locked .num{width:32px;height:32px;border-radius:10px}
.home-path-special{
  width:calc(100% - 18px);margin:10px 9px 12px;display:flex;align-items:center;gap:11px;padding:12px 13px;
  color:#fff;font:inherit;text-align:right;background:linear-gradient(135deg,#6556d8,#5443c0);
  border:1px solid rgba(167,139,250,.45);border-radius:16px;cursor:pointer;box-shadow:0 9px 24px rgba(72,55,180,.18);
}
.home-path-special:active{transform:scale(.985)}
.home-path-special .special-icon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:20px}
.home-path-special .special-copy{flex:1}
.home-path-special b{display:block;font-size:15.5px}.home-path-special small{display:block;font-size:12px;opacity:.82;margin-top:2px}
.home-path-special .special-arrow{font-size:20px;opacity:.8}
.home-path-milestone{
  display:grid;grid-template-columns:44px 1fr;gap:4px 11px;align-items:center;margin:13px 0;
  padding:13px;background:linear-gradient(145deg,#33290f,#20190c);border:1px solid rgba(251,191,36,.4);border-radius:17px;
}
.home-path-milestone .milestone-icon{grid-row:1/3;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(251,191,36,.12);font-size:23px}
.home-path-milestone .milestone-copy{min-width:0}.home-path-milestone .milestone-tag{font-size:12px;font-weight:850;color:var(--amber)}
.home-path-milestone b{display:block;font-size:16px;line-height:1.35}.home-path-milestone small{display:block;color:#cfc3a6;font-size:12px;margin-top:2px}
.home-path-milestone .milestone-actions{grid-column:1/-1;display:flex;gap:7px;margin-top:8px}
.home-path-milestone .btn{padding:11px 12px;font-size:14px;border-radius:13px}.home-path-milestone .btn.ghost{width:auto;white-space:nowrap}
.home-lower{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.home-stats-strip{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 4px;margin-bottom:9px}
.home-stat{flex:1;text-align:center;padding:3px 5px;border-inline-start:1px solid var(--line)}
.home-stat:first-child{border-inline-start:none}
.home-stat b{display:block;font-size:18px}.home-stat span{font-size:11.5px;color:var(--dim)}
.home-mission-stat{text-align:center;color:var(--amber);font-size:12.5px;font-weight:750;margin:7px 0 10px}
.home-review-btn{padding:13px 16px;font-size:15.5px}
@keyframes homeFocusIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes homePathIn{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
@keyframes homeCurrentIn{0%{opacity:0;transform:translateY(8px);box-shadow:0 0 0 0 rgba(52,211,153,.28)}55%{opacity:1;transform:none;box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 10px 28px rgba(0,0,0,.18)}}
@media (max-width:370px){
  .home-map-title small{display:none}.home-unit-head{padding-inline:10px}.home-unit-progress{font-size:11px}
}
@media (prefers-reduced-motion: reduce) {
  .home-focus,.home-unit,.home-unit .lesson-row.current,.home-unit .lesson-row.paused-here{animation:none}
  .home-unit-body,.home-unit-chevron{transition:none}
}

/* ---------- lesson player ---------- */
.player-top{display:flex;align-items:center;gap:12px;padding:16px 0 14px}
.xbtn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:17px;cursor:pointer;flex-shrink:0}
.pbar{flex:1;height:12px;background:var(--card);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#6ee7b7);transition:width .4s ease}
.timer{font-size:13px;font-weight:700;color:var(--dim);min-width:44px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
/* what he can say now: the proof a finished lesson leaves behind */
.can-say{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 8px;margin:16px 0 6px;text-align:right}
.can-say-title{font-size:14.5px;font-weight:800;color:var(--green);margin-bottom:8px}
.can-say-line{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:transparent;border:none;border-top:1px solid var(--line);
  padding:8px 2px;color:var(--text);font:inherit;cursor:pointer;text-align:right}
.can-say-line:first-of-type{border-top:none}
.can-say-line .en{flex:1;direction:ltr;text-align:right;font-weight:800;font-size:16.5px}
.can-say-line .he{font-size:13.5px;color:var(--dim)}
.can-say-line .spk{font-size:16px;color:var(--blue)}
.unit-promise{font-size:13.5px;color:#a7b6d6;margin:-4px 4px 10px;line-height:1.45}
.step{padding-top:8px}
.step-label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--blue);background:rgba(96,165,250,.12);padding:4px 12px;border-radius:999px;margin-bottom:14px}
.step h2{font-size:23px;font-weight:800;margin-bottom:8px}
.step .sub{color:var(--dim);font-size:15.5px;margin-bottom:18px}

.phrase-card{
  background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--radius);padding:26px 20px;text-align:center;margin-bottom:16px;animation:pop .3s ease both;
}
.phrase-en{direction:ltr;font-size:30px;font-weight:800;letter-spacing:.2px;margin-bottom:12px;line-height:1.35}
.phrase-en .w{cursor:pointer;border-bottom:1.5px dashed rgba(147,160,189,.45);transition:color .12s ease,border-color .12s ease}
.phrase-en .w:active{color:var(--green)}
/* the word being spoken lights up as the voice reaches it: sound meets text */
.phrase-en .w.now{color:var(--green);border-bottom-color:var(--green)}
.cap-en .w,.dlg-en .w,.cap-previous-en .w{display:inline;transition:color .12s ease,text-shadow .12s ease}
.cap-en .w.now,.dlg-en .w.now,.cap-previous-en .w.now{color:var(--green);text-shadow:0 0 12px rgba(52,211,153,.55)}
.phrase-en button.w{display:inline;background:none;border:0;color:inherit;font:inherit;padding:0;line-height:inherit}
.milestone{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.45);border-radius:16px;padding:14px 16px;margin:14px 0 0;font-weight:700;font-size:15.5px;color:var(--amber);animation:pop .4s ease both}
.streak-note{margin-top:10px;font-size:14.5px;color:#a7d9c3}
.phrase-tl{font-size:19px;color:var(--amber);font-weight:700;margin-bottom:6px}
.phrase-tl::before{content:"🗣️ ";font-size:15px}
.phrase-he{font-size:17px;color:var(--dim)}
.play-big{
  margin:6px auto 0;width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),#3b82f6);color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;transition:transform .12s ease;position:relative;
}
.play-big:active{transform:scale(.92)}
.speak-zone{text-align:center;margin-top:6px}
.listen-first{min-height:118px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--dim);font-weight:750;font-size:16px}
.phrase-mic-entry{animation:phraseMicRise .42s cubic-bezier(.2,.78,.24,1) both}
@keyframes phraseMicRise{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.learning-card{position:relative;overflow:hidden;view-transition-name:learning-card;transition:border-color .28s ease,box-shadow .28s ease,background .28s ease}
.learning-card.is-intro{animation:learningCardEnter .42s cubic-bezier(.2,.76,.24,1) both}
.learning-card.is-intro .cue,.learning-card.is-intro .hint-en,.learning-card.is-intro .hint-tl,.learning-card.is-intro .play-big{opacity:0;animation:learningPartIn .34s ease both}
.learning-card.is-intro .cue{animation-delay:.08s}.learning-card.is-intro .hint-en{animation-delay:.16s}.learning-card.is-intro .hint-tl{animation-delay:.24s}.learning-card.is-intro .play-big{animation-delay:.32s}
.learning-card.is-intro::after{content:'';position:absolute;inset:-40% auto -40% -30%;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:skewX(-18deg);animation:learningSheen 1.15s .25s ease-out both;pointer-events:none}
.learning-card .hint-en .w{display:inline-block;transition:color .14s ease,text-shadow .14s ease,transform .14s ease}
.learning-card .hint-en .w.now{color:var(--green);text-shadow:0 0 15px rgba(52,211,153,.58);transform:translateY(-2px) scale(1.035)}
.learning-card .hint-en .w.heard-ok{color:var(--green)}
.learning-card .hint-en .w.heard-miss{color:var(--amber);animation:learningWordNudge .36s ease both}
.learning-card.is-audio-live .play-big{animation:learningSpeakerBeat .9s ease-in-out infinite;box-shadow:0 0 0 0 rgba(96,165,250,.4)}
.learning-card.is-audio-live .play-big::before,.learning-card.is-audio-live .play-big::after{content:'';position:absolute;inset:-8px;border:2px solid rgba(96,165,250,.48);border-radius:50%;animation:learningSoundRing 1.35s ease-out infinite;pointer-events:none}
.learning-card.is-audio-live .play-big::after{animation-delay:.48s}
.learning-card.is-learning-success{border-color:rgba(52,211,153,.72);background:linear-gradient(150deg,rgba(24,74,69,.95),var(--card));box-shadow:0 0 0 3px rgba(52,211,153,.1),0 18px 42px rgba(7,38,31,.38)}
.learning-success-orb{width:92px;height:92px;margin:7px auto 4px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),#6ee7b7);color:#073d2d;font-size:48px;font-weight:900;animation:learningSuccessPop .55s cubic-bezier(.18,.82,.22,1) both}
.learning-auto-next{margin-top:7px;color:#a7f3d0;font-size:14px;font-weight:800}
@keyframes learningCardEnter{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes learningPartIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes learningSheen{from{left:-30%;opacity:0}25%{opacity:1}to{left:115%;opacity:0}}
@keyframes learningSpeakerBeat{0%,100%{transform:scale(1)}45%{transform:scale(1.055)}}
@keyframes learningSoundRing{0%{opacity:.65;transform:scale(.78)}100%{opacity:0;transform:scale(1.38)}}
@keyframes learningWordNudge{0%,100%{transform:none}35%{transform:translateX(3px)}70%{transform:translateX(-3px)}}
@keyframes learningSuccessPop{0%{opacity:0;transform:scale(.55) rotate(-12deg)}68%{opacity:1;transform:scale(1.1) rotate(2deg)}100%{transform:scale(1)}}
.mic-btn{
  width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;margin:8px auto 10px;
  background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;font-size:38px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
}
.mic-btn.listening{animation:pulse 1.4s infinite;background:linear-gradient(135deg,#f87171,#ef4444)}
.mic-btn:active{transform:scale(.93)}
/* a live ring that grows with his voice, driven by the recogniser's interim
   results — proof that the phone hears him, without a second microphone stream */
.mic-btn,.conversation-mic{position:relative;--level:0}
.mic-btn::after,.conversation-mic::after{
  content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid rgba(52,211,153,.75);pointer-events:none;
  opacity:0;transform:scale(.9);transition:transform .11s ease-out,opacity .16s ease-out;
}
.mic-btn.listening::after,.conversation-mic.listening::after{
  opacity:calc(.2 + var(--level) * .8);transform:scale(calc(1 + var(--level) * .38));
}
.mic-hint{font-size:14.5px;color:var(--dim)}
.heard{margin-top:12px;font-size:15px;color:var(--dim);direction:ltr;min-height:24px}
.result-msg{
  margin:14px auto 4px;padding:12px 18px;border-radius:14px;font-weight:800;font-size:17px;
  display:inline-block;animation:pop .3s ease both;
}
.result-msg.good{background:rgba(52,211,153,.15);color:var(--green)}
.result-msg.almost{background:rgba(251,191,36,.13);color:var(--amber)}

.quiz-q{margin-bottom:16px}
.quiz-opt{
  display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:15px 16px;font-size:17px;font-weight:700;color:var(--text);
  font-family:inherit;cursor:pointer;margin-bottom:10px;transition:all .15s ease;
}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.right{border-color:var(--green);background:rgba(52,211,153,.13);color:var(--green)}
.quiz-opt.wrong{border-color:#f87171;background:rgba(248,113,113,.09);animation:shake .35s ease}

.dlg-line{display:flex;gap:10px;margin-bottom:12px;animation:fadeUp .3s ease both}
.dlg-avatar{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.dlg-bubble{background:var(--card);border:1px solid var(--line);border-radius:16px;border-top-right-radius:4px;padding:11px 14px;max-width:82%}
.dlg-line.me{flex-direction:row-reverse}
.dlg-line.me .dlg-bubble{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.35);border-top-right-radius:16px;border-top-left-radius:4px}
.dlg-en{direction:ltr;text-align:left;font-weight:800;font-size:17.5px}
.dlg-tl{font-size:14.5px;color:var(--amber);margin-top:2px}
.dlg-he{font-size:13.5px;color:var(--dim);margin-top:1px}

.finish{text-align:center;padding-top:26px}
.finish .emoji{font-size:74px;animation:pop .5s ease both}
.finish h2{font-size:26px;margin:12px 0 6px}
.finish p{color:var(--dim);font-size:16px;margin-bottom:8px}
.finish .quote{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:18px 0;font-size:16px;color:#c9d4ec}
.confetti{position:fixed;bottom:-40px;font-size:26px;pointer-events:none;animation:floatUp linear both;z-index:50}

/* ---------- onboarding ---------- */
.onb{padding-top:8vh;text-align:center}
.onb .logo{font-size:64px}
.onb h1{font-size:28px;margin:14px 0 10px}
.onb p{color:var(--dim);font-size:16.5px;margin-bottom:8px}
.onb .promise{margin:22px 0;text-align:right}
.onb .promise div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;font-size:15.5px}
.onb input{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--text);
  padding:15px;font-size:18px;font-family:inherit;text-align:center;margin:6px 0 14px;outline:none;
}
.onb input:focus{border-color:var(--green)}

/* ---------- review ---------- */
.rev-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rev-item .txt{flex:1;min-width:0}
.rev-item .en{direction:ltr;text-align:right;font-weight:800;font-size:16.5px}
.rev-item .he{font-size:13.5px;color:var(--dim)}
.rev-play{width:44px;height:44px;border-radius:50%;border:none;background:var(--card2);color:var(--blue);font-size:17px;cursor:pointer;flex-shrink:0}

/* ---------- recall, challenges & conversation ---------- */
.recall-card{background:linear-gradient(150deg,#1e2d4a,var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;text-align:center;margin-bottom:16px}
.recall-card .cue{font-size:23px;font-weight:800;margin-bottom:6px}
.recall-card .cue-note{font-size:14px;color:var(--dim)}
.hint-box{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hint-box[hidden]{display:none}
.hint-en{direction:ltr;font-size:27px;font-weight:800;line-height:1.35}
.hint-tl{font-size:18px;color:var(--amber);font-weight:700;margin-top:6px}
.hint-actions{display:flex;gap:8px;margin:12px 0 4px}
.hint-actions .btn{padding:12px;font-size:15px}
.challenge-help{color:var(--dim);font-size:14.5px;margin:-5px 0 15px}
.audio-only{font-size:15px;color:var(--dim);margin:8px 0 16px}
.order-target{margin:13px 0 9px;padding:14px 16px;border-radius:16px;text-align:center;background:linear-gradient(145deg,rgba(96,165,250,.18),rgba(96,165,250,.08));border:1px solid rgba(96,165,250,.42);box-shadow:0 10px 24px rgba(4,12,29,.2)}
.order-target-label{color:#93c5fd;font-size:12.5px;font-weight:800;margin-bottom:5px}
.order-target-text{color:#f8fbff;font-size:clamp(21px,5.6vw,26px);font-weight:850;line-height:1.38}
.order-instruction{color:var(--dim);font-size:14px;font-weight:650;text-align:center;margin:0 0 16px}
.order-built{direction:ltr;min-height:62px;border:1.5px dashed var(--line);border-radius:14px;padding:12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.order-built.empty::after{content:"המשפט באנגלית ייבנה כאן";direction:rtl;color:var(--dim);font-size:14px}
.word-bank{direction:ltr;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.word-chip{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;font-weight:750;cursor:pointer;transition:border-color .18s ease,background .18s ease,color .18s ease,transform .18s ease,opacity .18s ease}
.word-chip:disabled{opacity:.3;cursor:default}
.built-chip{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.4);cursor:default}
.order-challenge .word-bank:empty{margin:0;min-height:0}
.order-built .built-chip.is-returning{color:var(--amber);border-color:rgba(251,191,36,.72);background:rgba(251,191,36,.12);animation:orderWrongNudge .34s ease both}
.word-bank .word-chip.wrong-returned{color:var(--amber);border-color:rgba(251,191,36,.72);animation:orderWrongNudge .34s ease both}
.order-built.is-correct{border-style:solid;border-color:rgba(52,211,153,.82);background:rgba(52,211,153,.08);box-shadow:0 0 0 3px rgba(52,211,153,.08);animation:orderJoin .46s cubic-bezier(.18,.82,.22,1) both}
.order-built.is-correct .built-chip{color:#d8fff1;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.16)}
.order-built.is-correct .w{display:inline-block;transition:color .14s ease,text-shadow .14s ease,transform .14s ease}
.order-built.is-correct .w.now{color:var(--green);text-shadow:0 0 14px rgba(52,211,153,.62);transform:translateY(-2px) scale(1.045)}
.order-success{animation:orderSuccessRise .36s .2s ease both;opacity:0}
.order-success-mark{width:64px;height:64px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),#6ee7b7);color:#073d2d;font-size:34px;font-weight:900;animation:orderSuccessPop .48s .14s cubic-bezier(.18,.82,.22,1) both}
.order-pronunciation{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--amber);font-size:19px;font-weight:800;margin:8px 0}
.order-pronunciation .order-speaker{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(96,165,250,.14)}
.order-challenge.is-audio-live .order-speaker{animation:learningSpeakerBeat .82s ease-in-out infinite;box-shadow:0 0 0 7px rgba(96,165,250,.1)}
.order-auto-next{color:#a7f3d0;font-size:14px;font-weight:800;margin-top:7px}
@keyframes orderWrongNudge{0%,100%{transform:none}28%{transform:translateX(5px)}58%{transform:translateX(-5px)}82%{transform:translateX(2px)}}
@keyframes orderJoin{0%{transform:scale(.985)}62%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes orderSuccessRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes orderSuccessPop{0%{opacity:0;transform:scale(.5) rotate(-14deg)}70%{opacity:1;transform:scale(1.1) rotate(2deg)}100%{transform:scale(1)}}
.chat-thread{margin-bottom:16px}
.voice-note{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:15px}
.vdots{display:inline-flex;margin-inline-start:6px}
.vdots i{width:6px;height:6px;border-radius:50%;background:var(--dim);margin-inline-start:4px;animation:vblink 1.1s infinite}
.vdots i:nth-child(2){animation-delay:.2s}
.vdots i:nth-child(3){animation-delay:.4s}
@keyframes vblink{0%,100%{opacity:.2}50%{opacity:1}}
/* face-to-face stage */
.stage-screen{position:relative}
.stage-screen > *:not(.stage-bg){position:relative;z-index:1}
.stage-bg{position:absolute;inset:-4px -16px;z-index:0;overflow:hidden;border-radius:20px;background:linear-gradient(180deg,var(--sky),var(--ground));isolation:isolate}
/* Full-height, layered SVG scenes replace the old single-colour silhouettes.
   The art keeps its proportions on tall phones and anchors the floor when a
   short screen has to crop a little from the top. */
.stage-bg svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}
.stage-bg::before{content:'';position:absolute;inset:4% 5% 16%;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,var(--moment-light,rgba(255,244,214,.1)) 0 18%,rgba(8,14,25,.02) 42%,rgba(8,14,25,.2) 72%,rgba(8,14,25,.42) 100%)}
.stage-bg::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(8,14,25,.02) 0%,rgba(8,14,25,.06) 48%,rgba(8,14,25,.44) 82%,rgba(8,14,25,.68) 100%);opacity:var(--moment-shade,1);transition:opacity .9s ease}
.stage-bg .backdrop-far,.stage-bg .backdrop-mid,.stage-bg .backdrop-near{transform-box:fill-box;transform-origin:center}
.stage-bg .backdrop-far{animation:sceneParallaxFar 18s ease-in-out infinite}
.stage-bg .backdrop-mid{animation:sceneParallaxMid 13s ease-in-out infinite}
.stage-bg .backdrop-far{filter:saturate(.82) brightness(.9)}
.stage-bg .backdrop-mid{filter:drop-shadow(0 3px 4px rgba(4,9,17,.14))}
.stage-bg .backdrop-near{filter:drop-shadow(0 7px 8px rgba(4,9,17,.24)) saturate(.96)}
.stage-bg .scene-material{mix-blend-mode:soft-light;opacity:.28}
.stage-bg .scene-light-beam{mix-blend-mode:screen;animation:lightBeamBreathe 7.5s ease-in-out infinite}
.stage-bg .scene-ground-light{mix-blend-mode:screen;animation:groundLight 6.5s ease-in-out infinite}
.stage-bg .scene-contact{filter:blur(1.5px)}
.stage-bg .ambient{transform-box:fill-box;transform-origin:center}
.stage-bg .ambient-drift{animation:backdropDrift 15s ease-in-out infinite}
.stage-bg .ambient-sway{animation:backdropSway 8s ease-in-out infinite}
.stage-bg .ambient-pulse{animation:backdropPulse 5.5s ease-in-out infinite}
@keyframes backdropDrift{0%,100%{transform:translateX(-3px)}50%{transform:translateX(4px)}}
@keyframes backdropSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes backdropPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes sceneParallaxFar{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
@keyframes sceneParallaxMid{0%,100%{transform:translateX(1px)}50%{transform:translateX(-1px)}}
@keyframes groundLight{0%,100%{opacity:.3}50%{opacity:.5}}
@keyframes lightBeamBreathe{0%,100%{opacity:.44}50%{opacity:.72}}

/* Motion belongs to the place: no generic floating scene. Each background
   gets one quiet, recognisable ambient behaviour that stays behind the words. */
.context-motion>*{transform-box:fill-box;transform-origin:center}
.motion-breeze .leaf{animation:sceneLeaf 8s linear infinite}.motion-breeze .leaf:nth-child(2){animation-delay:-4.2s}
.motion-dust .mote,.motion-home .mote{animation:sceneMote 7s ease-in-out infinite}.motion-dust .mote:nth-child(2n),.motion-home .mote:nth-child(2n){animation-delay:-3.2s}
.motion-lift .lift-glint,.motion-retail .shop-glint,.motion-transit .transit-glint{animation:sceneGlint 6.8s ease-in-out infinite}
.motion-plaza .bird{animation:sceneBird 12s linear infinite}
.motion-school .paper{animation:scenePaper 9s ease-in-out infinite}
.motion-music .meter{animation:sceneMeter 1.8s ease-in-out infinite;transform-origin:50% 100%}.motion-music .meter:nth-child(2){animation-delay:-.55s}.motion-music .meter:nth-child(3){animation-delay:-1.05s}
.motion-court .ball-shadow{animation:sceneBall 3.8s ease-in-out infinite}
.motion-restaurant .warm-light{animation:backdropPulse 4.2s ease-in-out infinite}
.motion-kitchen .steam{animation:sceneSteam 5s ease-in-out infinite}.motion-kitchen .steam:nth-child(2){animation-delay:-2.4s}
.motion-phone .signal{animation:sceneSignal 2.6s ease-out infinite}.motion-phone .signal:nth-child(2){animation-delay:-1.3s}
.motion-market .flag{animation:sceneFlag 4.6s ease-in-out infinite;transform-origin:50% 0}.motion-market .flag:nth-child(2){animation-delay:-1.5s}
.motion-weather .rain{animation:sceneRain 2.4s linear infinite}.motion-weather .rain:nth-child(2){animation-delay:-1.1s}
.motion-beach .sea-glint{animation:sceneSea 5.5s ease-in-out infinite}
.motion-neighborhood .window-glow{animation:backdropPulse 6s ease-in-out infinite}
@keyframes sceneLeaf{0%{transform:translate(-34px,-18px) rotate(0);opacity:0}12%{opacity:.55}85%{opacity:.35}100%{transform:translate(80px,52px) rotate(260deg);opacity:0}}
@keyframes sceneMote{0%,100%{transform:translate(0,8px);opacity:.1}50%{transform:translate(7px,-13px);opacity:.6}}
@keyframes sceneGlint{0%,68%,100%{transform:translateX(-42px);opacity:0}78%{opacity:.34}92%{transform:translateX(74px);opacity:0}}
@keyframes sceneBird{0%{transform:translateX(-42px);opacity:0}12%,86%{opacity:.5}100%{transform:translateX(102px);opacity:0}}
@keyframes scenePaper{0%,100%{transform:translate(0,0) rotate(-5deg);opacity:.18}50%{transform:translate(18px,-8px) rotate(8deg);opacity:.42}}
@keyframes sceneMeter{0%,100%{transform:scaleY(.42)}45%{transform:scaleY(1)}}
@keyframes sceneBall{0%,100%{transform:translateY(0) scaleX(1);opacity:.2}50%{transform:translateY(-11px) scaleX(.7);opacity:.38}}
@keyframes sceneSteam{0%{transform:translateY(11px) scale(.85);opacity:0}35%{opacity:.38}100%{transform:translate(5px,-23px) scale(1.18);opacity:0}}
@keyframes sceneSignal{0%{transform:scale(.55);opacity:.52}100%{transform:scale(1.35);opacity:0}}
@keyframes sceneFlag{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes sceneRain{0%{transform:translate(-8px,-26px);opacity:0}20%{opacity:.38}100%{transform:translate(12px,48px);opacity:0}}
@keyframes sceneSea{0%,100%{transform:translateX(-14px);opacity:.18}50%{transform:translateX(16px);opacity:.55}}

/* Maya's living-room light is part of the room, not a floating UI effect.
   Only one small SVG group is visible at a time: a travelling wall spot,
   the ray finding the hand-held mirror, or the final spot above the frame. */
.mirror-light-fx{opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.mirror-light-fx .mirror-light-core,.mirror-light-fx .mirror-light-halo,.mirror-final-spot{
  transform-box:fill-box;transform-origin:center
}
.stage-bg.has-mirror-light-moving .wall-light-moving{opacity:1;animation:mirrorWallWander 6.2s ease-in-out infinite}
.stage-bg.is-mirror-action-move .wall-light-moving{animation:mirrorWallTrack 1.85s cubic-bezier(.2,.74,.24,1) both}
.stage-bg.has-mirror-light-source .wall-light-source{opacity:.68}
.stage-bg.is-mirror-action-find .wall-light-source{animation:mirrorSourceReveal 2.2s cubic-bezier(.2,.74,.24,1) both}
.stage-bg.has-mirror-light-final .wall-light-final{opacity:1}
.mirror-source-prop{pointer-events:none}
.mirror-source-prop .sun-mirror-object{opacity:0;transform-box:fill-box;transform-origin:50% 72%}
.mirror-source-prop .mirror-source-book{opacity:0}
.stage-bg.has-mirror-light-source .mirror-source-book,.stage-bg.has-mirror-light-final .mirror-source-book{opacity:1}
.stage-bg.is-mirror-action-find .mirror-source-prop .sun-mirror-object{animation:storyMirrorScenePickup 2.2s cubic-bezier(.18,.74,.22,1) both}
.mirror-window-prop{opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:50% 92%}
.mirror-window-prop .sun-mirror-object{transform-box:fill-box;transform-origin:50% 72%}
.stage-bg.has-mirror-light-final .mirror-window-prop{opacity:1}
.stage-bg.is-mirror-action-place .mirror-window-prop{animation:storyMirrorBackdropPlace 2.35s cubic-bezier(.18,.76,.22,1) both}
.stage-bg.is-mirror-action-place .mirror-window-prop .sun-mirror-object{animation:storyMirrorBackdropTurn 2.35s cubic-bezier(.2,.72,.24,1) both}
.wall-light-final .mirror-final-beam{opacity:0}
.stage-bg.is-mirror-action-place .wall-light-final .mirror-final-spot{animation:mirrorLightLand 2.35s cubic-bezier(.18,.76,.22,1) both}
.stage-bg.is-mirror-action-place .wall-light-final .mirror-final-beam{animation:mirrorBeamFlash 2.35s ease-out both}
@keyframes mirrorWallWander{
  0%,100%{transform:translate(205px,31px) scale(.88);opacity:.62}
  29%{transform:translate(116px,-4px) scale(1.02);opacity:.92}
  58%{transform:translate(18px,24px) scale(.94);opacity:.74}
  78%{transform:translate(72px,4px) scale(1);opacity:.9}
}
@keyframes mirrorWallTrack{
  0%,100%{transform:translate(205px,31px) scale(.88);opacity:.68}
  48%{transform:translate(18px,24px) scale(.96);opacity:.92}
  76%{transform:translate(72px,4px) scale(1);opacity:.84}
}
@keyframes mirrorSourceReveal{
  0%,18%{opacity:0;transform:translate(36px,-20px) scale(.84)}
  52%{opacity:.9;transform:translate(4px,-2px) scale(1.03)}
  76%,100%{opacity:.68;transform:none}
}
@keyframes mirrorLightLand{
  0%,68%{opacity:0;transform:translate(249px,87px) scale(.72)}
  77%{opacity:1;transform:translate(21px,12px) scale(1.08)}
  88%,100%{opacity:1;transform:none}
}
@keyframes mirrorBeamFlash{
  0%,68%{opacity:0}
  74%{opacity:.5}
  84%{opacity:.22}
  92%,100%{opacity:0}
}
@keyframes storyMirrorScenePickup{
  0%,38%{opacity:1;transform:none}
  52%{opacity:1;transform:translate(-4px,-14px) rotate(-8deg) scale(.94)}
  59%,100%{opacity:0;transform:translate(-7px,-22px) rotate(-14deg) scale(.8)}
}
@keyframes storyMirrorBackdropPlace{
  0%,31%{opacity:0;transform:translate(-76px,62px) rotate(-18deg) scale(.76)}
  47%{opacity:1}
  70%{transform:translate(-7px,5px) rotate(4deg) scale(1.04)}
  86%,100%{opacity:1;transform:none}
}
@keyframes storyMirrorBackdropTurn{
  0%,38%{transform:rotate(-18deg)}
  61%{transform:rotate(13deg)}
  79%{transform:rotate(-4deg)}
  100%{transform:none}
}

/* Sam's boxes story uses real scene objects instead of a floating summary
   card. The bag starts on the cartons, follows the chosen branch, and joins
   them on the entrance floor at the end. Every resting pose is state-driven,
   so redraws and reduced-motion mode keep the story visually truthful. */
.sam-door-story{opacity:0;pointer-events:none}
.stage-bg.has-sam-cargo .sam-door-story{opacity:1}
.stage-bg.has-sam-cargo .parking-loose-box{opacity:0}

/* The figure is anchored to the top of the stage rather than centred in it.
   Centring meant everything around it took part in the layout: a caption
   growing to two lines, the answer buttons replacing the microphone, the
   status pill changing width — each one re-centred the column and shoved the
   character up or down, up to 49px on every single beat of the conversation.
   Anchored, the person stands still and only the empty space beneath the
   caption changes size. */
.stage-screen .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:14px 16px;min-height:0;overflow-y:auto;overflow-x:hidden}
.stage-place{font-size:13px;color:var(--dim);text-align:center}
.stage-history{background:none;border:none;color:var(--blue);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
/* The figure scales with the screen instead of dropping off a cliff: full
   size on a roomy phone, gently smaller on a short one, never tiny. */
.stage-screen .stage{--avatar:clamp(132px, 23vh, 184px)}
.stage-avatar{position:relative;width:var(--avatar);height:var(--avatar);flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;margin:2px 0;transition:transform .85s cubic-bezier(.2,.72,.25,1)}
.stage-avatar .face{font-size:calc(var(--avatar)*.37);line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.stage-avatar::before{content:'';position:absolute;left:50%;bottom:0;width:calc(var(--avatar) - 14px);height:calc(var(--avatar) - 14px);transform:translateX(-50%);border-radius:50% 50% 42% 42%;background:radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--who) 30%, transparent), transparent 68%);border:2px solid color-mix(in srgb, var(--who) 48%, transparent);border-bottom:none}
.stage-avatar .ring{position:absolute;left:50%;bottom:0;width:calc(var(--avatar) - 14px);height:calc(var(--avatar) - 14px);transform:translateX(-50%);border-radius:50%;border:2px solid var(--who);opacity:0}
.stage-avatar.speaking .ring{animation:ringOut 1.9s ease-out infinite}
.stage-avatar.speaking .r2{animation-delay:.65s}
.stage-avatar.listening::before{border-color:rgba(52,211,153,.6);background:radial-gradient(circle at 50% 32%, rgba(52,211,153,.24), transparent 68%)}
@keyframes ringOut{0%{transform:translateX(-50%) scale(.86);opacity:.5}100%{transform:translateX(-50%) scale(1.4);opacity:0}}

/* The redesigned cast is a full-body figure. Width still controls face size;
   height gives the legs room without shrinking the expression into a tiny
   portrait. The feet sit on the same visual ground line in every scene. */
.stage-avatar.modern-cast{width:calc(var(--avatar)*1.08);height:calc(var(--avatar)*1.72);margin:-8px 0 -3px;isolation:isolate}
.stage-avatar.modern-cast::before{display:none}
.stage-avatar.modern-cast::after{display:none}
.stage-avatar.modern-cast .ring{display:none}
.stage-avatar.light-left{--shadow-shift:8px;--shadow-skew:-5deg}.stage-avatar.light-right{--shadow-shift:-8px;--shadow-skew:5deg}
.stage-avatar.light-right .face-lighting,.stage-avatar.light-right .body-lighting{transform:scaleX(-1)}
.stage-avatar.light-center{--shadow-shift:0px;--shadow-skew:0deg}
/* The scene already supplies a light colour; use it on the shared cast so a
   kitchen, sunset and cool phone room no longer paint the same highlight. */
.stage-avatar .person-art.modern-v2 .face-lighting path:nth-child(2){stroke:var(--scene-light,#ffe0c2)}
.stage-avatar .person-art.modern-v2 .body-lighting path:first-child,
.stage-avatar .person-art.modern-v2 .body-lighting path:nth-child(3){fill:var(--scene-light,#fff8dd)}

/* Authored story actions live in their own layer. The figure never changes
   layout position: only a limb and the relevant prop move, then the prop's
   final state stays visible until a later story action changes it. */
.stage-story-props{position:absolute;inset:0;z-index:4;overflow:visible;pointer-events:none}
.stage-prop{position:absolute;display:block;overflow:visible;transform-box:border-box;transform-origin:center}
.person-art .held-object{opacity:0;transition:opacity .16s linear}
.stage-avatar.has-held-brushes .person-art .held-brushes-art,.stage-avatar.has-held-phone .person-art .held-phone-art,
.stage-avatar.has-held-photo .person-art .held-photo-art,.stage-avatar.has-held-ball .person-art .held-ball-art,
.stage-avatar.has-held-mirror .person-art .held-mirror-art{opacity:1}

.stage-avatar.stage-action-place-brushes .person-art .held-brushes-art{animation:heldObjectRelease 2.15s linear both}
.stage-avatar.stage-action-pick-up-phone .person-art .held-phone-art{animation:heldObjectAcquire 2.25s linear both}
.stage-avatar.stage-action-hand-over-phone .person-art .held-phone-art,.stage-avatar.stage-action-phone-to-desk .person-art .held-phone-art{animation:heldObjectRelease 2.15s linear both}

/* the drawn cast: breathing, blinking, and a mouth that actually talks */
/* The legacy rig has no drawn contact shadow, so it still needs a filter to
   sit on the ground. The modern cast draws its own .ground-shadow ellipse,
   and a drop-shadow on the root would push the whole animating figure through
   a filter buffer every frame — undoing the one discipline that keeps this
   rig cheap: everything on transform and opacity. */
.person-art{position:relative;width:100%;height:100%;overflow:visible}
.person-art:not(.modern-v2){filter:drop-shadow(0 10px 20px rgba(0,0,0,.45))}
/* Idle loops are offset per character. Without this every figure on screen
   breathes, sways and blinks on the same beat, which reads as one puppet
   wearing different clothes. */
.person-art .figure{transform-box:fill-box;transform-origin:50% 100%;animation:figBreathe 4.4s ease-in-out var(--idle-phase,0s) infinite}
.person-art .head{transform-box:fill-box;transform-origin:50% 92%}
.person-art .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.4s var(--idle-phase,0s) infinite}
.person-art .mouth,.person-art .tongue{transform-box:fill-box;transform-origin:center}
.person-art .tongue{opacity:0}
.person-art .arm,.person-art .forearm,.person-art .hand,.person-art .lower-body,.person-art .leg,.person-art .torso{transform-box:view-box}
/* Real SVG joint coordinates keep hands on anatomical arcs instead of
   rotating each bounding box around its own centre like rubber. */
.person-art .arm-l{transform-origin:72px 192px}.person-art .arm-r{transform-origin:148px 192px}
.person-art .arm-l .forearm{transform-origin:57px 237px}.person-art .arm-r .forearm{transform-origin:165px 232px}
.person-art .arm-l .hand{transform-origin:57px 278px}.person-art .arm-r .hand{transform-origin:176px 252px}
.person-art .lower-body{transform-origin:110px 287px}.person-art .leg-l{transform-origin:88px 291px}.person-art .leg-r{transform-origin:132px 291px}
.person-art .torso{transform-origin:110px 286px}
.person-art .lower-body{animation:bodyBalance 7s ease-in-out calc(var(--idle-phase,0s) * .6) infinite}
.person-art .leg-l{animation:legIdleL 7s ease-in-out calc(var(--idle-phase,0s) * 1.1) infinite}
.person-art .leg-r{animation:legIdleR 7s ease-in-out calc(var(--idle-phase,0s) * 1.9) infinite}
.person-art .arm-l{animation:armIdleL 5.2s ease-in-out calc(var(--idle-phase,0s) * 1.3) infinite}
.person-art .arm-r{animation:armIdleR 5.8s ease-in-out calc(var(--idle-phase,0s) * .8) infinite}
.person-art .arm-l .forearm{animation:forearmIdleL 6.4s ease-in-out calc(var(--idle-phase,0s) * 2.1) infinite}
.person-art .arm-r .forearm{animation:forearmIdleR 6.8s ease-in-out calc(var(--idle-phase,0s) * 1.5) infinite}
.person-art.listening .arm-l{animation:armIdleL 4s ease-in-out calc(var(--idle-phase,0s) * 1.3) infinite}
.person-art.listening .arm-r{animation:armIdleR 4.4s ease-in-out calc(var(--idle-phase,0s) * .8) infinite}
/* gestures belong to the voice, not to the scene state */
.person-art.voicing .arm-l{animation:armTalkL 2.3s ease-in-out infinite}
.person-art.voicing .arm-r{animation:armTalkR 2.9s ease-in-out infinite}
.person-art.voicing .arm-l .forearm{animation:forearmTalkL 2.3s ease-in-out infinite}
.person-art.voicing .arm-r .forearm{animation:forearmTalkR 2.15s ease-in-out infinite}

@keyframes armIdleR{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.6deg)}}
@keyframes armTalkL{0%,100%{transform:rotate(-1deg) translateY(0)}35%{transform:rotate(5deg) translateY(-4px)}70%{transform:rotate(1deg) translateY(-1px)}}
@keyframes armTalkR{0%,100%{transform:rotate(1deg) translateY(0)}40%{transform:rotate(-6deg) translateY(-5px)}75%{transform:rotate(-1deg) translateY(-1px)}}
@keyframes forearmIdleL{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.8deg)}}
@keyframes forearmIdleR{0%,100%{transform:rotate(0)}50%{transform:rotate(2.2deg)}}

@keyframes forearmTalkR{0%,100%{transform:rotate(1deg)}35%{transform:rotate(16deg) translateY(-2px)}70%{transform:rotate(6deg)}}

.person-art.listening .head{animation:headNod 3s ease-in-out infinite}
/* the short beat after an answer lands: taking it in before replying */
.person-art.thinking .head{animation:headThink 1.6s ease-in-out infinite}
.person-art.thinking .eyes{animation:blink 2.2s infinite}
@keyframes headThink{0%,100%{transform:rotate(0) translateY(0)}45%{transform:rotate(3.2deg) translateY(-2px)}}
.person-art.waiting .head,.person-art.speaking .head{animation:headIdle 6s ease-in-out calc(var(--idle-phase,0s) * .9) infinite}
/* The mouth and the talking head move only while a voice is actually
   playing (.voicing) — never merely because the scene says 'speaking',
   or the face keeps chattering after the sentence is over. */
.person-art.voicing .head{animation:headTalk 1.1s ease-in-out infinite}
/* fixed-rate mouth is the fallback; the syllable driver takes over on play */
.person-art.voicing .mouth{animation:mouthTalk .3s ease-in-out infinite}
.person-art.voicing .tongue{animation:tongueTalk .3s ease-in-out infinite}
.person-art.mouth-js .mouth,.person-art.mouth-js .tongue{animation:none!important;transition:transform .07s linear,opacity .07s linear}

/* Every redesigned character shares one layered face contract. Unlike the
   original stretched ellipse, each vowel has a deliberately drawn mouth. */
.person-art.modern-v2 .ground-shadow{animation:castShadow 4.4s ease-in-out var(--idle-phase,0s) infinite;transform-box:fill-box;transform-origin:center}
.person-art.modern-v2.voicing .hand{animation:handEmphasis 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.person-art.modern-v2 .face-lighting,.person-art.modern-v2 .body-lighting{transform-box:fill-box;transform-origin:center;transition:transform .35s ease}
.person-art.modern-v2 .hair-long-wavy,.person-art.modern-v2 .hair-bob-back,.person-art.modern-v2 .hair-curly-puff,.person-art.modern-v2 .travel-cap,.person-art.modern-v2 .pencil-accessory{transform-box:fill-box;transform-origin:50% 100%;animation:secondaryIdle 6.2s ease-in-out calc(var(--idle-phase,0s) * 1.4) infinite}
.person-art.modern-v2.voicing .hair-long-wavy,.person-art.modern-v2.voicing .hair-bob-back,.person-art.modern-v2.voicing .hair-curly-puff,.person-art.modern-v2.voicing .travel-cap,.person-art.modern-v2.voicing .pencil-accessory{animation:secondaryTalk 2s ease-in-out infinite}
.person-art.modern-v2 .teacher-lanyard,.person-art.modern-v2 .crossbody-strap,.person-art.modern-v2 .maya-headphones,.person-art.modern-v2 .waiter-apron{transform-box:fill-box;transform-origin:50% 0;animation:clothSettle 4.8s ease-in-out calc(var(--idle-phase,0s) * 2.3) infinite}
.person-art.modern-v2.tom-v2{--leg-l-angle:-.45deg;--leg-r-angle:.65deg}.person-art.modern-v2.maya-v2{--leg-l-angle:.55deg;--leg-r-angle:-.45deg}.person-art.modern-v2.sam-v2{--leg-l-angle:-.8deg;--leg-r-angle:.8deg}.person-art.modern-v2.alex-v2{--leg-l-angle:-.2deg;--leg-r-angle:.2deg}.person-art.modern-v2.nina-v2{--leg-l-angle:.45deg;--leg-r-angle:-.7deg}.person-art.modern-v2.ben-v2{--leg-l-angle:-1deg;--leg-r-angle:.55deg}.person-art.modern-v2.dana-v2{--leg-l-angle:-.35deg;--leg-r-angle:.75deg}
.person-art.modern-v2 .leg-l{transform:rotate(var(--leg-l-angle,0deg))}.person-art.modern-v2 .leg-r{transform:rotate(var(--leg-r-angle,0deg))}
/* One phase offset per character, fed into every idle loop rather than only
   into the blink. Each loop scales it differently, so two characters differ
   both from each other and in how their own parts relate. */
.person-art.modern-v2.tom-v2{--idle-phase:-1.1s}.person-art.modern-v2.maya-v2{--idle-phase:-3.8s}.person-art.modern-v2.sam-v2{--idle-phase:-2.2s}.person-art.modern-v2.alex-v2{--idle-phase:-4.7s}.person-art.modern-v2.nina-v2{--idle-phase:-.4s}.person-art.modern-v2.ben-v2{--idle-phase:-3s}.person-art.modern-v2.dana-v2{--idle-phase:-5.2s}
.person-art.modern-v2 .mouth{animation:none!important;transform:none!important}
.person-art.modern-v2 .eyes{animation:none}
.person-art.modern-v2 .mouth-shape{opacity:0;transition:opacity .055s linear}
.person-art.modern-v2[data-viseme="rest"] .mouth-rest,
.person-art.modern-v2:not([data-viseme]) .mouth-rest{opacity:1}
.person-art.modern-v2[data-viseme="a"] .mouth-a,
.person-art.modern-v2[data-viseme="default"] .mouth-a{opacity:1}
.person-art.modern-v2[data-viseme="e"] .mouth-e,
.person-art.modern-v2[data-viseme="i"] .mouth-e,
.person-art.modern-v2[data-viseme="y"] .mouth-e{opacity:1}
.person-art.modern-v2[data-viseme="o"] .mouth-o{opacity:1}
.person-art.modern-v2[data-viseme="u"] .mouth-u{opacity:1}
.person-art.modern-v2[data-viseme="m"] .mouth-m{opacity:1}
.person-art.modern-v2[data-viseme="f"] .mouth-f{opacity:1}
.person-art.modern-v2 .pupils,.person-art.modern-v2 .brows,.person-art.modern-v2 .cheeks{
  transform-box:fill-box;transform-origin:center;transition:transform .24s ease,opacity .24s ease
}

.person-art.modern-v2.listening .pupils{animation:castFocus 4.6s ease-in-out calc(var(--idle-phase,0s) * 1.6) infinite}

/* ---- weight, and layers that add instead of replace ----
   Two things were missing. The figure never transferred its weight: it swayed
   symmetrically around one spot forever, which is what a mannequin does. And
   every gesture REPLACED the idle animation on its element, so the pose
   jumped at the class swap and no two parts ever overlapped.

   animation-composition:add answers both. The weight cycle rides on top of
   the breath instead of erasing it, and a talk gesture rides on top of the
   arm idle instead of deleting it. Browsers without it keep exactly the
   previous behaviour, so this layers in as an enhancement, not a rewrite. */
@supports (animation-composition:add){
  /* 13.5s: hold on one leg, transfer, hold on the other. The holds are what
     make it read as weight rather than as more swaying. Hips lead, shoulders
     counter them, and the head — a sibling of both — stays level, which is
     what makes the contrapposto legible at phone size. */
  .person-art.modern-v2 .lower-body{
    animation:bodyBalance 7s ease-in-out calc(var(--idle-phase,0s) * .6) infinite,
              idleWeightHips 13.5s ease-in-out calc(var(--idle-phase,0s) * 2.6) infinite;
    animation-composition:replace,add
  }
  .person-art.modern-v2 .torso{
    animation:torsoBreathe 4.4s ease-in-out calc(var(--idle-phase,0s) * 1.7) infinite,
              idleWeightTorso 13.5s ease-in-out calc(var(--idle-phase,0s) * 2.6) infinite;
    animation-composition:replace,add
  }
  .person-art.modern-v2 .leg-l{
    animation:legIdleL 7s ease-in-out calc(var(--idle-phase,0s) * 1.1) infinite,
              idleWeightLegL 13.5s ease-in-out calc(var(--idle-phase,0s) * 2.6) infinite;
    animation-composition:replace,add
  }
  .person-art.modern-v2 .leg-r{
    animation:legIdleR 7s ease-in-out calc(var(--idle-phase,0s) * 1.9) infinite,
              idleWeightLegR 13.5s ease-in-out calc(var(--idle-phase,0s) * 2.6) infinite;
    animation-composition:replace,add
  }
  .person-art.modern-v2 .ground-shadow{
    animation:castShadow 4.4s ease-in-out var(--idle-phase,0s) infinite,
              idleWeightShadow 13.5s ease-in-out calc(var(--idle-phase,0s) * 2.6) infinite;
    animation-composition:replace,add
  }
  /* Talking now rides on the idle instead of replacing it: the slow drift
     survives underneath the gesture, and the pose no longer jumps the frame
     .voicing is added. The forearms start a fraction late so the limb reads
     as one chain with follow-through rather than two parts on one beat. */
  .person-art.modern-v2.voicing .head{
    animation:headIdle 6s ease-in-out calc(var(--idle-phase,0s) * .9) infinite,
              headTalk 1.1s ease-in-out infinite;
    animation-composition:replace,add
  }
  .person-art.modern-v2.voicing .arm-l{
    animation:armIdleL 5.2s ease-in-out calc(var(--idle-phase,0s) * 1.3) infinite,
              armTalkL 2.3s ease-in-out infinite;
    animation-composition:replace,add
  }
  .person-art.modern-v2.voicing .arm-r{
    animation:armIdleR 5.8s ease-in-out calc(var(--idle-phase,0s) * .8) infinite,
              armTalkR 2.9s ease-in-out infinite;
    animation-composition:replace,add
  }
  .person-art.modern-v2.voicing .arm-l .forearm{
    animation:forearmIdleL 6.4s ease-in-out calc(var(--idle-phase,0s) * 2.1) infinite,
              forearmTalkL 2.3s ease-in-out .13s infinite;
    animation-composition:replace,add
  }
  .person-art.modern-v2.voicing .arm-r .forearm{
    animation:forearmIdleR 6.8s ease-in-out calc(var(--idle-phase,0s) * 1.5) infinite,
              forearmTalkR 2.15s ease-in-out .11s infinite;
    animation-composition:replace,add
  }
}

     instant jump on every beat — exactly what reduced motion asks us not to
     do. Flatten the offsets instead of merely un-animating them. */
  .stage-avatar{--travel-x:0px;--travel-y:0px;--travel-scale:1}
  .person-art *,.stage-bg .ambient,.stage-bg .context-motion *,.stage-bg .scene-depth,.stage-bg .backdrop-far,.stage-bg .backdrop-mid,.stage-bg .scene-light-beam,.stage-bg .scene-ground-light,.stage-bg .backdrop-art,.stage-moment-fx *{animation:none!important;transition:none!important}
  .stage-story-props *,.stage-weather-layer *{animation:none!important;transition:none!important}
  .wall-light-moving,.wall-light-source,.wall-light-final,.mirror-light-fx *,
  .mirror-source-prop,.mirror-source-prop *,.mirror-window-prop,.mirror-window-prop *,
  .sam-door-story,.sam-door-story *{animation:none!important;transition:none!important}
  .stage-bg.has-mirror-light-final .wall-light-final,.stage-bg.has-mirror-light-final .mirror-window-prop{opacity:1!important;transform:none!important}
  .stage-bg.has-mirror-light-moving .wall-light-moving,.stage-bg.has-mirror-light-source .wall-light-source{transform:none!important}
  .stage-action-place-mirror .held-mirror-art{opacity:0!important}
  .stage-prop.is-leaving,.prop-photo.at-flying.is-catching,.prop-ball.is-recovering,.prop-ball.is-recovering-from-hoop,.rain-field.is-clearing{display:none}
  .stage-action-place-brushes .held-brushes-art,.stage-action-hand-over-phone .held-phone-art,.stage-action-phone-to-desk .held-phone-art,.prop-phone.at-floor.is-pickup-source{opacity:0!important}
  .stage-action-pick-up-phone .held-phone-art{opacity:1!important}
  .stage-action-return-photo .held-photo-art,.stage-action-lose-ball .held-ball-art,.stage-action-score-ball .held-ball-art{opacity:0!important}
  .stage-action-catch-photo .held-photo-art,.stage-action-recover-ball .held-ball-art{opacity:1!important}
  .prop-story-card.is-changing .story-prop-before{display:none}.prop-story-card.is-changing .story-prop-after{opacity:1!important;transform:none!important}
  .physical-story-prop.is-changing .physical-before{display:none}.physical-story-prop.is-changing .physical-after{opacity:1!important;transform:none!important}
  .stage-bg.is-sam-cargo-lifting .sam-cargo-stage,.stage-action-set-down-cargo .sam-held-cargo-art,
  .prop-sam-learner-bag.is-returning{opacity:0!important}
  .stage-action-close-door .person-art{opacity:.74!important;transform:translate(24px,-2px) scale(.94)!important;filter:brightness(.78) saturate(.84)!important}
  .stage-moment-fx{display:none}
  .rain-field:not(.is-clearing) i:nth-of-type(4n+1){top:8%}
  .rain-field:not(.is-clearing) i:nth-of-type(4n+2){top:31%}
  .rain-field:not(.is-clearing) i:nth-of-type(4n+3){top:55%}
  .rain-field:not(.is-clearing) i:nth-of-type(4n){top:78%}
}
.motion-paused .stage-bg *,.motion-paused .person-art *,
.motion-paused .stage-story-props *,.motion-paused .stage-moment-fx *{
  animation-play-state:paused!important
}
.stage-name{font-size:19px;font-weight:850;text-align:center}
.stage-name span{font-size:13px;font-weight:600;color:var(--dim);font-style:italic}
/* whose turn it is, readable at a glance rather than as fine print */
.stage-status{display:inline-flex;align-items:center;gap:7px;align-self:center;font-size:15px;font-weight:800;line-height:1;
  padding:8px 15px;border-radius:999px;margin-bottom:2px;white-space:nowrap;
  background:rgba(148,163,184,.14);border:1.5px solid rgba(148,163,184,.3);color:var(--fg);
  transition:background .18s ease,border-color .18s ease,color .18s ease}
.stage-status .cue-icon{font-size:16px;line-height:1}
.stage-status.cue-listening{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.65);color:#6ee7b7}
.stage-status.cue-heard{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:#6ee7b7}
.stage-status.cue-speaking{background:color-mix(in srgb, var(--who) 20%, transparent);border-color:color-mix(in srgb, var(--who) 60%, transparent)}
.stage-status.cue-thinking,.stage-status.cue-incoming{color:var(--dim)}
.stage-status.cue-thinking .cue-icon{animation:cuePulse 1.1s ease-in-out infinite}
@keyframes cuePulse{0%,100%{opacity:.45}50%{opacity:1}}
.stage-caption{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:center}
/* a beat change swaps the words, not the scene: the new caption and composer
   glide in while the figure keeps breathing behind them */
.stage-swap{animation:stageSwap .3s ease both}
@keyframes stageSwap{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage-caption.stage-swap:has(.cap-sequence){animation:none}
.stage-caption.stage-swap:has(.cap-sequence) .cap-current{animation:capCurrentEnter .3s ease both}
@keyframes capCurrentEnter{from{opacity:.28;transform:translateY(5px)}to{opacity:1;transform:none}}
.cap-en{direction:ltr;font-size:25px;font-weight:800;line-height:1.35}
.cap-aid{margin-top:8px;font-size:16px;color:var(--dim)}
.cap-aid.auto-translation{direction:rtl;max-width:410px;margin:10px auto 0;padding-top:9px;
  border-top:1px solid rgba(148,163,184,.18);font-size:15.5px;font-weight:600;line-height:1.45;
  color:#bdc8dc}
.cap-aid.auto-translation.delayed{opacity:0;transform:translateY(-3px);
  animation:capTranslationReveal .28s ease .9s forwards}
@keyframes capTranslationReveal{to{opacity:1;transform:none}}
.cap-aid.tl{color:var(--amber);font-weight:700}
.cap-aid[hidden]{display:none}
.cap-actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* One bubble, one read. The earlier line is a quieter block above a hairline
   — no second border, no inset panel, nothing that reads as another card. */
.cap-sequence{display:grid;gap:10px}
.cap-previous{padding:0 2px 10px;border:none;background:none;
  border-bottom:1px solid rgba(148,163,184,.17);direction:ltr;text-align:center}
.cap-previous-en{direction:ltr;font-size:19px;font-weight:700;line-height:1.32;color:#c6d2e6}
.cap-previous-he{direction:rtl;margin-top:3px;font-size:14.5px;font-weight:600;line-height:1.38;color:#9fadc5}
/* Inside a pair the single hairline between the two sentences is the only
   divider. The translation keeps its own rule when a line stands alone, but
   here a second one would box the current sentence and rebuild the two-card
   look this change exists to remove. Both entries then read identically:
   English, its Hebrew under it, nothing between them. */
.cap-sequence .cap-aid.auto-translation{border-top:none;margin-top:5px;padding-top:0}
.cap-typing{font-size:16px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px}
.cap-intent{font-size:23px;font-weight:800;line-height:1.35}
.cap-intent-note{font-size:13.5px;color:var(--dim);margin-top:6px}
.cap-sent{font-size:18px;font-weight:700;color:var(--green)}
@media (min-height:701px) and (max-height:960px){
  .stage-screen .stage:has(.cap-pair){--avatar:clamp(118px,19vh,158px)}
}
@media (min-height:701px) and (max-height:760px){
  .stage-screen .stage:has(.cap-pair){--avatar:clamp(112px,18vh,146px)}
}
@media (max-width:390px){
  .cap-sequence{gap:9px}.cap-previous{padding-bottom:9px}
  .cap-previous-en{font-size:18px}.cap-previous-he{font-size:14px}
  .cap-actions{gap:6px}
}
@media (max-width:350px){
  .stage-screen .stage:has(.cap-pair){--avatar:clamp(106px,18vh,138px)}
  .cap-previous-en{font-size:16.5px}.cap-previous-he{font-size:13.5px}
}
@media (max-height:700px){
  .cap-en{font-size:22px}.cap-intent{font-size:20px}
  .stage-screen .stage{--avatar:clamp(112px,20vh,148px);gap:6px;padding-top:8px}
  .stage-screen .stage:has(.cap-pair){--avatar:clamp(108px,18vh,136px)}
  .stage-screen .stage-caption{padding:12px}
}
@media (max-height:620px){
  .stage-screen .stage{--avatar:clamp(108px,19vh,124px);gap:4px;padding:5px 12px}
  .stage-screen .stage:has(.cap-pair){--avatar:clamp(104px,17vh,116px)}
  .stage-place{font-size:12px}.stage-name{font-size:16px}.stage-name span{font-size:11.5px}
  .stage-status{font-size:13px;padding:6px 11px}
  .stage-screen .stage-caption{padding:10px 11px;border-radius:15px}
  .cap-en{font-size:20px;line-height:1.28}
  .cap-aid.auto-translation{margin-top:7px;padding-top:6px;font-size:14px;line-height:1.38}
  .cap-sequence{gap:8px}.cap-previous{padding-bottom:8px}
  .cap-previous-en{font-size:17px}.cap-previous-he{font-size:13.5px;margin-top:3px}
  .cap-actions{margin-top:8px}
}
@media (prefers-reduced-motion:reduce){.cap-aid.auto-translation.delayed{animation:none;opacity:1;transform:none}}
.scene-note{background:rgba(148,163,184,.09);border-inline-start:3px solid rgba(148,163,184,.45);border-radius:10px;padding:10px 12px;font-size:14.5px;color:#c2cde3;font-style:italic;line-height:1.5;margin:10px 0}
.scene-note.in-log{margin:0 0 14px}
.story-event{display:flex;align-items:center;gap:8px;direction:rtl;text-align:right;background:rgba(251,191,36,.11);border:1px solid rgba(251,191,36,.3);border-radius:12px;padding:8px 10px;margin-bottom:10px;color:#ffe5a2;font-size:13.5px;font-weight:750;line-height:1.4}
.story-event .event-emoji{font-size:20px;flex-shrink:0}
.story-event.in-log{margin:8px 0}
.person-role{font-size:12px;font-weight:600;color:var(--dim);font-style:italic}
.practice-cta{background:linear-gradient(135deg,#7c6cf0,#5b4bd6);color:#fff;text-align:center}
.practice-cta small{display:block;font-size:12.5px;font-weight:600;opacity:.85;margin-top:3px}
.scene{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);border-radius:14px;padding:11px 14px;font-size:15.5px;font-weight:700;color:#b9d4fb;margin-bottom:14px}
.chat-thread .dlg-line:last-child{margin-bottom:0}
.conversation-screen{
  height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 28px);
  min-height:520px;display:flex;flex-direction:column;overflow:hidden;animation:fadeUp .25s ease both;
}
.conversation-top{display:flex;align-items:center;gap:10px;padding:10px 0 8px;flex-shrink:0}
.conversation-top .xbtn{width:44px;height:44px}
.conversation-top .timer{min-width:40px}
.conversation-person{
  flex-shrink:0;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#172844,#152139);
  border:1px solid var(--line);border-radius:16px;padding:9px 11px;margin-bottom:8px;
}
.conversation-person .portrait{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;

}
.conversation-person .person-copy{flex:1;min-width:0}
.conversation-person .person-name{font-size:16px;font-weight:850;line-height:1.25}
.conversation-person .person-scene{font-size:12.5px;color:#b9c6e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conversation-person .mission{

.conversation-log .chat-thread{margin:0}
.conversation-log .dlg-line{direction:ltr;margin-bottom:10px;align-items:flex-end}
.conversation-log .dlg-bubble{max-width:86%;padding:10px 12px;box-shadow:0 5px 14px rgba(0,0,0,.14)}
.conversation-log .dlg-en{font-size:17px;line-height:1.35}
.conversation-log .dlg-avatar{width:34px;height:34px;font-size:18px}
.conversation-log .bubble-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;direction:ltr}
.conversation-log .bubble-speaker{font-size:11.5px;font-weight:800;color:var(--dim);flex:1}
.bubble-action{
  border:0;background:rgba(96,165,250,.13);color:var(--blue);border-radius:9px;min-width:44px;min-height:44px;
  padding:5px 8px;font:inherit;font-size:14px;font-weight:750;cursor:pointer;
}
.bubble-help-actions{display:flex;gap:6px;margin-top:7px;direction:rtl}
.bubble-help-actions .bubble-action{min-height:44px;color:#b9c6e2;background:rgba(255,255,255,.055);font-size:12.5px}
.bubble-help{border-top:1px solid rgba(255,255,255,.08);margin-top:7px;padding-top:6px;direction:rtl;text-align:right}
.bubble-help .dlg-he{font-size:15px;color:#c4cee2;margin:0}
.bubble-help .dlg-tl{font-size:15px;margin:4px 0 0}
.history-toggle{
  display:block;margin:2px auto 12px;border:1px solid var(--line);background:var(--card);color:#b9c6e2;
  border-radius:99px;padding:7px 13px;min-height:44px;font:inherit;font-size:12.5px;font-weight:750;cursor:pointer;
}
.typing-line .dlg-bubble{color:var(--dim)}
.conversation-current .dlg-bubble{border-color:rgba(96,165,250,.5);box-shadow:0 0 0 2px rgba(96,165,250,.07)}
.conversation-composer{
  flex-shrink:0;background:linear-gradient(160deg,#1b2946,#17223a);border:1px solid var(--line);
  border-radius:20px 20px 14px 14px;padding:11px 12px 10px;box-shadow:0 -8px 28px rgba(5,10,20,.32);
  max-height:48dvh;overflow-y:auto;
}
.composer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.composer-label{color:var(--blue);font-size:12.5px;font-weight:850}
.composer-intent{font-size:19px;font-weight:850;line-height:1.3;text-align:center;margin:2px 0 8px}
.composer-note{font-size:12.5px;color:var(--dim);text-align:center;margin-top:5px}
.composer-actions{display:flex;align-items:center;justify-content:center;gap:9px}
.composer-actions .bubble-action{min-width:44px;min-height:44px;font-size:16px}
.conversation-mic{
  width:70px;height:70px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;font-size:29px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.conversation-mic.listening{animation:pulse 1.4s infinite;background:linear-gradient(135deg,#f87171,#ef4444)}
.conversation-composer .heard{margin:6px 0 0;min-height:0;font-size:13px;text-align:center}
.conversation-composer .result-msg{font-size:14.5px;padding:8px 12px;margin:7px auto 0}
.conversation-composer .word-feedback{margin-top:6px}
.conversation-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.conversation-option{

  padding:9px 10px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;line-height:1.25;
  display:flex;align-items:center;justify-content:center;gap:8px;position:relative;
}
.conversation-option:active{transform:scale(.98)}
.conversation-option:last-child:nth-child(odd){grid-column:1/-1}
.conversation-option .choice-copy{flex:1;text-align:center}
.conversation-option .choice-mic-icon{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:rgba(52,211,153,.16);color:var(--green);font-size:17px;box-shadow:inset 0 0 0 1px rgba(52,211,153,.28);transition:transform .16s ease,background .16s ease}
.conversation-option:active .choice-mic-icon{transform:scale(.9);background:rgba(52,211,153,.28)}
.flow-controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 7px;color:var(--dim);font-size:12px}

.word-feedback span.missing{background:rgba(251,191,36,.12);color:var(--amber)}
.resume-note{color:#b9c6e2;font-size:14.5px;margin:8px 0 14px}

/* ---------- the real-world mission ----------
   The one card in the app that is not about the app. Amber, warm and set
   apart from the blue of the lessons, because it asks for something the
   lessons never do: to go outside and use it. */
.unit-cta{background:linear-gradient(150deg,#3a2f14,#241d10);border:1px solid rgba(251,191,36,.45)}
.unit-cta .tag{color:var(--amber)}
.mission-card{background:linear-gradient(150deg,#33290f,#20190c);border:1px solid rgba(251,191,36,.42);
  border-radius:var(--radius);padding:16px 14px;margin:14px 0;text-align:right}
.mission-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.mission-emoji{font-size:34px;line-height:1;flex-shrink:0}
.mission-tag{color:var(--amber);font-size:12.5px;font-weight:800}
.mission-title{font-size:19px;font-weight:850;line-height:1.3}
.mission-what{font-size:15.5px;line-height:1.55;color:#e8ddc4;margin:0 0 12px}
.mission-lines{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.mission-line{display:flex;align-items:center;gap:10px;width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(251,191,36,.22);border-radius:12px;padding:10px 12px;min-height:44px;
  color:var(--text);font:inherit;font-size:16px;font-weight:750;cursor:pointer;text-align:left}
.mission-line span[dir=ltr]{flex:1}
.mission-tip{background:rgba(0,0,0,.22);border-radius:11px;padding:10px 12px;font-size:14px;
  line-height:1.5;color:#cfc3a6;margin-bottom:12px}
/* the softer way in: saying it out loud somewhere safe still counts */
.mission-soft{border-top:1px dashed rgba(251,191,36,.3);margin-top:14px;padding-top:12px;font-size:14px;line-height:1.5;color:#e8ddc4}
.mission-soft b{display:block;color:var(--amber);margin-bottom:2px}
.mission-soft .btn{margin-top:10px;font-size:15px;padding:12px 16px}
.mission-snoozed{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:var(--card);border:1px solid rgba(251,191,36,.3);
  border-radius:14px;padding:10px 14px;margin:14px 0;color:var(--text);font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;text-align:right}
.mission-snoozed span:last-child{color:var(--amber);font-size:13px;white-space:nowrap}
/* in-app confirmation sheet, instead of the browser's "index.html says" box */
.dialog-sheet{border-radius:24px 24px 0 0;text-align:right}
.dialog-sheet h3{margin-bottom:8px}
.dialog-text{color:var(--dim);font-size:15.5px;line-height:1.5;margin-bottom:18px}
.btn.danger{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeUp .2s ease}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px;border-top:1px solid var(--line)}
.sheet h3{font-size:20px;margin-bottom:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:16px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{border:none;background:transparent;color:var(--dim);font-family:inherit;font-weight:700;font-size:14px;padding:7px 14px;border-radius:9px;cursor:pointer;min-height:44px}
.seg button.on{background:var(--green);color:#06281c}
.name-edit{background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font-size:16px;font-family:inherit;width:140px;outline:none}
.name-edit:focus{border-color:var(--green)}
.profile-select,.profile-input{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--text);

     travel across the screen, parallax, spin, camera moves — not a request to
     be taught English by a corpse. The blanket rule above stops everything,
     including the breath, the blink and the mouth; on its own it leaves a
     frozen mask that reads as a broken app rather than a calm one.

     So the vestibular offenders stay off, and the three signs of life come
     back: a chest that breathes (1px), eyes that blink (opacity only), and a
     mouth that still forms the word being spoken. None of them translate the
     figure or move the frame. The weight shift, the parallax, the camera and

     above and the `.person-art *` rule in the stage block, so these win

function conversationRounds(idx){
  // the added rounds always sit between the opening and the closing, so a
  // conversation still opens and ends exactly where it used to
  const added=[MIDDLE_ROUNDS[idx],EXTRA_ROUNDS[idx]].filter(Boolean);
  const finale=FINALE_ROUND_OVERRIDES[idx]||BRANCH_DIALOGUES[idx];
  if(finale) return [finale.rounds[0],...added,...finale.rounds.slice(1)];
  const opening=OPENING_ROUNDS[idx];
  const closing=CLOSING_ROUND_OVERRIDES[idx]||{
    ask:LESSONS[idx].dialogue[6],options:LESSON_CHOICES[idx]?.options||[],
  };
  if(!opening) return [];
  return [opening,...added,closing];
}

   assembled rather than scripted: character × place × topic × which turns,
   so the same word pool yields dozens of distinct conversations. Every turn

   something not yet taught. A turn may declare a role — 'open' belongs at
   the start of a conversation, 'close' at its end; everything else is a
   middle. A turn marked stay depends on its topic's context (a price needs

   another topic's conversation. The builder respects both, so the talk
