name: Sam audio once
on:
  push:
    branches: [ai/sam-audio-once]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ai/sam-audio-once}
      - name: Inspect audio calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          key='samRunSpeakLane'
          pos=0
          while True:
            i=s.find(key,pos)
            if i<0: break
            print('\n--- OCCURRENCE',i,'---')
            print(s[max(0,i-700):i+1100])
            pos=i+len(key)
          PY
