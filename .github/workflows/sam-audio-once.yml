name: Sam audio once
on:
  push:
    branches: [ai/sam-audio-once]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sam-audio-once
      - run: node tools/sam-audio-once.mjs
      - run: node --test tests/app.test.mjs
      - run: |
          git config user.name 'Sam audio fix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html tests/app.test.mjs service-worker.js
          git commit -m 'Play listening word once per question'
          git push
