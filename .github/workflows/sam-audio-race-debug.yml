name: Sam audio race debug
on:
  push:
    branches: [ai/sam-audio-race-debug]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sam-audio-race-debug
      - run: node tools/sam-audio-race-fix.mjs
      - run: node --test tests/app.test.mjs
      - run: |
          git config user.name 'Sam audio fix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html tests/app.test.mjs service-worker.js
          git commit -m 'Prevent listening prompt double playback'
          git push
