name: Sam 3D visual rebuild
on:
  push:
    branches: [ai/sam-3d-visual-rebuild]
    paths:
      - '.github/workflows/sam-3d-extract.yml'
      - 'tools/polish-sam-3d.mjs'
      - 'tools/trigger-sam-3d.txt'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sam-3d-visual-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild Sam visual rig
        run: node tools/polish-sam-3d.mjs
      - name: Run app tests
        run: node --test tests/app.test.mjs
      - name: Commit rebuilt game
        run: |
          git config user.name "Sam 3D Visual Rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Sam 3D character and running silhouette"
          git push
